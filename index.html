function EmployeesView() {
  const ops = useOps();
  const { employees, stores, clients } = ops;
  const [search, setSearch] = useState("");
  const [fClient, setFClient] = useState("");
  const [fStore, setFStore] = useState("");
  const [fEstado, setFEstado] = useState("Ativo");
  const [modal, setModal] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const storeOf = (id) => stores.find((s) => s.id === id);
  const clientOf = (s) => (s ? clients.find((c) => c.id === s.clienteId) : null);
  const filtered = employees.filter((e) => {
    const s = storeOf(e.lojaId);
    if (search && !normTxt(e.nome).includes(normTxt(search))) return false;
    if (fClient && (!s || s.clienteId !== fClient)) return false;
    if (fStore && e.lojaId !== fStore) return false;
    if (fEstado && (fEstado === "Ativo" ? e.estado === "Desligado" : e.estado !== "Desligado")) return false;
    return true;
  }).sort((a, b) => a.nome.localeCompare(b.nome));
  const remove = async (emp) => { await col("employees").doc(emp.id).delete(); logHistory("Eliminou", "Colaborador", emp.nome, ""); setDeleting(null); ops.toast("success", `${emp.nome} eliminado.`); };
  const storeOpts = stores.filter((s) => !fClient || s.clienteId === fClient).sort((a, b) => a.nome.localeCompare(b.nome));
  return (
    <div className="page fade-in">
      <PageHeader title="Colaboradores" subtitle={`${employees.filter((e) => e.estado !== "Desligado").length} ativos · ${employees.filter((e) => e.estado === "Desligado").length} desligados`}
        right={<button onClick={() => setModal({ mode: "new" })} className="btn btn-primary"><Icon path={ICONS.plus} size={15} />Novo colaborador</button>} />
      <div className="toolbar mb-3">
        <div className="relative flex-1 min-w-[200px]"><Icon path={ICONS.search} size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]" /><input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Pesquisar colaborador…" className="input pl-9" /></div>
        <select value={fClient} onChange={(e) => { setFClient(e.target.value); setFStore(""); }} className="input w-auto"><option value="">Todos os clientes</option>{clients.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}</select>
        <select value={fStore} onChange={(e) => setFStore(e.target.value)} className="input w-auto"><option value="">Todas as lojas</option>{storeOpts.map((s) => <option key={s.id} value={s.id}>{s.nome}</option>)}</select>
        <Seg value={fEstado} onChange={setFEstado} size="sm" options={[["Ativo", "Ativos"], ["Desligado", "Desligados"], ["", "Todos"]]} />
      </div>
      <div className="card overflow-hidden">
        <div className="overflow-x-auto">
          <table className="tbl min-w-[860px]">
            <thead><tr><th>Nome</th><th>Cliente · Loja</th><th>Turno</th><th>Função</th><th>Veículo</th><th>Folga fixa</th><th>Estado</th><th className="text-right">Ações</th></tr></thead>
            <tbody>
              {filtered.map((e) => { const s = storeOf(e.lojaId); const c = clientOf(s); return (
                <tr key={e.id} className="clickable" onClick={() => ops.openEmployee(e.id)}>
                  <td className="font-semibold">{e.nome}</td>
                  <td><span className="text-[var(--text-secondary)]">{c ? c.nome : "—"}</span> · {s ? s.nome : <span className="text-red-500">loja inexistente</span>}</td>
                  <td>{e.turno}</td><td>{e.funcao}</td><td className="text-[var(--text-secondary)]">{e.veiculo || "—"}</td>
                  <td className="text-xs">{(e.folgaFixa || []).length ? (e.folgaFixa || []).slice().sort().map((d) => DIAS_SEMANA[d]).join(", ") : "—"}</td>
                  <td>{e.estado === "Desligado" ? <span className="tag tag-red">Desligado {e.desligadoData ? fmtDMY(e.desligadoData) : "(sem data)"}</span> : e.dataEntrada && e.dataEntrada > todayISO() ? <span className="tag tag-blue">Entra {fmtDMY(e.dataEntrada)}</span> : <span className="tag tag-green">Ativo{e.dataEntrada ? ` · desde ${fmtDMY(e.dataEntrada)}` : ""}</span>}</td>
                  <td onClick={(ev) => ev.stopPropagation()}><div className="flex justify-end gap-1">
                    <button onClick={() => setModal({ mode: "edit", data: e })} className="icon-btn" title="Editar"><Icon path={ICONS.edit} size={15} /></button>
                    <button onClick={() => setDeleting(e)} className="icon-btn text-red-500" title="Eliminar"><Icon path={ICONS.trash} size={15} /></button>
                  </div></td>
                </tr>
              ); })}
              {filtered.length === 0 && <tr><td colSpan={8}><EmptyState title="Nenhum colaborador encontrado" text="Ajusta a pesquisa ou os filtros." /></td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      {modal && <EmployeeModal employee={modal.data} stores={stores} onClose={() => setModal(null)} onSave={async (d) => { if (await ops.saveEmployee(d)) setModal(null); }} />}
      {deleting && (
        <Modal title="Eliminar colaborador" onClose={() => setDeleting(null)} width="max-w-md">
          <p className="text-sm text-[var(--text-secondary)] mb-3">Eliminar <b className="text-[var(--text-primary)]">{deleting.nome}</b> remove a ficha. As células da grelha mantêm-se, mas passam a aparecer como “Colaborador removido / Sem loja” nas análises.</p>
          <p className="text-sm mb-5"><b>Recomendado:</b> marcar como <b>Desligado</b> com data de saída — preserva o histórico atribuído ao cliente e à loja.</p>
          <div className="flex justify-end gap-2 flex-wrap">
            <button onClick={() => setDeleting(null)} className="btn btn-ghost">Cancelar</button>
            <button onClick={() => { setModal({ mode: "edit", data: { ...deleting, estado: "Desligado", desligadoData: deleting.desligadoData || todayISO() } }); setDeleting(null); }} className="btn btn-ghost">Marcar como Desligado</button>
            <button onClick={() => remove(deleting)} className="btn btn-danger">Eliminar mesmo assim</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function EmployeeDrawer({ empId, onClose }) {
  const ops = useOps();
  const emp = ops.employees.find((e) => e.id === empId);
  const [edit, setEdit] = useState(false);
  const curMk = ops.monthOptions[ops.monthOptions.length - 1];
  const months = useMemo(() => monthWindow(curMk, 6), [curMk]);
  const data = useOpsData({ months, stores: ops.stores, employees: ops.employees, clients: ops.clients, getScheduleForMonth: ops.getScheduleForMonth, enabled: ops.refsReady });
  const recs = useMemo(() => data.recs.filter((r) => r.empId === empId), [data.recs, empId]);
  const abs = recs.filter(isAbsence);
  const c = countRecs(recs);
  const t = todayISO();
  const last30 = abs.filter((r) => r.date > shiftISO(t, -30) && r.date <= t).length;
  const prev30 = abs.filter((r) => r.date > shiftISO(t, -60) && r.date <= shiftISO(t, -30)).length;
  const prevWindowHasData = !!data.monthHasData[mkOfISO(shiftISO(t, -59))] || !!data.monthHasData[mkOfISO(shiftISO(t, -31))];
  const monthsWithAbs = months.filter((mk) => abs.some((r) => r.mk === mk));
  let consecMonths = 0, run = 0; months.forEach((mk) => { if (abs.some((r) => r.mk === mk)) { run++; consecMonths = Math.max(consecMonths, run); } else run = 0; });
  const pattern = abs.length === 0 ? { l: "Sem faltas registadas", tone: "#16a34a", why: "Nenhuma falta (com ou sem backup) nos meses analisados." }
    : abs.length === 1 ? { l: "Ocorrência isolada", tone: "#64748b", why: "Uma única falta no período — não constitui padrão." }
    : last30 >= 3 || consecMonths >= 3 ? { l: "Padrão recorrente", tone: "#dc2626", why: last30 >= 3 ? `${last30} faltas nos últimos 30 dias (critério: ≥ 3).` : `Faltas em ${consecMonths} meses consecutivos (critério: ≥ 3).` }
    : { l: "Ocorrências pontuais", tone: "#d97706", why: `${abs.length} faltas em ${monthsWithAbs.length} mês(es); abaixo dos critérios de recorrência (≥3 em 30 dias ou 3 meses seguidos).` };
  const chart = { labels: months.map(monthShort), datasets: [
    { label: "Com backup", data: months.map((mk) => (data.monthHasData[mk] ? abs.filter((r) => r.mk === mk && r.cob !== "sem").length : null)), backgroundColor: "#0d9488" },
    { label: "Sem reposição", data: months.map((mk) => (data.monthHasData[mk] ? abs.filter((r) => r.mk === mk && r.cob === "sem").length : null)), backgroundColor: "#ef4444" },
  ] };
  const timeline = recs.filter((r) => r.st !== "OK").sort((a, b) => b.date.localeCompare(a.date));
  if (!emp) return <Drawer title="Colaborador" onClose={onClose}><EmptyState title="Colaborador não encontrado" text="Pode ter sido eliminado." /></Drawer>;
  const s = ops.stores.find((x) => x.id === emp.lojaId);
  const cl = s ? ops.clients.find((x) => x.id === s.clienteId) : null;
  const dow = [0, 0, 0, 0, 0, 0, 0]; abs.forEach((r) => dow[r.dow]++);
  return (
    <Drawer title={emp.nome} subtitle={`${cl ? cl.nome : "Sem cliente"} · ${s ? s.nome : "loja inexistente"} · ${emp.funcao || "—"} · ${emp.turno || "—"}`} onClose={onClose}
      actions={<button onClick={() => setEdit(true)} className="btn btn-ghost btn-sm"><Icon path={ICONS.edit} size={13} />Editar</button>}>
      <div className="flex flex-wrap gap-2 mb-5">
        {emp.estado === "Desligado" ? <span className="tag tag-red">Desligado {emp.desligadoData ? `· saída ${fmtDMY(emp.desligadoData)}` : "(sem data)"}</span> : <span className="tag tag-green">Ativo</span>}
        {(emp.folgaFixa || []).length > 0 && <span className="tag">Folga fixa: {(emp.folgaFixa || []).slice().sort().map((d) => DIAS_SEMANA[d]).join(", ")}</span>}
        {emp.veiculo && <span className="tag"><Icon path={ICONS.car} size={10} />{emp.veiculo}</span>}
        <button onClick={() => { onClose(); ops.nav("daily", { date: t, clientId: cl ? cl.id : "_none" }); }} className="btn btn-ghost btn-xs ml-auto"><Icon path={ICONS.calendarCheck} size={13} />Registo de hoje</button>
      </div>
      {data.status !== "ready" ? <Skeleton rows={4} /> : (
        <>
          <div className="pattern mb-5" style={{ borderColor: pattern.tone + "55", background: pattern.tone + "0d" }}>
            <div className="text-sm font-extrabold" style={{ color: pattern.tone }}>{pattern.l}</div>
            <div className="text-xs text-[var(--text-secondary)] mt-0.5">{pattern.why}</div>
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
            <div className="mini"><span>Registos (6m)</span><b>{postosOf(c)}</b><em>{c.ok} OK</em></div>
            <div className="mini"><span>Faltas (6m)</span><b style={{ color: abs.length ? "#dc2626" : undefined }}>{abs.length}</b><em>{totalRepostas(c)} com backup · {c.sem} sem</em></div>
            <div className="mini"><span>Últimos 30 dias</span><b>{last30}</b><em>{prevWindowHasData ? (last30 === prev30 ? "= 30 dias anteriores" : <span style={{ color: last30 > prev30 ? "#dc2626" : "#16a34a" }}>{last30 > prev30 ? "▲" : "▼"} vs {prev30} nos 30 anteriores</span>) : "sem base de comparação"}</em></div>
            <div className="mini"><span>Sem reposição</span><b style={{ color: c.sem ? "#dc2626" : undefined }}>{c.sem}</b><em>das faltas</em></div>
          </div>
          <div className="grid md:grid-cols-2 gap-5 mb-5">
            <div><div className="section-label">Faltas por mês</div><ChartCanvas type="bar" data={chart} options={barStackOpts} height={190} /></div>
            <div><div className="section-label">Por dia da semana</div>
              <div className="grid grid-cols-7 gap-1.5 mt-3">{DIAS_SEMANA.map((d, i) => { const mx = Math.max(1, ...dow); return <div key={d} className="text-center"><div className="text-[10px] text-[var(--text-secondary)] font-semibold mb-1">{d}</div><div className="rounded-md h-12 flex items-center justify-center text-sm font-bold" style={{ background: dow[i] ? `rgba(239,68,68,${0.12 + 0.7 * dow[i] / mx})` : "var(--hover)", color: dow[i] / mx > 0.55 ? "#fff" : dow[i] ? "#991b1b" : "var(--text-secondary)" }}>{dow[i]}</div></div>; })}</div>
              <p className="text-[11px] text-[var(--text-secondary)] mt-2">Distribuição descritiva; com poucas ocorrências não indica padrão.</p>
            </div>
          </div>
          <div className="section-label">Cronologia (estados diferentes de OK · 6 meses)</div>
          <OccurrenceTable items={timeline} maxH={360} />
          <p className="text-[11px] text-[var(--text-secondary)] mt-2">Folgas fixas automáticas não aparecem (não são gravadas). Cliente/loja de cada registo segundo a alocação do colaborador na data (histórico de mudanças de loja disponível a partir desta versão).</p>
        </>
      )}
      {edit && <EmployeeModal employee={emp} stores={ops.stores} onClose={() => setEdit(false)} onSave={async (d) => { if (await ops.saveEmployee(d)) setEdit(false); }} />}
    </Drawer>
  );
}

/* ====================================================================== */
/* HISTÓRICO E RELATÓRIOS                                                  */
/* ====================================================================== */
function monthsBetween(fromIso, toIso) {
  const out = []; let mk = mkOfISO(fromIso); const end = mkOfISO(toIso);
  while (mk <= end && out.length < 13) { out.push(mk); mk = shiftMonth(mk, 1); }
  return out;
}
const SORTS = { date: (a, b) => a.date.localeCompare(b.date), emp: (a, b) => a.emp.localeCompare(b.emp), client: (a, b) => a.client.localeCompare(b.client), store: (a, b) => a.store.localeCompare(b.store), st: (a, b) => a.st.localeCompare(b.st), cob: (a, b) => (a.cob || "").localeCompare(b.cob || "") };

function ReportsView({ params }) {
  const ops = useOps();
  const { stores, employees, clients } = ops;
  const [tab, setTab] = useState("registos");
  const t = todayISO();
  const [from, setFrom] = useState(`${mkOfISO(t)}-01`);
  const [to, setTo] = useState(t);
  const [fClient, setFClient] = useState((params && params.clientId) || "");
  const [fStore, setFStore] = useState("");
  const [fSt, setFSt] = useState("ocorrencias");
  const [fCob, setFCob] = useState("");
  const [q, setQ] = useState("");
  const [sort, setSort] = useState({ k: "date", dir: -1 });
  const [page, setPage] = useState(0);
  const [exporting, setExporting] = useState(false);
  const range = from <= to ? [from, to] : [to, from];
  const months = useMemo(() => monthsBetween(range[0], range[1]), [range[0], range[1]]);
  const truncated = monthsBetween(range[0], range[1]).length >= 13 && mkOfISO(range[1]) > months[months.length - 1];
  const data = useOpsData({ months, stores, employees, clients, getScheduleForMonth: ops.getScheduleForMonth, enabled: ops.refsReady });
  const qn = normTxt(q);
  const filtered = useMemo(() => data.recs.filter((r) => {
    if (r.date < range[0] || r.date > range[1]) return false;
    if (fClient && (r.clientId || "_none") !== fClient) return false;
    if (fStore && r.storeId !== fStore) return false;
    if (fSt === "ocorrencias" && !(isAbsence(r) || r.st === "Pool")) return false;
    if (fSt === "ausencias" && !isAbsence(r)) return false;
    if (fSt && !["ocorrencias", "ausencias"].includes(fSt) && r.st !== fSt) return false;
    if (fCob && r.cob !== fCob) return false;
    if (qn && !normTxt(`${r.emp} ${r.store} ${r.client}`).includes(qn)) return false;
    return true;
  }).sort((a, b) => sort.dir * SORTS[sort.k](a, b) || a.emp.localeCompare(b.emp)), [data.recs, range[0], range[1], fClient, fStore, fSt, fCob, qn, sort]);
  useEffect(() => setPage(0), [filtered.length]);
  const c = countRecs(filtered);
  const PAGE = 100;
  const rowsPage = filtered.slice(page * PAGE, page * PAGE + PAGE);
  const th = (k, l) => <th onClick={() => setSort((s) => ({ k, dir: s.k === k ? -s.dir : -1 }))} className="cursor-pointer select-none whitespace-nowrap">{l}{sort.k === k ? (sort.dir === 1 ? " ↑" : " ↓") : ""}</th>;
  const clientName = (id) => (id === "_none" ? "Sem cliente" : (clients.find((x) => x.id === id) || {}).nome || "—");
  const stLabel = { ocorrencias: "Faltas e backups", ausencias: "Só faltas", "": "Todos os estados" };
  const doExport = async () => {
    setExporting(true);
    try {
      const byCli = groupByClientStore(filtered);
      const byEmp = [...groupCount(filtered, (r) => r.empId).values()].map((e) => { const cc = countRecs(e.recs); return { Colaborador: e.recs[0].emp, Cliente: e.recs[0].client, Loja: e.recs[0].store, OK: cc.ok, "Faltas (total)": totalAusencias(cc), "Com backup interno": cc.cInt, "Com backup externo": cc.cExt, "Sem reposição": cc.semW, Baixa: cc.baixa, Formação: cc.formacao, Folga: cc.folga }; }).sort((a, b) => b["Faltas (total)"] - a["Faltas (total)"]);
      const byDay = [...groupCount(filtered, (r) => r.date).values()].sort((a, b) => a.k.localeCompare(b.k)).map((e) => { const cc = countRecs(e.recs); return { Data: fmtDMY(e.k), Postos: postosOf(cc), OK: cc.ok, Faltas: totalAusencias(cc), "Backup interno": cc.cInt, "Backup externo": cc.cExt, "Sem reposição": cc.semW, "Presença %": presencaPct(cc) ?? "" }; });
      await exportXlsx(`relatorio-presencas-${range[0]}_${range[1]}.xlsx`, [
        { name: "Critérios", rows: [
          { Campo: "Aplicação", Valor: APP_NAME }, { Campo: "Gerado em", Valor: new Date().toLocaleString("pt-PT") }, { Campo: "Gerado por", Valor: (ops.user && ops.user.displayName) || "" },
          { Campo: "Período", Valor: `${fmtDMY(range[0])} a ${fmtDMY(range[1])}` }, { Campo: "Cliente", Valor: fClient ? clientName(fClient) : "Todos" },
          { Campo: "Loja", Valor: fStore ? (stores.find((s) => s.id === fStore) || {}).nome : "Todas" }, { Campo: "Estados", Valor: stLabel[fSt] !== undefined ? stLabel[fSt] : fSt },
          { Campo: "Cobertura", Valor: fCob ? COB_LABEL[fCob] : "Todas" }, { Campo: "Pesquisa", Valor: q || "—" }, { Campo: "Nº registos", Valor: filtered.length },
          { Campo: "Notas", Valor: "Presença = (postos − faltas sem reposição) ÷ postos. Faltas com backup interno/externo não baixam a presença; Meia Falta sem reposição pesa 0,5. Reposição pela loja pool contada no mesmo dia e loja." },
        ] },
        { name: "Registos", rows: filtered.map(recToRow) },
        { name: "Resumo por cliente", rows: byCli.flatMap((g) => [{ Cliente: g.nome, Loja: "(total)", "Presença %": presencaPct(g.tot) ?? "", Postos: postosOf(g.tot), OK: g.tot.ok, Faltas: totalAusencias(g.tot), "Backup interno": g.tot.cInt, "Backup externo": g.tot.cExt, "Sem reposição": g.tot.semW }, ...g.stores.map((s) => ({ Cliente: g.nome, Loja: s.nome, "Presença %": presencaPct(s.tot) ?? "", Postos: postosOf(s.tot), OK: s.tot.ok, Faltas: totalAusencias(s.tot), "Backup interno": s.tot.cInt, "Backup externo": s.tot.cExt, "Sem reposição": s.tot.semW }))]) },
        { name: "Resumo por colaborador", rows: byEmp },
        { name: "Resumo diário", rows: byDay },
      ]);
      ops.toast("success", "Relatório exportado.");
    } catch (e) { ops.toast("error", String(e.message || e)); }
    setExporting(false);
  };
  return (
    <div className="page fade-in">
      <PageHeader eyebrow="Sistema" title="Histórico e Exportação" subtitle="Consulta de registos de qualquer período, exportação Excel e auditoria de alterações." />
      <div className="mb-4"><Seg value={tab} onChange={setTab} options={[["registos", "Registos de presença"], ["auditoria", "Auditoria de alterações"]]} /></div>
      {tab === "auditoria" ? <HistoryView embedded /> : (
        <>
          <div className="toolbar mb-3">
            <label className="flex items-center gap-1.5 text-xs font-semibold text-[var(--text-secondary)]">De <input type="date" value={from} onChange={(e) => e.target.value && setFrom(e.target.value)} className="input w-auto" /></label>
            <label className="flex items-center gap-1.5 text-xs font-semibold text-[var(--text-secondary)]">a <input type="date" value={to} onChange={(e) => e.target.value && setTo(e.target.value)} className="input w-auto" /></label>
            <select value={fClient} onChange={(e) => { setFClient(e.target.value); setFStore(""); }} className="input w-auto"><option value="">Todos os clientes</option>{clients.map((x) => <option key={x.id} value={x.id}>{x.nome}</option>)}</select>
            <select value={fStore} onChange={(e) => setFStore(e.target.value)} className="input w-auto"><option value="">Todas as lojas</option>{stores.filter((s) => !fClient || s.clienteId === fClient).sort((a, b) => a.nome.localeCompare(b.nome)).map((s) => <option key={s.id} value={s.id}>{s.nome}</option>)}</select>
            <select value={fSt} onChange={(e) => setFSt(e.target.value)} className="input w-auto"><option value="ocorrencias">Faltas e backups</option><option value="ausencias">Só faltas</option><option value="">Todos os estados</option>{STATUS_OPTIONS.filter((s) => s.value).map((s) => <option key={s.value} value={s.value}>{s.label}</option>)}<option value="Pool">Backup enviado para outra loja</option></select>
            <select value={fCob} onChange={(e) => setFCob(e.target.value)} className="input w-auto"><option value="">Toda a cobertura</option><option value="sem">Sem reposição</option><option value="int">Backup interno</option><option value="ext">Backup externo</option></select>
            <div className="relative flex-1 min-w-[180px]"><Icon path={ICONS.search} size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]" /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Colaborador, loja, cliente…" className="input pl-9" /></div>
            <button onClick={doExport} disabled={exporting || data.status !== "ready"} className="btn btn-primary"><Icon path={exporting ? ICONS.refresh : ICONS.download} size={15} className={exporting ? "spin" : ""} />Exportar Excel</button>
          </div>
          <FilterChips items={[
            { k: "c", on: !!fClient, label: `Cliente: ${clientName(fClient)}`, clear: () => { setFClient(""); setFStore(""); } },
            { k: "s", on: !!fStore, label: `Loja: ${(stores.find((s) => s.id === fStore) || {}).nome}`, clear: () => setFStore("") },
            { k: "e", on: fSt !== "ocorrencias", label: `Estados: ${stLabel[fSt] !== undefined ? stLabel[fSt] : fSt}`, clear: () => setFSt("ocorrencias") },
            { k: "b", on: !!fCob, label: `Cobertura: ${fCob && COB_LABEL[fCob]}`, clear: () => setFCob("") },
            { k: "q", on: !!q, label: `Pesquisa: “${q}”`, clear: () => setQ("") },
          ]} onClearAll={() => { setFClient(""); setFStore(""); setFSt("ocorrencias"); setFCob(""); setQ(""); }} />
          {truncated && <div className="banner banner-info mb-3"><Icon path={ICONS.info} size={16} />Período limitado a 13 meses a partir da data inicial.</div>}
          {data.status !== "ready" ? <StateBox status={data.status} error={data.error} onRetry={data.reload} /> : (
            <>
              <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4">
                <div className="mini card p-3"><span>Registos</span><b>{filtered.length}</b><em>{fmtDMY(range[0])} – {fmtDMY(range[1])}</em></div>
                <div className="mini card p-3"><span>Presença</span><b style={{ color: presTone(c) }}>{fmtPct(presencaPct(c))}</b><em>{postosOf(c)} postos</em></div>
                <div className="mini card p-3"><span>Faltas</span><b>{totalAusencias(c)}</b><em>{totalRepostas(c)} com backup · {fmtNum(c.semW)} sem</em></div>
                <div className="mini card p-3"><span>Backups</span><b>{totalRepostas(c)}</b><em>{c.cInt} int · {c.cExt} ext</em></div>
                <div className="mini card p-3"><span>Meses sem dados</span><b>{months.filter((m) => !data.monthHasData[m]).length}</b><em>{months.filter((m) => !data.monthHasData[m]).map(monthShort).join(", ") || "nenhum"}</em></div>
              </div>
              <div className="card overflow-hidden">
                <div className="overflow-x-auto"><table className="tbl min-w-[860px]">
                  <thead><tr>{th("date", "Data")}<th>Dia</th>{th("emp", "Colaborador")}{th("client", "Cliente")}{th("store", "Loja")}{th("st", "Estado")}{th("cob", "Cobertura")}</tr></thead>
                  <tbody>
                    {rowsPage.map((r, i) => (
                      <tr key={r.empId + r.date + r.st + i}>
                        <td className="whitespace-nowrap font-semibold"><button className="hover:underline" onClick={() => ops.nav("daily", { date: r.date, clientId: r.clientId || "_none" })} title="Abrir no Registo Diário">{fmtDMY(r.date)}</button></td>
                        <td>{DIAS_SEMANA[r.dow]}</td>
                        <td><button className="font-semibold hover:underline text-left" onClick={() => ops.openEmployee(r.empId)}>{r.emp}</button></td>
                        <td>{r.client}</td><td>{r.store}</td>
                        <td><Pill color={TYPE_COLORS[r.st] || statusMeta(r.st).dot || "#6b7280"}>{r.st === "Pool" ? `Backup Interno · ${r.origStore}` : r.st}</Pill></td>
                        <td>{r.cob ? <Pill color={COB_COLOR[r.cob]}>{COB_LABEL[r.cob]}</Pill> : "—"}</td>
                      </tr>
                    ))}
                    {filtered.length === 0 && <tr><td colSpan={7}><EmptyState title="Sem registos" text="Nenhum registo corresponde aos critérios. Meses sem dados na grelha não geram registos." /></td></tr>}
                  </tbody>
                </table></div>
                {filtered.length > PAGE && (
                  <div className="flex items-center justify-between px-4 py-3 border-t border-[var(--border-c)] text-xs">
                    <span className="text-[var(--text-secondary)]">{page * PAGE + 1}–{Math.min(filtered.length, (page + 1) * PAGE)} de {filtered.length}</span>
                    <div className="flex gap-1"><button disabled={page === 0} onClick={() => setPage(page - 1)} className="btn btn-ghost btn-xs">Anterior</button><button disabled={(page + 1) * PAGE >= filtered.length} onClick={() => setPage(page + 1)} className="btn btn-ghost btn-xs">Seguinte</button></div>
                  </div>
                )}
              </div>
            </>
          )}
        </>
      )}
    </div>
  );
}

const STATUS_DEFS = {
  "OK": "Presente. Posto assegurado.",
  "Falta": "Faltou e ninguém foi colocado no lugar → baixa a presença (salvo reposição pela loja pool no mesmo dia).",
  "Meia Falta": "Faltou parte do dia sem reposição → baixa a presença em meio posto.",
  "Formação": "Em formação. Não é posto previsto nem falta.",
  "Backup Interno": "Faltou, mas foi reposto com backup interno → conta como posto assegurado (não baixa a presença).",
  "Backup Externo": "Faltou, mas foi reposto com backup externo → conta como posto assegurado (não baixa a presença).",
  "Folga": "Folga (gravada ou fixa automática). Não é posto previsto.",
  "Baixa": "Baixa. Não é posto previsto nem falta.",
  "Abandono": "Abandonou o posto sem reposição → baixa a presença; bloqueia o resto do mês e desativa o colaborador.",
  "Desligado": "Saída do colaborador. Bloqueia o resto do mês e desativa-o. Não é falta.",
  "Bloqueado": "“Sem preenchimento”: dia não aplicável. Não conta para nada.",
};

function SettingsView() {
  const ops = useOps();
  const [cfg, setLocal] = useState(ops.cfg);
  const [busy, setBusy] = useState(false);
  useEffect(() => setLocal(ops.cfg), [ops.cfg]);
  const changed = JSON.stringify(cfg) !== JSON.stringify(ops.cfg);
  const backupJson = async () => {
    setBusy(true);
    try {
      const names = ["stores", "employees", "clients", "backups", "schedule"];
      const snaps = await Promise.all(names.map((n) => col(n).get().catch(() => ({ docs: [] }))));
      const audit = await col("auditLog").orderBy("timestamp", "desc").limit(5000).get().catch(() => ({ docs: [] }));
      const out = { app: APP_NAME, exportedAt: new Date().toISOString(), exportedBy: (ops.user && ops.user.displayName) || "", collections: {} };
      names.forEach((n, i) => { out.collections[n] = {}; snaps[i].docs.forEach((d) => { out.collections[n][d.id] = d.data(); }); });
      out.collections.auditLog = {}; audit.docs.forEach((d) => { out.collections.auditLog[d.id] = d.data(); });
      downloadBlob(`copia-seguranca-presencas-${todayISO()}.json`, JSON.stringify(out, null, 1));
      logHistory("Criou", "Grelha", "Cópia de segurança", "Exportação JSON completa");
      ops.toast("success", "Cópia de segurança descarregada.");
    } catch (e) { ops.toast("error", friendlyErr(e, "criar a cópia de segurança")); }
    setBusy(false);
  };
  return (
    <div className="page fade-in">
      <PageHeader eyebrow="Sistema" title="Configurações" subtitle="Limites dos alertas, preferências, regra de presença e cópias de segurança." />
      <div className="grid xl:grid-cols-2 gap-5">
        <Card title="Limites dos alertas" right={<button onClick={() => setLocal({ ...cfg, motSem: ALERT_CFG_DEFAULT.motSem, motMes: ALERT_CFG_DEFAULT.motMes, semBkpSem: ALERT_CFG_DEFAULT.semBkpSem })} className="text-xs font-semibold text-[var(--accent)]">Repor por defeito</button>}>
          <p className="text-xs text-[var(--text-secondary)] mb-4">Só existem dois tipos de alerta: clientes com faltas sem reposição (últimos 7 dias) e motoristas reincidentes. Guardado neste navegador.</p>
          <div className="space-y-3">
            {ALERT_FIELDS.map(([k, label]) => (
              <label key={k} className="flex items-center justify-between gap-3 text-sm">
                <span className="text-[var(--text-secondary)]">{label}</span>
                <input type="number" min="1" step="1" value={cfg[k]} onChange={(e) => { const n = Number(e.target.value); setLocal({ ...cfg, [k]: Number.isFinite(n) && n > 0 ? n : ALERT_CFG_DEFAULT[k] }); }} className="input input-sm w-20 text-right" />
              </label>
            ))}
          </div>
          <div className="flex justify-end mt-4"><button disabled={!changed} onClick={() => { ops.setCfg(cfg); ops.toast("success", "Limites guardados."); }} className="btn btn-primary">Guardar</button></div>
        </Card>
        <div className="space-y-5">
          <Card title="Preferências">
            <label className="flex items-center justify-between gap-3 py-2"><span className="text-sm">Modo noturno</span><button onClick={ops.toggleDark} className={`switch ${ops.dark ? "on" : ""}`} aria-pressed={ops.dark}><span /></button></label>
            <div className="text-xs text-[var(--text-secondary)] mt-2">Sessão: <b className="text-[var(--text-primary)]">{ops.user && ops.user.displayName}</b> (identificação local por nome, usada no histórico de alterações).</div>
          </Card>
          <Card title="Dados e cópias de segurança">
            <div className="text-xs text-[var(--text-secondary)] space-y-1.5 mb-4">
              <div>Fonte de verdade: <b className="text-[var(--text-primary)]">Firebase Firestore</b> (projeto presencasde). Grelha num documento por mês (<code>schedule/AAAA-MM</code>: <code>cells</code>, <code>arrivals</code>, <code>notes</code>).</div>
              <div>Sincronização: os meses abertos ficam ligados em tempo real; alterações de outros utilizadores aparecem sem recarregar. Offline, as alterações ficam em fila neste navegador.</div>
              <div>Estado atual: {ops.sync.online ? "online" : "offline"} · {ops.sync.pending ? `${ops.sync.pending} mês(es) com alterações por confirmar` : "tudo sincronizado"}.</div>
            </div>
            <button onClick={backupJson} disabled={busy} className="btn btn-ghost"><Icon path={busy ? ICONS.refresh : ICONS.download} size={15} className={busy ? "spin" : ""} />Descarregar cópia de segurança (JSON)</button>
            <p className="text-[11px] text-[var(--text-secondary)] mt-2">Inclui lojas, colaboradores, clientes, toda a grelha (com o estado dos alertas) e os últimos 5 000 eventos de auditoria. Não existe importação automática — a restauração é feita de forma controlada a partir deste ficheiro.</p>
          </Card>
        </div>
        <Card title="Estados de presença — referência" className="xl:col-span-2">
          <p className="text-xs text-[var(--text-secondary)] mb-3"><b className="text-[var(--text-primary)]">Presença = (postos previstos − faltas sem reposição) ÷ postos previstos.</b> Postos previstos = OK + Falta + Meia Falta + Abandono + Backup Interno + Backup Externo. Só as faltas sem ninguém no lugar baixam a percentagem.</p>
          <div className="overflow-x-auto"><table className="tbl min-w-[640px]"><thead><tr><th>Estado</th><th>Significado e contagem</th></tr></thead>
            <tbody>{STATUS_OPTIONS.filter((s) => s.value).map((s) => <tr key={s.value}><td className="whitespace-nowrap"><StatusChip val={s.value} /></td><td className="text-xs">{STATUS_DEFS[s.value] || ""}</td></tr>)}
              <tr><td className="whitespace-nowrap"><StatusChip val="__pool__" storeName="loja X" /></td><td className="text-xs">Colaborador da loja pool enviado para outra loja do mesmo cliente. Repõe, no mesmo dia, uma falta dessa loja (backup interno).</td></tr>
              <tr><td><StatusChip val="" /></td><td className="text-xs">Célula vazia: não verificado. Nunca é tratado como ausência.</td></tr>
            </tbody></table></div>
        </Card>
        <Card title="Atalhos de teclado" className="xl:col-span-2">
          <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-2 text-xs">
            {[["Ctrl/⌘ + K", "Pesquisa rápida"], ["1–8", "Registo Diário: definir estado da linha focada"], ["0 / Delete", "Limpar o registo da linha"], ["↑ ↓ ou J K", "Mover entre colaboradores"], ["N", "Observação do colaborador"], ["Alt + ← / →", "Dia anterior / seguinte"], ["Esc", "Fechar painel ou janela"]].map(([k, d]) => <div key={k} className="flex items-center gap-2"><kbd>{k}</kbd><span className="text-[var(--text-secondary)]">{d}</span></div>)}
          </div>
        </Card>
      </div>
    </div>
  );
}

function CellStatusMenu({ anchorRect, value, onSelect, onClose }) {
  const [pos, setPos] = useState(null);

  useEffect(() => {
    const menuW = 190;
    const menuH = STATUS_OPTIONS.filter(o => o.value).length * 38 + 60;
    let top = anchorRect.bottom + 6;
    let left = anchorRect.left;
    if (left + menuW > window.innerWidth - 8) left = window.innerWidth - menuW - 8;
    if (top + menuH > window.innerHeight - 8) top = anchorRect.top - menuH - 6;
    setPos({ top, left, width: Math.max(anchorRect.width, menuW) });
  }, [anchorRect]);

  useEffect(() => {
    const onKey = (ev) => { if (ev.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  if (!pos) return null;

  return ReactDOM.createPortal(
    <>
      <div className="fixed inset-0 z-40" onMouseDown={onClose}></div>
      <div className="fixed z-50 bg-white rounded-xl shadow-2xl border border-[var(--border-c)] py-1.5 fade-in" style={{ top: pos.top, left: pos.left, width: pos.width }} onMouseDown={(e)=>e.stopPropagation()}>
        {STATUS_OPTIONS.filter(o => o.value).map(o => (
          <button key={o.value} onClick={() => onSelect(o.value)}
            className={`w-full flex items-center gap-2.5 px-3.5 py-2 text-sm text-left hover:bg-gray-50 ${value === o.value ? "bg-gray-50 font-semibold" : ""}`}>
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: o.dot }}></span>
            <span>{o.label}</span>
          </button>
        ))}
        <div className="border-t border-[var(--border-c)] mt-1 pt-1">
          <button onClick={() => onSelect("")} className="w-full flex items-center gap-2.5 px-3.5 py-2 text-sm text-left text-gray-400 hover:bg-gray-50">
            <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: "#e5e7eb" }}></span>
            <span>Limpar</span>
          </button>
        </div>
      </div>
    </>,
    document.body
  );
}

function GridView({ stores, employees, clients, getScheduleForMonth, saveCellStatus, saveCellsBatch, getArrivalsForMonth, saveArrivalTime }) {
  const ops = useOps();
  const loadedMk = useRef("");
  const now = new Date();
  const [y, setY] = useState(now.getFullYear());
  const [m, setM] = useState(now.getMonth());
  const [schedule, setSchedule] = useState({});
  const [arrivals, setArrivals] = useState({});
  const [loading, setLoading] = useState(true);
  const [fLoja, setFLoja] = useState("");
  const [fCliente, setFCliente] = useState("");
  const [fTurno, setFTurno] = useState("");
  const [fStatus, setFStatus] = useState("");
  const [editingCell, setEditingCell] = useState(null);
  const [exporting, setExporting] = useState(false);
  const gridScrollRef = useRef(null);
  // Altura real (em px) da 1ª linha do cabeçalho (nomes das lojas), medida
  // dinamicamente — evita usar um valor fixo (ex.: 28px) como "top" da 2ª
  // linha (nomes dos colaboradores), que ficava desalinhado sempre que essa
  // linha tinha uma altura diferente (ex.: lojas com muitos colaboradores).
  const gridHeadRow1Ref = useRef(null);
  const [gridHeadRow2Top, setGridHeadRow2Top] = useState(28);

  const mk = monthKey(y, m);
  // Mês ligado em tempo real: alterações de outros utilizadores (ou do Registo Diário) refletem-se aqui.
  useEffect(() => {
    let alive = true;
    if (loadedMk.current !== mk) setLoading(true);
    ops.getMonthDoc(mk).then((d) => {
      if (alive) { setSchedule(d.cells); setArrivals(d.arrivals); setLoading(false); loadedMk.current = mk; }
    }).catch((err) => { if (alive) { setLoading(false); ops.toast("error", "Erro ao carregar a grelha: " + err.message); } });
    return () => { alive = false; };
  }, [mk, ops.version]);

  const setArrival = async (storeId, day, value) => {
    const key = arrivalKey(storeId, day);
    setArrivals(prev => ({ ...prev, [key]: value }));
    await saveArrivalTime(mk, storeId, day, value);
  };

  const nDays = daysInMonth(y, m);
  const days = Array.from({ length: nDays }, (_, i) => i + 1);

  // Desligados só saem da grelha no mês seguinte ao da data de saída (desligadoData).
  const activeEmployees = useMemo(() => { const withCells = new Set(); Object.keys(schedule || {}).forEach(k => { const v = schedule[k]; if (v && v !== "Bloqueado") withCells.add(k.slice(0, k.lastIndexOf("_"))); }); return employees.filter(e => { const hasCells = withCells.has(e.id); if (e.dataEntrada && e.dataEntrada.slice(0, 7) > mk && !hasCells) return false; return e.estado !== "Desligado" || (!!e.desligadoData && e.desligadoData.slice(0, 7) >= mk) || hasCells; }); }, [employees, mk, schedule]);
  const storesSorted = useMemo(() => [...stores].sort((a,b)=> (a.ordem??0)-(b.ordem??0) || a.nome.localeCompare(b.nome)), [stores]);

  const visibleStores = storesSorted.filter(s => (!fLoja || s.id === fLoja) && (!fCliente || s.clienteId === fCliente));
  const empByStore = (storeId) => activeEmployees.filter(e => e.lojaId === storeId && (!fTurno || e.turno === fTurno));
  const storeById = (id) => stores.find(s => s.id === id);

  useEffect(() => {
    const rowEl = gridHeadRow1Ref.current;
    if (!rowEl) return;
    const updateHeight = () => {
      const h = rowEl.getBoundingClientRect().height;
      if (h > 0) setGridHeadRow2Top(h);
    };
    updateHeight();
    if (typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(updateHeight);
    ro.observe(rowEl);
    return () => ro.disconnect();
  }, [visibleStores.length, activeEmployees.length, fLoja, fCliente, fTurno]);

  // Loja "Backup Interno" (pool): a célula não mostra status, mostra a lista de lojas do mesmo cliente
  const poolOptionsFor = (store) => stores
    .filter(s => s.id !== store.id && s.clienteId && s.clienteId === store.clienteId)
    .sort((a,b)=>a.nome.localeCompare(b.nome))
    .map(s => ({ id: s.id, nome: s.nome, cor: s.cor }));

  // Folga fixa: se a célula não tem valor guardado e o colaborador tem esse dia da semana marcado
  // como folga fixa no cadastro, mostra "Folga" automaticamente (sem precisar preencher célula a célula).
  const effectiveValue = (emp, day) => {
    const saved = schedule[cellKey(emp.id, day)];
    if (saved) return saved;
    const dow = new Date(y, m, day).getDay();
    if ((emp.folgaFixa || []).includes(dow)) return "Folga";
    return "";
  };

  // Regra única partilhada com o Registo Diário (planStatusChange): Abandono/Desligado bloqueiam o resto do mês
  // e desativam o colaborador; desfazer reativa. Mesmo comportamento e mesmo histórico de auditoria que antes.
  const setCell = async (empId, day, value) => {
    const isPool = !!(editingCell && editingCell.store && editingCell.store.tipo === "backup_pool");
    setEditingCell(null);
    await ops.changeStatus({ mk, day, empId, value, isPool, source: "grid" });
  };

  const openCellMenu = (e, empId, day, store) => {
    const rect = e.currentTarget.getBoundingClientRect();
    setEditingCell({ key: cellKey(empId, day), empId, day, rect, isPool: store.tipo === "backup_pool", store });
  };

  const changeMonth = (delta) => {
    let nm = m + delta, ny = y;
    if (nm < 0) { nm = 11; ny -= 1; }
    if (nm > 11) { nm = 0; ny += 1; }
    setM(nm); setY(ny);
  };

  // Captura a grelha inteira (incluindo cabeçalhos fixos e todas as linhas,
  // mesmo as que estão fora da área visível de scroll) e faz download em PNG.
  const handleDownloadGridPNG = async () => {
    const el = gridScrollRef.current;
    if (!el) return;
    if (typeof html2canvas === "undefined") {
      alert("Não foi possível gerar a imagem: a biblioteca de exportação ainda não carregou. Verifica a ligação à internet e tenta novamente em alguns segundos.");
      return;
    }

    setExporting(true);

    // 1) Remove temporariamente o limite de altura e o scroll do contentor,
    //    para que TODAS as linhas (mesmo as que estão fora do scroll) fiquem
    //    presentes no layout normal do documento.
    const prevMaxHeight = el.style.maxHeight;
    const prevOverflow = el.style.overflow;
    el.style.maxHeight = "none";
    el.style.overflow = "visible";

    // 2) Neutraliza position:sticky (cabeçalhos e coluna "DIA") — sem um
    //    contentor com scroll, o sticky pode "colar-se" ao viewport e
    //    estragar a captura. Guarda o valor original de cada elemento para
    //    repor depois.
    const stickyEls = Array.from(el.querySelectorAll("*")).filter(
      (n) => getComputedStyle(n).position === "sticky"
    );
    const stickyOriginal = stickyEls.map((n) => n.style.position);
    stickyEls.forEach((n) => { n.style.position = "static"; });

    // Força reflow antes de capturar
    await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

    try {
      const canvas = await html2canvas(el, {
        backgroundColor: "#ffffff",
        scale: 2,
        useCORS: true,
        windowWidth: el.scrollWidth,
        windowHeight: el.scrollHeight,
      });
      const nomeFicheiro = `grelha-${MESES[m]}-${y}`
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      const link = document.createElement("a");
      link.download = `${nomeFicheiro}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    } catch (err) {
      console.error("Erro ao gerar PNG da grelha:", err);
      alert("Ocorreu um erro ao gerar a imagem da grelha.");
    } finally {
      // 3) Repõe tudo como estava
      stickyEls.forEach((n, i) => { n.style.position = stickyOriginal[i] || ""; });
      el.style.maxHeight = prevMaxHeight;
      el.style.overflow = prevOverflow;
      setExporting(false);
    }
  };

  return (
    <div className="page fade-in">
      <div className="flex items-start justify-between mb-5 flex-wrap gap-3">
        <div>
          <div className="eyebrow mb-1">Operação</div>
          <h1 className="page-title">Grelha Mensal</h1>
          <p className="text-sm text-gray-400 mt-1">Escala mensal de presenças por loja e turno · edições sincronizadas em tempo real com o Registo Diário</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <select value={fCliente} onChange={(e)=>setFCliente(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todos os Clientes</option>
            {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
          </select>
          <select value={fLoja} onChange={(e)=>setFLoja(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todas as Lojas</option>
            {storesSorted.map(s => <option key={s.id} value={s.id}>{s.nome}</option>)}
          </select>
          <select value={fTurno} onChange={(e)=>setFTurno(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todos os Turnos</option>
            {TURNOS.map(t => <option key={t} value={t}>{t}</option>)}
          </select>
          <select value={fStatus} onChange={(e)=>setFStatus(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todos os Status</option>
            {STATUS_OPTIONS.filter(s=>s.value).map(s => <option key={s.value} value={s.value}>{s.label}</option>)}
          </select>
        </div>
      </div>

      <div className="flex items-center gap-3 mb-3">
        <button onClick={()=>changeMonth(-1)} className="p-1.5 rounded-lg border border-[var(--border-c)] bg-white hover:bg-gray-50"><Icon path={ICONS.chevronLeft} size={16} /></button>
        <span className="font-bold text-sm w-32 text-center">{MESES[m]} {y}</span>
        <button onClick={()=>changeMonth(1)} className="p-1.5 rounded-lg border border-[var(--border-c)] bg-white hover:bg-gray-50"><Icon path={ICONS.chevronRight} size={16} /></button>
        <button
          onClick={handleDownloadGridPNG}
          disabled={exporting || loading}
          className="ml-auto flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-semibold text-white disabled:opacity-60 disabled:cursor-not-allowed"
          style={{ background: "var(--accent)" }}
          title="Captura a grelha inteira (incluindo linhas fora do scroll) e faz download em PNG"
        >
          {exporting ? (
            <Icon path={ICONS.refresh || "M4 4v6h6M20 20v-6h-6M4 10a8 8 0 0114-5.3M20 14a8 8 0 01-14 5.3"} size={14} className="spin" />
          ) : (
            <Icon path={ICONS.download || "M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"} size={14} />
          )}
          {exporting ? "A gerar imagem…" : "Baixar PNG"}
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-[var(--border-c)] overflow-hidden">
        {loading ? (
          <div className="p-16 text-center text-gray-300 text-sm">A carregar grelha…</div>
        ) : (
          <div ref={gridScrollRef} className="overflow-auto grid-scroll" style={{ maxHeight: "72vh" }}>
            <table className="text-xs w-full">
              <thead>
                <tr ref={gridHeadRow1Ref}>
                  <th className="sticky-col bg-white text-left px-3 py-2 border-b border-r border-[var(--border-c)] font-bold text-gray-400 w-16 top-0" style={{position:"sticky", top:0, zIndex:6}}>DIA</th>
                  {visibleStores.map(s => {
                    const emps = empByStore(s.id);
                    if (emps.length === 0) return null;
                    const hasArrival = !!s.horaChegada;
                    return (
                      <th key={s.id} colSpan={emps.length + (hasArrival ? 1 : 0)} className="grid-store-head text-center px-2 py-2 border-b border-l border-[var(--border-c)] font-extrabold text-[11px] tracking-wide sticky top-0" style={{ color: s.cor, "--store-c": s.cor || "#999999", position:"sticky", top:0, zIndex:4 }}>
                        {s.nome.toUpperCase()}
                      </th>
                    );
                  })}
                </tr>
                <tr>
                  <th className="sticky-col bg-white border-b border-r border-[var(--border-c)]" style={{position:"sticky", top:gridHeadRow2Top, zIndex:6}}></th>
                  {visibleStores.map(s => {
                    const emps = empByStore(s.id);
                    if (emps.length === 0) return null;
                    const hasArrival = !!s.horaChegada;
                    return (
                      <React.Fragment key={s.id}>
                        {hasArrival && (
                          <th className="px-2 py-2 border-b border-l border-[var(--border-c)] text-center font-semibold whitespace-nowrap sticky bg-white" style={{position:"sticky", top:gridHeadRow2Top, zIndex:3, minWidth:"90px"}}>
                            <div className="text-[10px] leading-tight">HORA CHEGADA<br/>CAMIÃO</div>
                          </th>
                        )}
                        {emps.map(e => (
                          <th key={e.id} className="px-2 py-2 border-b border-l border-[var(--border-c)] text-center font-semibold whitespace-nowrap sticky bg-white" style={{position:"sticky", top:gridHeadRow2Top, zIndex:3}}>
                            <div className="text-[11px]">{e.nome}</div>
                            <div className="text-[9px] text-gray-400 font-normal">{e.turno}</div>
                          </th>
                        ))}
                      </React.Fragment>
                    );
                  })}
                </tr>
              </thead>
              <tbody>
                {days.map(day => {
                  const dow = new Date(y, m, day).getDay();
                  const isWeekend = dow === 0 || dow === 6;
                  return (
                    <tr key={day} className="hover:bg-gray-50/60">
                      <td className={`sticky-col bg-white px-3 py-1.5 border-b border-r border-[var(--border-c)] font-bold ${isWeekend ? "text-red-500" : "text-gray-600"}`}>
                        {day} <span className="font-normal text-[10px]">{DIAS_SEMANA[dow]}</span>
                      </td>
                      {visibleStores.map(s => {
                        const emps = empByStore(s.id);
                        if (emps.length === 0) return null;
                        const hasArrival = !!s.horaChegada;
                        return (
                          <React.Fragment key={s.id}>
                            {hasArrival && (
                              <td className="border-b border-l border-[var(--border-c)] p-0.5 text-center">
                                <input
                                  key={`${mk}-${arrivalKey(s.id, day)}-${arrivals[arrivalKey(s.id, day)] || ""}`}
                                  type="text"
                                  className="w-full h-7 min-w-[80px] rounded-md text-[11px] font-semibold text-center border border-transparent hover:border-[var(--border-c)] focus:border-[var(--accent)] focus:outline-none bg-transparent"
                                  placeholder="—"
                                  defaultValue={arrivals[arrivalKey(s.id, day)] || ""}
                                  onBlur={(ev) => {
                                    const v = ev.target.value.trim();
                                    if (v !== (arrivals[arrivalKey(s.id, day)] || "")) setArrival(s.id, day, v);
                                  }}
                                  onKeyDown={(ev) => { if (ev.key === "Enter") ev.target.blur(); }}
                                />
                              </td>
                            )}
                            {emps.map(e => {
                              const k = cellKey(e.id, day);
                              const isPoolStore = s.tipo === "backup_pool";
                              const outIso = isoDate(y, m, day);
                              if (!schedule[k] && !empActiveOn(e, outIso)) {
                                const before = e.dataEntrada && outIso < e.dataEntrada;
                                return <td key={k} className="border-b border-l border-[var(--border-c)] p-0.5 text-center"><div className="w-full h-7 min-w-[52px] rounded-md out-cell" title={before ? `Entrou em ${fmtDMY(e.dataEntrada)}` : `Saiu (último dia ${e.desligadoData ? fmtDMY(e.desligadoData) : "—"})`}>{before ? "" : "—"}</div></td>;
                              }
                              const val = effectiveValue(e, day); // aplica folga fixa também nas lojas pool
                              const isAuto = !schedule[k] && val === "Folga";
                              const meta = statusMeta(val);
                              // Nas lojas pool, o seletor de "para qual loja foi o backup" só aparece
                              // quando a célula não tem um status normal atribuído (Folga, Falta, Abandono, etc.)
                              // — senão mostra o status normal, tal como nas lojas comuns.
                              const isKnownStatus = !!val && STATUS_OPTIONS.some(o => o.value === val);
                              const renderAsPool = isPoolStore && !isKnownStatus;
                              const dimmed = fStatus && val !== fStatus && !renderAsPool;
                              const poolLabel = renderAsPool ? (storeById(val)?.nome || (val ? val : "—")) : null;
                              return (
                                <td key={k} className="border-b border-l border-[var(--border-c)] p-0.5 text-center" style={{ opacity: dimmed ? 0.25 : 1 }}>
                                  {renderAsPool ? (
                                    <button onClick={(ev)=>openCellMenu(ev, e.id, day, s)} className="w-full h-7 min-w-[80px] rounded-md text-[11px] font-semibold flex items-center justify-center gap-1 px-1.5 truncate" style={{ background: val ? "#eff6ff" : "#f3f4f6", color: val ? "#1d4ed8" : "#9ca3af" }}>
                                      <span className="truncate">{poolLabel}</span>
                                      <Icon path={ICONS.chevronDown} size={10} className="shrink-0" />
                                    </button>
                                  ) : (
                                    <button onClick={(ev)=>openCellMenu(ev, e.id, day, s)} className="w-full h-7 min-w-[52px] rounded-md text-[11px] font-bold flex items-center justify-center" style={{ background: meta.bg, color: meta.fg, boxShadow: isAuto ? "inset 0 0 0 1px #c4b5fd" : "none" }} title={isAuto ? "Folga fixa automática" : meta.blank ? meta.label : ""}>
                                      {meta.blank ? "" : meta.label}
                                    </button>
                                  )}
                                </td>
                              );
                            })}
                          </React.Fragment>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      <div className="flex flex-wrap gap-3 mt-4">
        {STATUS_OPTIONS.filter(s=>s.value).map(s => (
          <div key={s.value} className="flex items-center gap-1.5 text-xs text-gray-500">
            <span className="w-2.5 h-2.5 rounded-full" style={{ background: s.dot }}></span>{s.label}
          </div>
        ))}
        <div className="flex items-center gap-1.5 text-xs text-gray-500">
          <span className="w-2.5 h-2.5 rounded-full ring-2 ring-violet-300" style={{ background: "#eef0f4" }}></span>Folga fixa (automática)
        </div>
      </div>

      {editingCell && (editingCell.isPool ? (
        <CellStoreMenu
          anchorRect={editingCell.rect}
          options={poolOptionsFor(editingCell.store)}
          value={schedule[editingCell.key] || ""}
          onClose={() => setEditingCell(null)}
          onSelect={(value) => setCell(editingCell.empId, editingCell.day, value)}
        />
      ) : (
        <CellStatusMenu
          anchorRect={editingCell.rect}
          value={effectiveValue(employees.find(e=>e.id===editingCell.empId) || {}, editingCell.day)}
          onClose={() => setEditingCell(null)}
          onSelect={(value) => setCell(editingCell.empId, editingCell.day, value)}
        />
      ))}
    </div>
  );
}

function EmployeeModal({ employee, stores, onClose, onSave }) {
  const [form, setForm] = useState(employee || { nome: "", lojaId: stores[0]?.id || "", turno: "Part Time", veiculo: "", funcao: "Motorista", estado: "Ativo", desligadoData: "", dataEntrada: "", folgaFixa: [] });
  const set = (k, v) => setForm(prev => ({ ...prev, [k]: v }));
  const toggleDia = (idx) => setForm(prev => {
    const cur = prev.folgaFixa || [];
    const next = cur.includes(idx) ? cur.filter(d => d !== idx) : [...cur, idx];
    return { ...prev, folgaFixa: next };
  });
  const submit = (e) => { e.preventDefault(); if (!form.nome.trim()) return; onSave(form); };
  return (
    <Modal title={employee ? "Editar Colaborador" : "Novo Colaborador"} onClose={onClose}>
      <form onSubmit={submit}>
        <Field label="Nome"><input required className={inputCls} value={form.nome} onChange={e=>set("nome", e.target.value)} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Loja">
            <select className={inputCls} value={form.lojaId} onChange={e=>set("lojaId", e.target.value)}>
              {stores.map(s => <option key={s.id} value={s.id}>{s.nome}</option>)}
            </select>
          </Field>
          <Field label="Turno">
            <select className={inputCls} value={form.turno} onChange={e=>set("turno", e.target.value)}>
              {TURNOS.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Função">
            <select className={inputCls} value={form.funcao} onChange={e=>set("funcao", e.target.value)}>
              {FUNCOES.map(f => <option key={f} value={f}>{f}</option>)}
            </select>
          </Field>
          <Field label="Veículo"><input className={inputCls} placeholder="—" value={form.veiculo} onChange={e=>set("veiculo", e.target.value)} /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Estado">
            <select className={inputCls} value={form.estado} onChange={e=>set("estado", e.target.value)}>
              <option value="Ativo">Ativo</option>
              <option value="Desligado">Desligado</option>
            </select>
          </Field>
          {form.estado !== "Desligado" && (
            <Field label="1.º dia de trabalho (opcional)">
              <input type="date" className={inputCls} value={form.dataEntrada||""} onChange={e=>set("dataEntrada", e.target.value)} />
            </Field>
          )}
          {form.estado === "Desligado" && (
            <Field label="Último dia de trabalho">
              <input type="date" className={inputCls} value={form.desligadoData||""} onChange={e=>set("desligadoData", e.target.value)} />
            </Field>
          )}
        </div>
        <Field label="Folga Fixa (dias da semana)">
          <div className="flex flex-wrap gap-1.5">
            {DIAS_SEMANA.map((d, idx) => {
              const active = (form.folgaFixa || []).includes(idx);
              return (
                <button type="button" key={idx} onClick={() => toggleDia(idx)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold border ${active ? "text-white border-transparent" : "text-gray-500 border-[var(--border-c)] bg-white"}`}
                  style={active ? { background: "var(--accent)" } : {}}>
                  {d}
                </button>
              );
            })}
          </div>
          <p className="text-[11px] text-gray-400 mt-1.5">Nos dias selecionados a Grelha Operacional marca "Folga" automaticamente, todos os meses, sem precisar de preencher célula a célula. Podes sempre substituir manualmente numa célula específica.</p>
        </Field>
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-semibold text-gray-600 hover:bg-gray-100">Cancelar</button>
          <button type="submit" className="px-4 py-2 rounded-lg text-sm font-semibold text-white" style={{ background: "var(--accent)" }}>Guardar</button>
        </div>
      </form>
    </Modal>
  );
}

function StoresView({ stores, employees, clients, hideTabs }) {
  const [tab, setTab] = useState("lojas");
  const [modal, setModal] = useState(null);
  const [deleting, setDeleting] = useState(null);
  const [fCliente, setFCliente] = useState("");

  const save = async (data) => {
    if (data.id) await col("stores").doc(data.id).set(data, { merge: true });
    else await col("stores").add({ ...data, ordem: stores.length, criadoEm: Date.now() });
    logHistory(data.id ? "Editou" : "Criou", "Loja", data.nome, data.clienteId ? `Cliente: ${clientName(data.clienteId)}` : "");
    setModal(null);
  };
  const remove = async (id) => {
    const st = stores.find(s => s.id === id);
    const assigned = employees.filter(e => e.lojaId === id).length;
    if (assigned > 0) { window.alert(`${st ? st.nome : "Esta loja"} tem ${assigned} colaborador(es) associado(s) (incluindo desligados). Move-os para outra loja antes de eliminar — caso contrário, o histórico deles ficaria sem loja/cliente.`); setDeleting(null); return; }
    await col("stores").doc(id).delete();
    if (st) logHistory("Eliminou", "Loja", st.nome, "");
    setDeleting(null);
  };
  const countFor = (storeId) => employees.filter(e => e.lojaId === storeId && e.estado !== "Desligado").length;
  const clientName = (id) => clients.find(c=>c.id===id)?.nome || "";
  const clientColor = (id) => clients.find(c=>c.id===id)?.cor || "#9ca3af";
  const storesSorted = useMemo(() => [...stores].sort((a,b)=> (a.ordem??0)-(b.ordem??0) || a.nome.localeCompare(b.nome)), [stores]);
  const visibleStores = storesSorted.filter(s => !fCliente || s.clienteId === fCliente);

  const moveStore = async (storeId, dir) => {
    const idx = storesSorted.findIndex(s => s.id === storeId);
    const swapIdx = idx + dir;
    if (idx === -1 || swapIdx < 0 || swapIdx >= storesSorted.length) return;
    const list = [...storesSorted];
    [list[idx], list[swapIdx]] = [list[swapIdx], list[idx]];
    // Reatribui ordens sequenciais (0,1,2...) para toda a lista, garantindo consistência
    await Promise.all(list.map((s, i) => col("stores").doc(s.id).set({ ordem: i }, { merge: true })));
    logHistory("Editou", "Loja", list[idx].nome, `Reordenou a sequência na Grelha (posição ${idx+1})`);
  };

  return (
    <div className="page fade-in">
      <div className="flex items-start justify-between mb-5 flex-wrap gap-3">
        <div>
          <div className="eyebrow mb-1">Gestão</div>
          <h1 className="page-title">{hideTabs ? "Lojas" : "Gestão de Lojas & Clientes"}</h1>
          <p className="text-sm text-gray-400">{stores.length} lojas · {clients.length} clientes configurados{fCliente ? " · remove o filtro de cliente para reordenar" : " · usa as setas para reordenar a sequência na Grelha"}</p>
        </div>
        <div className="flex items-center gap-2">
          {!hideTabs && <div className="flex gap-1 bg-gray-100 rounded-lg p-1">
            {[["lojas","Lojas"],["clientes","Clientes"]].map(([k,l]) => (
              <button key={k} onClick={()=>setTab(k)} className={`px-4 py-1.5 rounded-md text-sm font-semibold ${tab===k ? "bg-white shadow text-[var(--text-primary)]" : "text-gray-500"}`}>{l}</button>
            ))}
          </div>}
          {tab === "lojas" && (
            <select value={fCliente} onChange={e=>setFCliente(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
              <option value="">Todos os Clientes</option>
              {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
            </select>
          )}
          {tab === "lojas" && (
            <button onClick={()=>setModal({mode:"new"})} className="flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold text-white" style={{ background: "var(--accent)" }}>
              <Icon path={ICONS.plus} size={16} /> Nova Loja
            </button>
          )}
        </div>
      </div>

      {tab === "clientes" ? (
        <ClientsView clients={clients} stores={stores} />
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
          {visibleStores.map(s => (
            <div key={s.id} className="bg-white rounded-2xl border border-[var(--border-c)] overflow-hidden">
              <div className="h-1.5" style={{ background: s.cor }}></div>
              <div className="p-5">
                <div className="flex items-start justify-between mb-3">
                  <div>
                    <div className="font-extrabold text-sm">{s.nome.toUpperCase()}</div>
                    <div className="text-[11px] text-gray-400 font-semibold">{s.categoria}{s.ccCode ? ` • ${s.ccCode}` : ""}</div>
                    <div className="flex flex-wrap gap-1 mt-1">
                      {s.clienteId && (
                        <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[9px] font-bold" style={{ background: clientColor(s.clienteId)+"20", color: clientColor(s.clienteId) }}>
                          <span className="w-1.5 h-1.5 rounded-full" style={{ background: clientColor(s.clienteId) }}></span>
                          {clientName(s.clienteId).toUpperCase()}
                        </span>
                      )}
                      {s.tipo === "backup_pool" && (
                        <span className="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[9px] font-bold bg-indigo-50 text-indigo-600">
                          <Icon path={ICONS.swap} size={9} /> POOL BACKUP
                        </span>
                      )}
                    </div>
                  </div>
                  <div className="flex items-center gap-1">
                    {fCliente === "" && (
                      <>
                        <button onClick={()=>moveStore(s.id, -1)} title="Mover para cima" className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400 disabled:opacity-20" disabled={storesSorted[0]?.id === s.id}><Icon path={ICONS.chevronLeft} size={14} className="rotate-90" /></button>
                        <button onClick={()=>moveStore(s.id, 1)} title="Mover para baixo" className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400 disabled:opacity-20" disabled={storesSorted[storesSorted.length-1]?.id === s.id}><Icon path={ICONS.chevronRight} size={14} className="rotate-90" /></button>
                      </>
                    )}
                    <button onClick={()=>setModal({mode:"edit", data:s})} className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-500"><Icon path={ICONS.edit} size={14} /></button>
                    <button onClick={()=>setDeleting(s)} className="p-1.5 rounded-lg hover:bg-red-50 text-red-500"><Icon path={ICONS.trash} size={14} /></button>
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-2 text-center">
                  <div className="bg-gray-50 rounded-lg py-2.5">
                    <Icon path={ICONS.users} size={14} className="mx-auto mb-1 text-gray-400" />
                    <div className="font-extrabold text-sm">{countFor(s.id)}</div>
                    <div className="text-[9px] text-gray-400 font-semibold">Colaboradores</div>
                  </div>
                  <div className="bg-gray-50 rounded-lg py-2.5">
                    <Icon path={ICONS.check} size={14} className="mx-auto mb-1 text-gray-400" />
                    <div className="font-extrabold text-sm">{s.meta}%</div>
                    <div className="text-[9px] text-gray-400 font-semibold">Meta</div>
                  </div>
                  <div className="bg-gray-50 rounded-lg py-2.5">
                    <Icon path={ICONS.backup} size={14} className="mx-auto mb-1 text-gray-400" />
                    <div className="font-extrabold text-sm">{s.limBackup}</div>
                    <div className="text-[9px] text-gray-400 font-semibold">Lim. Backup</div>
                  </div>
                </div>
              </div>
            </div>
          ))}
          {visibleStores.length===0 && <div className="col-span-full text-center text-gray-400 py-10 text-sm">Nenhuma loja encontrada.</div>}
        </div>
      )}

      {modal && <StoreModal store={modal.data} clients={clients} onClose={()=>setModal(null)} onSave={save} />}
      {deleting && <ConfirmDelete what={deleting.nome} onConfirm={()=>remove(deleting.id)} onCancel={()=>setDeleting(null)} />}
    </div>
  );
}

function BackupModal({ backup, employees, onClose, onSave }) {
  // Colaborador do backup é texto livre -- não depende dos colaboradores cadastrados
  // no sistema. Se o registo for antigo (guardado com colaboradorId), pré-preenche
  // o campo com o nome correspondente para o utilizador poder editar à vontade.
  const nomeInicial = backup?.colaboradorNome || employees.find(e => e.id === backup?.colaboradorId)?.nome || "";
  const [form, setForm] = useState(backup ? { ...backup, colaboradorNome: nomeInicial } : { data: new Date().toISOString().slice(0,10), colaboradorNome: "", tipo: "Interno", origem: "", destino: "", duracao: 4, custo: 30, motivo: "Falta do driver residente" });
  const set = (k,v) => setForm(prev=>({...prev,[k]:v}));

  const submit = (e) => {
    e.preventDefault();
    const { colaboradorId, ...rest } = form; // deixa de gravar colaboradorId em novos registos
    onSave({ ...rest, colaboradorNome: form.colaboradorNome.trim() });
  };
  return (
    <Modal title={backup ? "Editar Backup" : "Registar Backup"} onClose={onClose}>
      <form onSubmit={submit}>

          <Field label="Origem"><input className={inputCls} value={form.origem} onChange={e=>set("origem", e.target.value)} /></Field>
          <Field label="Destino"><input className={inputCls} value={form.destino} onChange={e=>set("destino", e.target.value)} /></Field>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Duração (h)"><input type="number" min="0" className={inputCls} value={form.duracao} onChange={e=>set("duracao", Number(e.target.value))} /></Field>
          <Field label="Custo (€)"><input type="number" min="0" className={inputCls} value={form.custo} onChange={e=>set("custo", Number(e.target.value))} /></Field>

        </div>
      </form>
    </Modal>
  );
}

function BackupsView({ employees, monthOptions }) {
  const [backups, setBackups] = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [fMonth, setFMonth] = useState(""); // "" = todos os meses

  useEffect(() => {
    setLoading(true);
    let query = col("backups").orderBy("data", "desc");
    if (fMonth) {
      const [y, m] = fMonth.split("-").map(Number);
      const from = `${fMonth}-01`;
      const to = `${monthKey(m === 12 ? y + 1 : y, m === 12 ? 0 : m)}-01`;
      // Range de datas -> lê apenas os registos do mês selecionado (poupa dados/leituras)
      query = col("backups").where("data", ">=", from).where("data", "<", to).orderBy("data", "desc");
    } else {
      query = query.limit(200);
    }
    const unsub = query.onSnapshot((snap) => {
      setBackups(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoading(false);
    });
    return () => unsub();
  }, [fMonth]);

  // Nome do colaborador do backup: texto livre (colaboradorNome). Para registos
  // antigos, guardados antes desta alteração, cai para o colaborador cadastrado
  // (colaboradorId) só para não perder o histórico já existente.
  const backupColabNome = (b) => b.colaboradorNome || employees.find(e=>e.id===b.colaboradorId)?.nome || "—";
  const internos = backups.filter(b=>b.tipo==="Interno").length;
  const externos = backups.filter(b=>b.tipo==="Externo").length;
  const custoTotal = backups.reduce((s,b)=>s+(Number(b.custo)||0),0);

  const save = async (data) => {
    if (data.id) await col("backups").doc(data.id).set(data, { merge:true });
    else await col("backups").add({ ...data, criadoEm: Date.now() });
    logHistory(data.id ? "Editou" : "Criou", "Backup", backupColabNome(data), `${data.tipo} · ${data.origem} → ${data.destino} · ${fmtEUR(data.custo)}`);
    setModal(null);
  };

  return (
    <div className="page fade-in">
      <div className="flex items-start justify-between mb-5">
        <div>
          <div className="eyebrow mb-1">Gestão</div>
          <h1 className="page-title">Gestão de Backups</h1>
          <p className="text-sm text-gray-400">{backups.length} registos de backup{fMonth ? " · filtrado por mês" : ""}</p>
        </div>
        <div className="flex items-center gap-2">
          <select value={fMonth} onChange={(e)=>setFMonth(e.target.value)} className="border border-[var(--border-c)] rounded-lg px-3 py-1.5 text-sm bg-white font-medium">
            <option value="">Todos os meses</option>
            {monthOptions.map(mk => { const [yy,mm]=mk.split("-").map(Number); return <option key={mk} value={mk}>{MESES[mm-1]} {yy}</option>; })}
          </select>
          <button onClick={()=>setModal({mode:"new"})} className="flex items-center gap-1.5 px-4 py-2.5 rounded-lg text-sm font-semibold text-white" style={{ background: "var(--accent)" }}>
            <Icon path={ICONS.plus} size={16} /> Registar Backup
          </button>
        </div>
      </div>

      <div className="grid grid-cols-3 gap-4 mb-5">
        <div className="bg-white rounded-2xl border border-[var(--border-c)] p-6 text-center">
          <div className="text-3xl font-extrabold" style={{color:"#14b8a6"}}>{internos}</div>
          <div className="text-xs font-bold text-gray-400 mt-1">INTERNOS</div>
        </div>
        <div className="bg-white rounded-2xl border border-[var(--border-c)] p-6 text-center">
          <div className="text-3xl font-extrabold" style={{color:"#f59e0b"}}>{externos}</div>
          <div className="text-xs font-bold text-gray-400 mt-1">EXTERNOS</div>
        </div>
        <div className="bg-white rounded-2xl border border-[var(--border-c)] p-6 text-center">
          <div className="text-3xl font-extrabold">{fmtEUR(custoTotal)}</div>
          <div className="text-xs font-bold text-gray-400 mt-1">CUSTO TOTAL</div>
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-[var(--border-c)] overflow-x-auto">
        <table className="w-full text-sm min-w-[820px]">
          <thead>
            <tr className="text-left text-gray-400 text-xs font-bold border-b border-[var(--border-c)]">
              <th className="px-5 py-3">Data</th><th className="px-5 py-3">Colaborador</th><th className="px-5 py-3">Tipo</th>
              <th className="px-5 py-3">Origem → Destino</th><th className="px-5 py-3">Duração</th><th className="px-5 py-3">Custo</th>
              <th className="px-5 py-3">Motivo</th><th className="px-5 py-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody>
            {loading ? <tr><td colSpan={8} className="text-center text-gray-300 py-10 text-sm">A carregar…</td></tr> :
              backups.map(b => (
                <tr key={b.id} className="border-b border-[var(--border-c)] last:border-0 hover:bg-gray-50/60">
                  <td className="px-5 py-3">{b.data?.split("-").reverse().join("/")}</td>
                  <td className="px-5 py-3 font-semibold">{backupColabNome(b)}</td>
                  <td className="px-5 py-3">
                    <span className={`px-2 py-0.5 rounded-md text-xs font-semibold ${b.tipo==="Interno" ? "bg-teal-50 text-teal-600" : "bg-amber-50 text-amber-600"}`}>{b.tipo}</span>
                  </td>
                  <td className="px-5 py-3 text-gray-500">{b.origem} → {b.destino}</td>
                  <td className="px-5 py-3 text-gray-500">{b.duracao}h</td>
                  <td className="px-5 py-3 font-semibold">{fmtEUR(b.custo)}</td>
                  <td className="px-5 py-3 text-gray-400">{b.motivo}</td>
                  <td className="px-5 py-3 text-right">
                    <button onClick={()=>setModal({mode:"edit", data:b})} className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-500"><Icon path={ICONS.edit} size={15} /></button>
                  </td>
                </tr>
              ))}
            {!loading && backups.length===0 && <tr><td colSpan={8} className="text-center text-gray-400 py-10 text-sm">Sem registos de backup.</td></tr>}
          </tbody>
        </table>
      </div>

      {modal && <BackupModal backup={modal.data} employees={employees} onClose={()=>setModal(null)} onSave={save} />}
    </div>
  );
}

function fmtDateTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  return d.toLocaleDateString("pt-PT", { day: "2-digit", month: "2-digit", year: "numeric" }) + " · " +
         d.toLocaleTimeString("pt-PT", { hour: "2-digit", minute: "2-digit" });
}
