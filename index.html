/* RELATÓRIO DO DIA — cartão por cliente pronto para o WhatsApp            */
/* ====================================================================== */
const presTone = (c) => { const p = presencaPct(c); return p === null ? "#64748b" : c.sem > 0 ? (p >= 95 ? "#b45309" : "#b91c1c") : (c.pend ? "#b45309" : "#15803d"); };
const slugify = (s) => normTxt(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const fmtHM = (d) => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

const canShareFiles = (() => {
  try { return typeof navigator !== "undefined" && !!navigator.canShare && navigator.canShare({ files: [new File([""], "x.png", { type: "image/png" })] }); } catch (e) { return false; }
})();

function waText(r, date, showPresent) {
  const c = r.c, p = presencaPct(c);
  const L = [];
  L.push(`*${r.nome.toUpperCase()} — Presenças ${fmtDMY(date)}*`);
  L.push(`Presença: *${p === null ? "—" : fmtPct(p)}*`);
  L.push(`✅ Presentes: ${c.ok} de ${postosOf(c)} postos`);
  L.push(`🔁 Faltas repostas com backup: ${totalRepostas(c)}${totalRepostas(c) ? ` (${c.cInt} interno · ${c.cExt} externo)` : ""}`);
  L.push(`❌ Faltas sem reposição: ${fmtNum(c.semW)}`);
  if (c.pend) L.push(`⚠️ Por confirmar: ${c.pend} (ainda não contam como posto assegurado)`);
  r.stores.forEach((s) => {
    L.push("");
    L.push(`*${s.nome}* — ${postosOf(s.c) ? fmtPct(presencaPct(s.c)) : "sem postos previstos"}`);
    if (!s.abs.length && !(s.off || []).length) L.push("• Sem faltas");
    s.abs.slice().sort((a, b) => a.emp.localeCompare(b.emp)).forEach((a) => L.push(`• ${a.emp}: ${absLabel(a).toLowerCase()} → ${a.cob === "sem" ? "❌ sem reposição" : "✅ " + covLabel(a).toLowerCase()}`));
    (s.off || []).slice().sort((a, b) => a.emp.localeCompare(b.emp)).forEach((o) => L.push(`• ${o.emp}: ${o.st.toLowerCase()}`));
    if (showPresent && s.present.length) L.push(`Presentes: ${s.present.slice().sort().join(", ")}`);
    if (s.pending) L.push(`⚠️ ${s.pending} por confirmar`);
  });
  return L.join("\n");
}

/* ---------- Imagem do relatório desenhada em Canvas (medidas exatas, igual em qualquer browser) ---------- */
const RW = 760, RP = 28;
const RF = (w, s) => `${w} ${s}px Inter, "Segoe UI", -apple-system, system-ui, Roboto, Arial, sans-serif`;
async function ensureReportFonts() {
  try { if (document.fonts && document.fonts.load) await Promise.all(["500", "600", "700", "800"].map((w) => document.fonts.load(`${w} 16px Inter`))); } catch (e) {}
}
function rrPath(ctx, x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fitText(ctx, text, maxW) {
  if (maxW <= 0) return "";
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t.trimEnd() + "…";
}
function wrapText(ctx, text, maxW) {
  const words = String(text).split(/\s+/).filter(Boolean), lines = [];
  let cur = "";
  words.forEach((w) => { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  return lines;
}
function setLS(ctx, px) { try { ctx.letterSpacing = px + "px"; } catch (e) {} }
function iconCheck(ctx, cx, cy, s, color, lw = 2.2) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(cx - s * 0.5, cy + s * 0.02); ctx.lineTo(cx - s * 0.14, cy + s * 0.36); ctx.lineTo(cx + s * 0.5, cy - s * 0.32); ctx.stroke(); ctx.restore();
}
function iconX(ctx, cx, cy, s, color, lw = 2.2) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - s * 0.38, cy - s * 0.38); ctx.lineTo(cx + s * 0.38, cy + s * 0.38); ctx.moveTo(cx + s * 0.38, cy - s * 0.38); ctx.lineTo(cx - s * 0.38, cy + s * 0.38); ctx.stroke(); ctx.restore();
}

// Desenha (draw=true) ou apenas mede (draw=false) o cartão. Devolve a altura total.
function paintReport(ctx, r, date, showPresent, draw) {
  const W = RW, P = RP, IW = W - 2 * P;
  const c = r.c, pct = presencaPct(c), tone = presTone(c);
  const T = (txt, x, y, font, color, align = "left", base = "middle") => { if (!draw) return; ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(txt, x, y); };
  const M = (txt, font) => { ctx.font = font; return ctx.measureText(txt).width; };
  let y = P;

  // Cabeçalho
  if (draw) {
    const g = ctx.createLinearGradient(P, y, P + 40, y + 40); g.addColorStop(0, "#4361ee"); g.addColorStop(1, "#7c3aed");
    ctx.fillStyle = g; rrPath(ctx, P, y, 40, 40, 11); ctx.fill();
    iconCheck(ctx, P + 20, y + 20, 18, "#ffffff", 3);
  }
  T("Delivery Express", P + 52, y + 13, RF(800, 17), "#0f172a");
  T("Presenças · Colaboradores", P + 52, y + 31, RF(600, 12.5), "#64748b");
  T(fmtLongDate(date), W - P, y + 20, RF(600, 13), "#475569", "right");
  y += 40 + 18;

  // Bloco do cliente
  const bh = 112;
  if (draw) {
    ctx.fillStyle = "#f8fafc"; rrPath(ctx, P, y, IW, bh, 16); ctx.fill();
    ctx.save(); rrPath(ctx, P, y, IW, bh, 16); ctx.clip(); ctx.fillStyle = r.cor || "#4361ee"; ctx.fillRect(P, y, 6, bh); ctx.restore();
  }
  const pctTxt = pct === null ? "—" : fmtPct(pct);
  const pctW = M(pctTxt, RF(800, 50));
  T(pctTxt, W - P - 22, y + 62, RF(800, 50), tone, "right", "alphabetic");
  if (draw) { ctx.font = RF(700, 11); setLS(ctx, 1.2); ctx.fillStyle = "#64748b"; ctx.textAlign = "right"; ctx.textBaseline = "alphabetic"; ctx.fillText("PRESENÇA NO DIA", W - P - 22, y + 88); setLS(ctx, 0); }
  if (draw) { ctx.font = RF(700, 11); setLS(ctx, 1.2); ctx.fillStyle = "#64748b"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic"; ctx.fillText("CLIENTE", P + 28, y + 42); setLS(ctx, 0); }
  ctx.font = RF(800, 28);
  T(fitText(ctx, r.nome, IW - 28 - pctW - 44), P + 28, y + 78, RF(800, 28), "#0f172a", "left", "alphabetic");
  y += bh + 12;

  // Indicadores
  const sw = (IW - 30) / 4, sh = 86;
  const stats = [
    [String(postosOf(c)), "Postos previstos", "#f1f5f9", "#0f172a"],
    [String(c.ok), "Presentes", "#f1f5f9", "#0f172a"],
    [String(totalRepostas(c)), "Faltas repostas com backup", totalRepostas(c) ? "#ecfdf5" : "#f1f5f9", totalRepostas(c) ? "#0f766e" : "#0f172a"],
    [fmtNum(c.semW), "Faltas sem reposição", c.sem ? "#fef2f2" : "#f1f5f9", c.sem ? "#b91c1c" : "#0f172a"],
  ];
  stats.forEach(([v, l, bg, fg], i) => {
    const x = P + i * (sw + 10);
    if (draw) { ctx.fillStyle = bg; rrPath(ctx, x, y, sw, sh, 14); ctx.fill(); }
    T(v, x + 16, y + 40, RF(800, 28), fg, "left", "alphabetic");
    ctx.font = RF(600, 12);
    wrapText(ctx, l, sw - 30).slice(0, 2).forEach((ln, k) => T(ln, x + 16, y + 58 + k * 15, RF(600, 12), "#64748b", "left", "alphabetic"));
  });
  y += sh + 12;

  // Mensagem geral
  const aus = totalAusencias(c);
  const pend = c.pend || 0;
  const warn = pend > 0;
  const banner = warn ? `${pend} colaborador${pend > 1 ? "es" : ""} por confirmar — ainda não ${pend > 1 ? "contam" : "conta"} como posto assegurado`
    : postosOf(c) > 0 && aus === 0 ? "Sem faltas — todos os postos assegurados" : aus > 0 && c.sem === 0 ? "Todas as faltas foram repostas com backup" : "";
  if (banner) {
    if (draw) {
      ctx.fillStyle = warn ? "#fffbeb" : "#f0fdf4"; rrPath(ctx, P, y, IW, 42, 12); ctx.fill();
      ctx.strokeStyle = warn ? "#fde68a" : "#bbf7d0"; ctx.lineWidth = 1; rrPath(ctx, P + 0.5, y + 0.5, IW - 1, 41, 12); ctx.stroke();
      if (warn) { ctx.save(); ctx.fillStyle = "#b45309"; ctx.beginPath(); ctx.arc(P + 22, y + 21, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#fff"; ctx.font = RF(800, 11); ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("!", P + 22, y + 21.5); ctx.restore(); }
      else iconCheck(ctx, P + 22, y + 21, 12, "#15803d", 2.4);
    }
    ctx.font = RF(700, 14);
    T(fitText(ctx, banner, IW - 52), P + 38, y + 21.5, RF(700, 14), warn ? "#92400e" : "#15803d");
    y += 42 + 12;
  }

  // Lojas
  const rowH = 46, headH = 50;
  r.stores.forEach((s) => {
    const rows = s.abs.slice().sort((a, b) => (a.cob === "sem" ? 0 : 1) - (b.cob === "sem" ? 0 : 1) || a.emp.localeCompare(b.emp));
    ctx.font = RF(500, 12.5);
    const pres = showPresent && s.present.length ? wrapText(ctx, "Presentes: " + s.present.slice().sort().join(", "), IW - 32) : [];
    const offRows = s.off.slice().sort((a, b) => a.emp.localeCompare(b.emp));
    const nRows = rows.length + offRows.length;
    const h = headH + nRows * rowH + (pres.length ? 10 + pres.length * 18 : 0) + (s.pending ? 30 : 0) + (nRows || pres.length || s.pending ? 4 : 0);
    if (draw) { ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1; rrPath(ctx, P + 0.5, y + 0.5, IW - 1, h - 1, 14); ctx.stroke(); }
    const sp = presencaPct(s.c), spTxt = sp === null ? "" : fmtPct(sp);
    const spW = M(spTxt, RF(800, 18));
    T(spTxt, W - P - 18, y + headH / 2, RF(800, 18), presTone(s.c), "right");
    ctx.font = RF(800, 15.5);
    const nm = fitText(ctx, s.nome, IW * 0.55);
    const nmW = ctx.measureText(nm).width;
    T(nm, P + 18, y + headH / 2, RF(800, 15.5), "#0f172a");
    const meta = postosOf(s.c) ? `${fmtNum(assuredOf(s.c))}/${postosOf(s.c)} postos assegurados` : "sem postos previstos";
    const metaW = M(meta, RF(600, 12.5));
    if (P + 18 + nmW + 12 + metaW < W - P - 18 - spW - 16) T(meta, P + 18 + nmW + 12, y + headH / 2 + 0.5, RF(600, 12.5), "#64748b");
    let ry = y + headH;
    rows.forEach((a) => {
      if (draw) { ctx.save(); ctx.strokeStyle = "#e2e8f0"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(P + 18, ry + 0.5); ctx.lineTo(W - P - 18, ry + 0.5); ctx.stroke(); ctx.restore(); }
      const cy = ry + rowH / 2;
      const bad = a.cob === "sem";
      const label = bad ? "Sem reposição" : covLabel(a);
      ctx.font = RF(800, 12.5);
      const lab = fitText(ctx, label, IW * 0.46);
      const pw = ctx.measureText(lab).width + 40, ph = 28, px = W - P - 18 - pw;
      if (draw) {
        ctx.fillStyle = bad ? "#fee2e2" : "#ccfbf1"; rrPath(ctx, px, cy - ph / 2, pw, ph, 14); ctx.fill();
        if (bad) iconX(ctx, px + 15, cy, 10, "#b91c1c", 2.2); else iconCheck(ctx, px + 15, cy, 11, "#0f766e", 2.2);
      }
      T(lab, px + 27, cy + 0.5, RF(800, 12.5), bad ? "#b91c1c" : "#0f766e");
      const tp = absLabel(a);
      const tpW = M(tp, RF(600, 12.5));
      T(tp, px - 12, cy + 0.5, RF(600, 12.5), "#64748b", "right");
      ctx.font = RF(700, 14.5);
      T(fitText(ctx, a.emp, px - 12 - tpW - 16 - (P + 18)), P + 18, cy + 0.5, RF(700, 14.5), "#0f172a");
      ry += rowH;
    });
    offRows.forEach((o) => {
      if (draw) { ctx.save(); ctx.strokeStyle = "#e2e8f0"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(P + 18, ry + 0.5); ctx.lineTo(W - P - 18, ry + 0.5); ctx.stroke(); ctx.restore(); }
      const cy = ry + rowH / 2;
      ctx.font = RF(800, 12.5);
      const pw = ctx.measureText(o.st).width + 28, ph = 28, px = W - P - 18 - pw;
      if (draw) { ctx.fillStyle = "#f1f5f9"; rrPath(ctx, px, cy - ph / 2, pw, ph, 14); ctx.fill(); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1; rrPath(ctx, px + 0.5, cy - ph / 2 + 0.5, pw - 1, ph - 1, 14); ctx.stroke(); }
      T(o.st, px + pw / 2, cy + 0.5, RF(800, 12.5), "#475569", "center");
      ctx.font = RF(700, 14.5);
      T(fitText(ctx, o.emp, px - 16 - (P + 18)), P + 18, cy + 0.5, RF(700, 14.5), "#475569");
      ry += rowH;
    });
    if (pres.length) { ry += 6; pres.forEach((ln, k) => T(ln, P + 18, ry + 9 + k * 18, RF(500, 12.5), "#475569")); ry += pres.length * 18 + 4; }
    if (s.pending) T(`${s.pending} por confirmar`, P + 18, ry + 15, RF(700, 12.5), "#b45309");
    y += h + 10;
  });

  // Rodapé
  ctx.font = RF(500, 11.5);
  const foot = wrapText(ctx, `Presença = postos assegurados ÷ postos previstos. Faltas repostas com backup interno ou externo não reduzem a presença. · Atualizado às ${fmtHM(new Date())}`, IW);
  y += 4;
  foot.forEach((ln, k) => T(ln, P, y + 8 + k * 16, RF(500, 11.5), "#94a3b8"));
  y += foot.length * 16 + P - 4;
  return Math.ceil(y);
}

async function renderReportCanvas(r, date, showPresent, scale = 2) {
  await ensureReportFonts();
  const m = document.createElement("canvas").getContext("2d");
  const H = paintReport(m, r, date, showPresent, false);
  const cv = document.createElement("canvas");
  cv.width = RW * scale; cv.height = H * scale;
  const ctx = cv.getContext("2d");
  ctx.scale(scale, scale);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, RW, H);
  paintReport(ctx, r, date, showPresent, true);
  return cv;
}
const canvasBlob = (cv) => new Promise((res, rej) => cv.toBlob((b) => (b ? res(b) : rej(new Error("Falha ao gerar a imagem."))), "image/png"));
async function reportBlob(r, date, showPresent) { return canvasBlob(await renderReportCanvas(r, date, showPresent)); }

function ReportCard({ r, date, showPresent }) {
  const ops = useOps();
  const [url, setUrl] = useState("");
  const [busy, setBusy] = useState("");
  const sig = JSON.stringify([r.c, r.stores.map((s) => [s.nome, s.c, s.pending, s.off, s.abs.map((a) => [a.emp, a.st, a.cob, a.cobBy]), showPresent ? s.present : 0]), date, showPresent, r.nome, r.cor]);
  useEffect(() => {
    let alive = true;
    renderReportCanvas(r, date, showPresent).then((cv) => { if (alive) setUrl(cv.toDataURL("image/png")); }).catch((e) => { if (alive) setUrl(""); console.error(e); });
    return () => { alive = false; };
  }, [sig]);
  const file = () => `presencas-${slugify(r.nome)}-${date}.png`;
  const run = async (kind) => {
    setBusy(kind);
    try {
      if (kind === "text") { await navigator.clipboard.writeText(waText(r, date, showPresent)); ops.toast("success", `Texto de ${r.nome} copiado — cola no grupo do WhatsApp.`); return; }
      const blob = await reportBlob(r, date, showPresent);
      if (kind === "share") { await navigator.share({ files: [new File([blob], file(), { type: "image/png" })], title: `Presenças ${r.nome} ${fmtDMY(date)}` }); return; }
      if (kind === "copy") {
        if (!navigator.clipboard || typeof window.ClipboardItem === "undefined") throw new Error("Este navegador não permite copiar imagens. Usa “PNG” e anexa no WhatsApp.");
        await navigator.clipboard.write([new window.ClipboardItem({ "image/png": blob })]);
        ops.toast("success", `Imagem de ${r.nome} copiada — no grupo do WhatsApp faz Ctrl+V.`); return;
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file(); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    } catch (e) { if (e && e.name !== "AbortError") ops.toast("error", String((e && e.message) || e)); }
    finally { setBusy(""); }
  };
  return (
    <div className="report-wrap" data-client={r.nome}>
      <div className="wa-preview">
        {url ? <img src={url} alt={`Relatório de presenças de ${r.nome}`} className="wa-img" /> : <div className="skeleton rounded-2xl" style={{ height: 420 }} />}
      </div>
      <div className="sr-only wa-summary">{waText(r, date, showPresent)}</div>
      <div className="report-actions">
        {r.pending > 0 && <span className="text-[11px] font-semibold text-amber-600 mr-auto">{r.pending} por confirmar</span>}
        <button onClick={() => run("copy")} disabled={!!busy} className="btn btn-primary btn-sm"><Icon path={busy === "copy" ? ICONS.refresh : ICONS.layers} size={14} className={busy === "copy" ? "spin" : ""} />Copiar imagem</button>
        {canShareFiles && <button onClick={() => run("share")} disabled={!!busy} className="btn btn-primary btn-sm"><Icon path={ICONS.arrowRight} size={14} />Partilhar</button>}
        <button onClick={() => run("png")} disabled={!!busy} className="btn btn-ghost btn-sm"><Icon path={ICONS.download} size={14} />PNG</button>
        <button onClick={() => run("text")} disabled={!!busy} className="btn btn-ghost btn-sm"><Icon path={ICONS.file} size={14} />Copiar texto</button>
      </div>
    </div>
  );
}

function periodRange(mode, date) {
  if (mode === "7d") return [shiftISO(date, -6), date];
  if (mode === "mes") return [`${mkOfISO(date)}-01`, date];
  return [date, date];
}
function summarizeClients(recs, clients) {
  const map = new Map();
  recs.forEach((r) => {
    if (r.st === "Pool") return;
    const id = r.clientId || "_none";
    let C = map.get(id);
    if (!C) { const cl = clients.find((x) => x.id === r.clientId); C = { id, nome: r.client, cor: r.clientCor, c: emptyCounts(), abs: [], stores: new Map() }; map.set(id, C); }
    addRec(C.c, r);
    if (isAbsence(r)) C.abs.push(r);
    let S = C.stores.get(r.storeId || "_none");
    if (!S) { S = { id: r.storeId || "_none", nome: r.store, c: emptyCounts(), abs: [] }; C.stores.set(S.id, S); }
    addRec(S.c, r); if (isAbsence(r)) S.abs.push(r);
  });
  return [...map.values()].filter((C) => postosOf(C.c) > 0).map((C) => ({ ...C, stores: [...C.stores.values()].filter((S) => postosOf(S.c) > 0).sort((a, b) => a.nome.localeCompare(b.nome)) }));
}

function CommandCenterView() {

                <button key={s.id} onClick={() => openCli(s.id)} className="cc-item">
                  <div className="flex items-center gap-2"><i style={{ background: s.cor }} /><b>{s.nome}</b><span className="ml-auto cc-num bad">{fmtNum(s.c.semW)} sem reposição</span></div>
                  <div className="cc-sub">Presença {fmtPct(presencaPct(s.c))}{totalRepostas(s.c) ? ` · ${totalRepostas(s.c)} reposta(s)` : ""}</div>
                  <div className="cc-names">{names(s.abs, (r) => r.cob === "sem")}</div>
                </button>
              ))}
            </div>
            <div className="cc-col cc-ok">
              <div className="cc-head"><Icon path={ICONS.backup} size={16} />Faltas repostas com backup<span>{repList.length}</span></div>
              {repList.length === 0 ? <div className="cc-empty">Nenhum cliente com faltas totalmente repostas.</div> : repList.map((s) => (
                <button key={s.id} onClick={() => openCli(s.id)} className="cc-item">
                  <div className="flex items-center gap-2"><i style={{ background: s.cor }} /><b>{s.nome}</b><span className="ml-auto cc-num ok">{totalRepostas(s.c)} reposta(s)</span></div>
                  <div className="cc-sub">{s.c.cInt} backup interno · {s.c.cExt} backup externo · presença {fmtPct(presencaPct(s.c))}</div>
                  <div className="cc-names">{names(s.abs, () => true)}</div>
                </button>
              ))}
            </div>
            <div className="cc-col cc-neutral">
              <div className="cc-head"><Icon path={ICONS.check} size={16} />Sem faltas<span>{okList.length}</span></div>
              {okList.length === 0 ? <div className="cc-empty">Todos os clientes com registos tiveram pelo menos uma falta.</div> : (
                <div className="flex flex-wrap gap-1.5">{okList.map((s) => <button key={s.id} onClick={() => openCli(s.id)} className="cchip"><i style={{ background: s.cor }} />{s.nome}<span className={s.c.pend ? "warn" : ""}>{s.c.pend ? `${s.c.pend} por confirmar` : `${postosOf(s.c)} postos`}</span></button>)}</div>
              )}
            </div>
          </div>

          <Card title={`Resumo por cliente · ${periodTxt}`} right={<span className="text-[11px] text-[var(--text-secondary)]">{mode === "dia" ? "Clique para abrir o cartão do cliente" : "Clique para abrir a análise do cliente"}</span>}>
            {sums.length === 0 ? <EmptyState title="Sem registos no período" text="Ainda não há presenças registadas para os clientes ativos neste período." /> : (
              <div className="overflow-x-auto -mx-1"><table className="tbl min-w-[720px]">
                <thead><tr><th>Cliente</th><th className="num">Presença</th><th className="num">Postos</th><th className="num">Faltas</th><th className="num">Backup interno</th><th className="num">Backup externo</th><th className="num">Sem reposição</th><th></th></tr></thead>
                <tbody>{sums.sort((a, b) => b.c.semW - a.c.semW || a.nome.localeCompare(b.nome)).map((s) => (
                  <tr key={s.id} className="clickable" onClick={() => openCli(s.id)}>
                    <td><span className="inline-flex items-center gap-2 font-bold"><span className="w-2 h-2 rounded-full" style={{ background: s.cor }} />{s.nome}</span></td>
                    <td className="num font-extrabold" style={{ color: presTone(s.c) }}>{fmtPct(presencaPct(s.c))}</td>
                    <td className="num">{postosOf(s.c)}</td>
                    <td className="num">{totalAusencias(s.c)}</td>
                    <td className="num">{s.c.cInt}</td>
                    <td className="num">{s.c.cExt}</td>
                    <td className="num" style={s.c.sem ? { color: "#b91c1c", fontWeight: 800 } : {}}>{fmtNum(s.c.semW)}</td>
                    <td className="text-right"><Icon path={ICONS.chevronRight} size={14} className="text-[var(--text-secondary)]" /></td>
                  </tr>
                ))}</tbody>
              </table></div>
            )}
          </Card>
        </>
      )}
    </div>
  );
}

/* ====================================================================== */
/* ALERTAS — só clientes com faltas sem reposição e motoristas reincidentes */
/* ====================================================================== */
function AlertMini({ a, unread, onOpen }) {
  return (
    <button onClick={onOpen} className="alert-mini" style={{ borderLeftColor: PRIO[a.sev].color }}>
      <div className="flex items-center gap-2 mb-0.5"><PrioBadge sev={a.sev} />{unread && <span className="new-dot" title="Novo" />}<span className="text-[11px] text-[var(--text-secondary)] ml-auto truncate">{a.kind}</span></div>
      <div className="text-[13px] font-bold truncate text-left">{a.title}</div>
      <div className="text-[11.5px] text-[var(--text-secondary)] text-left line-clamp-2">{a.summary}</div>
    </button>
  );
}

function AlertCard({ a, open, onToggle, unread, reappeared, follow, readBy, onRead, onFollow }) {
  const ops = useOps();
  return (
    <div id={`alert-${a.key}`} className={`alert-card ${unread ? "unread" : ""}`} style={{ borderLeftColor: PRIO[a.sev].color }}>
      <div className="flex items-center gap-2 flex-wrap mb-1">
        <PrioBadge sev={a.sev} />
        <span className="text-[11px] font-bold text-[var(--text-secondary)]">{a.kind}</span>
        {unread && <span className="tag tag-new">{reappeared ? "Novas faltas" : "Novo"}</span>}
        {follow && <span className="tag tag-blue"><Icon path={ICONS.flag} size={10} />Em acompanhamento</span>}
        <span className="text-[11px] text-[var(--text-secondary)] ml-auto">{a.period}</span>
      </div>
      <div className="text-[15px] font-extrabold leading-snug">{a.title}</div>
      {a.entity && <div className="text-xs text-[var(--text-secondary)] mt-0.5">{a.entity}</div>}
      <p className="text-[13px] mt-2 leading-relaxed">{a.summary}</p>
      <div className="flex items-center gap-1.5 flex-wrap mt-3">
        <button onClick={onToggle} className="btn btn-ghost btn-xs"><Icon path={ICONS.eye} size={13} />{open ? "Ocultar faltas" : `Ver faltas (${a.recs.length})`}</button>
        {a.nav && <button onClick={() => (a.nav.view === "employee" ? ops.openEmployee(a.nav.params.empId) : ops.nav(a.nav.view, a.nav.params))} className="btn btn-ghost btn-xs"><Icon path={ICONS.arrowRight} size={13} />{a.nav.label}</button>}
        {unread ? <button onClick={onRead} className="btn btn-ghost btn-xs"><Icon path={ICONS.check} size={13} />Marcar como lido</button> : <span className="text-[11px] text-[var(--text-secondary)] px-1">Lido{readBy ? ` por ${readBy}` : ""}</span>}
        <button onClick={onFollow} className="btn btn-ghost btn-xs"><Icon path={ICONS.flag} size={13} />{follow ? "Retirar acompanhamento" : "Acompanhar"}</button>
      </div>
      {open && <div className="mt-3"><OccurrenceTable items={a.recs} maxH={280} /></div>}
    </div>
  );
}

function AlertCenterView({ params }) {
  const ops = useOps();
  const [tab, setTab] = useState("ativos");
  const [fKind, setFKind] = useState("");
  const [fState, setFState] = useState("");
  const [fClient, setFClient] = useState("");
  const [open, setOpen] = useState({});
  const focus = params && params.focus;
  useEffect(() => {
    if (!focus) return;
    setOpen((o) => ({ ...o, [focus]: true }));
    setTimeout(() => { const el = document.getElementById(`alert-${focus}`); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); }, 120);
  }, [focus]);
  const reads = ops.alertState.reads || {}, follows = ops.alertState.follow || {}, seen = ops.alertState.seen || {};
  const list = ops.alerts.filter((a) => {
    if (fKind && a.kind !== fKind) return false;
    if (fClient && !(a.clientIds || []).includes(fClient)) return false;
    const un = ops.isUnread(a), fo = !!(follows[a.key] && follows[a.key].on);
    if (fState === "novos" && !un) return false;
    if (fState === "acomp" && !fo) return false;
    return true;
  });
  const nCli = ops.alerts.filter((a) => a.kind === "Cliente com faltas sem reposição").length;
  const nEmp = ops.alerts.length - nCli;
  const unreadN = ops.alerts.filter((a) => ops.isUnread(a)).length;
  const activeKeys = new Set(ops.alerts.map((a) => a.key));
  const past = Object.entries(seen).filter(([k]) => !activeKeys.has(k) && /^(cliSem|emp)\|/.test(k)).map(([k, v]) => ({ key: k, ...v })).sort((a, b) => (b.last || 0) - (a.last || 0));
  return (
    <div className="page fade-in">
      <PageHeader eyebrow="Direção" title="Alertas" subtitle="Clientes com faltas sem reposição (7 dias) e motoristas que faltam com recorrência (30 dias)."
        right={unreadN > 0 ? <button onClick={() => ops.markRead(list.filter((a) => ops.isUnread(a)))} className="btn btn-ghost"><Icon path={ICONS.checkAll} size={15} />Marcar visíveis como lidos</button> : null} />
      <div className="grid grid-cols-3 gap-3 mb-5">
        <button onClick={() => setFKind(fKind === "Cliente com faltas sem reposição" ? "" : "Cliente com faltas sem reposição")} className={`kpi kpi-click text-left ${fKind === "Cliente com faltas sem reposição" ? "ring-2 ring-red-400" : ""}`}><span className="kpi-label">Clientes sem reposição</span><div className="kpi-value" style={{ color: nCli ? "#b91c1c" : undefined }}>{nCli}</div></button>
        <button onClick={() => setFKind(fKind === "Motorista reincidente" ? "" : "Motorista reincidente")} className={`kpi kpi-click text-left ${fKind === "Motorista reincidente" ? "ring-2 ring-amber-400" : ""}`}><span className="kpi-label">Motoristas reincidentes</span><div className="kpi-value" style={{ color: nEmp ? "#b45309" : undefined }}>{nEmp}</div></button>
        <button onClick={() => setFState(fState === "novos" ? "" : "novos")} className={`kpi kpi-click text-left ${fState === "novos" ? "ring-2 ring-[var(--accent)]" : ""}`}><span className="kpi-label">Não lidos</span><div className="kpi-value" style={{ color: "var(--accent)" }}>{unreadN}</div></button>
      </div>
      <div className="toolbar mb-4">
        <Seg value={tab} onChange={setTab} options={[["ativos", "Ativos", ops.alerts.length], ["historico", "Anteriores", past.length]]} />
        {tab === "ativos" && <>
          <select value={fState} onChange={(e) => setFState(e.target.value)} className="input w-auto"><option value="">Todos</option><option value="novos">Só novos</option><option value="acomp">Em acompanhamento</option></select>
          <select value={fClient} onChange={(e) => setFClient(e.target.value)} className="input w-auto"><option value="">Todos os clientes</option>{ops.clients.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}</select>
        </>}
      </div>
      {tab === "ativos" ? (ops.alertsStatus === "loading" ? <Skeleton rows={3} /> : list.length === 0 ? (
        <div className="card"><EmptyState icon={ICONS.check} title={ops.alerts.length ? "Nenhum alerta com estes filtros" : "Sem alertas"} text={ops.alerts.length ? "" : "Nenhum cliente com faltas por repor nos últimos 7 dias e nenhum motorista acima dos limites."} /></div>
      ) : (
        <div className="space-y-3">{list.map((a) => {
          const rd = reads[a.key];
          return <AlertCard key={a.key} a={a} open={!!open[a.key]} onToggle={() => setOpen((o) => ({ ...o, [a.key]: !o[a.key] }))} unread={ops.isUnread(a)} reappeared={!!rd && rd.sig !== a.sig}
            readBy={rd && rd.sig === a.sig ? rd.user : ""} follow={!!(follows[a.key] && follows[a.key].on)} onRead={() => ops.markRead([a])} onFollow={() => ops.toggleFollow(a.key)} />;
        })}</div>
      )) : (
        <div className="card overflow-hidden">
          {past.length === 0 ? <EmptyState title="Sem alertas anteriores" /> : (
            <div className="overflow-x-auto"><table className="tbl min-w-[640px]">
              <thead><tr><th>Prioridade</th><th>Alerta</th><th>Período</th><th>Visto pela última vez</th></tr></thead>
              <tbody>{past.slice(0, 300).map((p) => <tr key={p.key}><td><PrioBadge sev={p.sev in PRIO ? p.sev : "medio"} /></td><td className="font-semibold">{p.title}<div className="text-[11px] text-[var(--text-secondary)] font-normal">{p.kind}</div></td><td className="text-xs">{p.period}</td><td className="text-xs whitespace-nowrap">{p.last ? fmtDateTime(p.last) : "—"}</td></tr>)}</tbody>
            </table></div>
          )}
        </div>
      )}
      <p className="text-[11px] text-[var(--text-secondary)] mt-4">Limites editáveis em Configurações. “Marcar como lido” só retira o indicador de novo; se surgirem novas faltas o alerta volta a aparecer como novo.</p>
    </div>
  );
}

/* ANÁLISES — por cliente, motoristas reincidentes, backups enviados       */
/* ====================================================================== */
function AnalysisView({ params }) {
  const ops = useOps();
  const { stores, employees, clients } = ops;
  const curMk = ops.monthOptions[ops.monthOptions.length - 1];
  const [period, setPeriod] = useState(curMk);
  const [open, setOpen] = useState((params && params.clientId) || null);
  const [minFaltas, setMinFaltas] = useState(2);
  const t = todayISO();
  const range = period === "7d" ? [shiftISO(t, -6), t] : period === "30d" ? [shiftISO(t, -29), t] : [`${period}-01`, isoDate(Number(period.slice(0, 4)), Number(period.slice(5)) - 1, daysInMonth(Number(period.slice(0, 4)), Number(period.slice(5)) - 1))];
  const evoEnd = period.length === 7 ? period : curMk;
  const months = useMemo(() => [...new Set([...monthWindow(evoEnd, 6), mkOfISO(range[0]), mkOfISO(range[1])])].sort(), [evoEnd, range[0], range[1]]);
  const data = useOpsData({ months, stores, employees, clients, getScheduleForMonth: ops.getScheduleForMonth, enabled: ops.refsReady });
  const ready = data.status === "ready";
  const inRange = useMemo(() => data.recs.filter((r) => r.date >= range[0] && r.date <= range[1] && r.date <= t), [data.recs, range[0], range[1]]);
  const sums = useMemo(() => summarizeClients(inRange, clients).sort((a, b) => a.nome.localeCompare(b.nome)), [inRange, clients]);
  const total = countRecs(inRange);
  const periodLabel = period === "7d" ? "Últimos 7 dias" : period === "30d" ? "Últimos 30 dias" : monthLabelOf(period);
  const reinc = useMemo(() => [...groupCount(inRange.filter(isAbsence), (r) => r.empId).values()].filter((e) => e.n >= minFaltas)
    .map((e) => ({ ...e, sem: e.recs.filter((r) => r.cob === "sem").length, last: e.recs.map((r) => r.date).sort().pop() })).sort((a, b) => b.n - a.n || b.sem - a.sem), [inRange, minFaltas]);
  const bkChart = useMemo(() => ({
    labels: sums.map((s) => s.nome),
    datasets: [
      { label: "Backup interno", data: sums.map((s) => s.c.cInt), backgroundColor: "#0d9488", borderRadius: 4 },
      { label: "Backup externo", data: sums.map((s) => s.c.cExt), backgroundColor: "#f59e0b", borderRadius: 4 },
      { label: "Sem reposição", data: sums.map((s) => s.c.semW), backgroundColor: "#ef4444", borderRadius: 4 },
    ],
  }), [sums]);
  const evo = (cid) => {
    const m6 = monthWindow(evoEnd, 6);
    return { labels: m6.map(monthShort), datasets: [{ label: "Presença %", data: m6.map((mk) => { if (!data.monthHasData[mk]) return null; const c = countRecs(data.recs.filter((r) => r.mk === mk && (r.clientId || "_none") === cid && r.date <= t)); return presencaPct(c); }), borderColor: "#4361ee", backgroundColor: "rgba(67,97,238,.12)", fill: true, tension: 0.3, pointRadius: 3, spanGaps: false }] };
  };
  const evoOpts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { suggestedMin: 90, max: 100, ticks: { callback: (v) => v + "%" } }, x: { grid: { display: false } } } };

  return (
    <div className="page fade-in">
      <PageHeader eyebrow="Direção" title="Análises" subtitle={`Presença, faltas e backups por cliente · ${periodLabel}`}
        right={<select value={period} onChange={(e) => setPeriod(e.target.value)} className="input w-auto">
          <optgroup label="Período"><option value="7d">Últimos 7 dias</option><option value="30d">Últimos 30 dias</option></optgroup>
          <optgroup label="Mês">{[...ops.monthOptions].reverse().map((mk) => <option key={mk} value={mk}>{monthLabelOf(mk)}</option>)}</optgroup>
        </select>} />
      {!ready ? <StateBox status={data.status} error={data.error} onRetry={data.reload} /> : (
        <>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
            <Kpi label="Presença" value={fmtPct(presencaPct(total))} sub="todos os clientes do software" tone={presTone(total)} />
            <Kpi label="Faltas" value={totalAusencias(total)} sub={`${postosOf(total)} postos previstos`} />
            <Kpi label="Backups enviados" value={totalRepostas(total)} sub={`${total.cInt} interno · ${total.cExt} externo`} tone="#0f766e" />
            <Kpi label="Sem reposição" value={fmtNum(total.semW)} sub="faltas que baixaram a presença" tone={total.sem ? "#b91c1c" : "#15803d"} />
          </div>

          <Card title="Por cliente" className="mb-5" right={<span className="text-[11px] text-[var(--text-secondary)]">Clique num cliente para ver lojas, faltas e evolução</span>}>
            {sums.length === 0 ? <EmptyState title="Sem registos no período" /> : (
              <div className="overflow-x-auto -mx-1"><table className="tbl min-w-[760px]">
                <thead><tr><th>Cliente</th><th className="num">Presença</th><th className="num">Postos</th><th className="num">Faltas</th><th className="num">Com backup interno</th><th className="num">Com backup externo</th><th className="num">Sem reposição</th></tr></thead>
                <tbody>{sums.map((s) => (
                  <React.Fragment key={s.id}>
                    <tr className={`clickable ${open === s.id ? "sel" : ""}`} onClick={() => setOpen(open === s.id ? null : s.id)}>
                      <td><span className="inline-flex items-center gap-2 font-bold"><span style={{ display: "inline-flex", transform: open === s.id ? "none" : "rotate(-90deg)" }}><Icon path={ICONS.chevronDown} size={13} /></span><span className="w-2 h-2 rounded-full" style={{ background: s.cor }} />{s.nome}</span></td>
                      <td className="num font-extrabold" style={{ color: presTone(s.c) }}>{fmtPct(presencaPct(s.c))}</td>
                      <td className="num">{postosOf(s.c)}</td><td className="num">{totalAusencias(s.c)}</td>
                      <td className="num">{s.c.cInt}</td><td className="num">{s.c.cExt}</td>
                      <td className="num" style={s.c.sem ? { color: "#b91c1c", fontWeight: 800 } : {}}>{fmtNum(s.c.semW)}</td>
                    </tr>
                    {open === s.id && (
                      <tr><td colSpan={7} className="bg-[var(--hover)]">
                        <div className="grid lg:grid-cols-2 gap-5 py-2">
                          <div>
                            <div className="section-label">Lojas</div>
                            <table className="tbl"><thead><tr><th>Loja</th><th className="num">Presença</th><th className="num">Faltas</th><th className="num">Backups</th><th className="num">Sem rep.</th></tr></thead>
                              <tbody>{s.stores.map((x) => <tr key={x.id}><td className="font-semibold">{x.nome}</td><td className="num font-bold" style={{ color: presTone(x.c) }}>{fmtPct(presencaPct(x.c))}</td><td className="num">{totalAusencias(x.c)}</td><td className="num">{totalRepostas(x.c)}</td><td className="num" style={x.c.sem ? { color: "#b91c1c", fontWeight: 700 } : {}}>{fmtNum(x.c.semW)}</td></tr>)}</tbody></table>
                          </div>
                          <div>
                            <div className="section-label">Presença mensal (6 meses)</div>
                            <ChartCanvas type="line" data={evo(s.id)} options={evoOpts} height={180} />
                          </div>
                        </div>
                        <div className="section-label mt-3">Faltas no período ({s.abs.length})</div>
                        <OccurrenceTable items={s.abs} maxH={280} />
                      </td></tr>
                    )}
                  </React.Fragment>
                ))}</tbody>
              </table></div>
            )}
          </Card>

          <div className="grid xl:grid-cols-2 gap-5">
            <Card title="Motoristas com reincidência" right={<label className="flex items-center gap-2 text-[11px] text-[var(--text-secondary)]">Mínimo de faltas<select value={minFaltas} onChange={(e) => setMinFaltas(Number(e.target.value))} className="input input-xs w-14">{[2, 3, 4, 5].map((n) => <option key={n} value={n}>{n}</option>)}</select></label>}>
              {reinc.length === 0 ? <EmptyState icon={ICONS.check} title="Ninguém acima do mínimo" text={`Nenhum motorista com ${minFaltas} ou mais faltas no período.`} /> : (
                <div className="overflow-x-auto -mx-1"><table className="tbl min-w-[520px]">
                  <thead><tr><th>Motorista</th><th>Cliente · Loja</th><th className="num">Faltas</th><th className="num">Sem rep.</th><th>Datas</th></tr></thead>
                  <tbody>{reinc.map((e) => (
                    <tr key={e.k} className="clickable" onClick={() => ops.openEmployee(e.k)}>
                      <td className="font-semibold">{e.recs[0].emp}</td>
                      <td className="text-xs text-[var(--text-secondary)]">{e.recs[0].client} · {e.recs[0].store}</td>
                      <td className="num font-extrabold">{e.n}</td>
                      <td className="num" style={e.sem ? { color: "#b91c1c", fontWeight: 700 } : {}}>{e.sem}</td>
                      <td className="text-xs">{listDates(e.recs)}</td>
                    </tr>
                  ))}</tbody>
                </table></div>
              )}
            </Card>
            <Card title="Backups enviados por cliente">
              {sums.length === 0 ? <EmptyState title="Sem dados" /> : <ChartCanvas type="bar" data={bkChart} options={barStackOpts} height={Math.max(220, sums.length * 34)} />}
              <p className="text-[11px] text-[var(--text-secondary)] mt-2">Cada falta reposta conta como um backup enviado (interno inclui colaboradores de backup enviados nesse dia para a loja).</p>
            </Card>
          </div>
        </>
      )}
    </div>
  );
}

/* ====================================================================== */
/* CLIENTES                                                                */
/* ====================================================================== */
function ClientModal({ client, onClose, onSave }) {
  const [form, setForm] = useState(client ? { ativo: true, ...client } : { nome: "", cor: CLIENT_COLORS[0], ativo: true });
  const set = (k, v) => setForm((prev) => ({ ...prev, [k]: v }));
  const submit = (e) => { e.preventDefault(); if (!form.nome.trim()) return; onSave({ ...form, nome: form.nome.trim() }); };
  return (
    <Modal title={client ? "Editar Cliente" : "Novo Cliente"} onClose={onClose} width="max-w-sm">
      <form onSubmit={submit}>
        <Field label="Nome"><input required autoFocus className={inputCls} placeholder="Ex: DHL, GLS, CTT..." value={form.nome} onChange={(e) => set("nome", e.target.value)} /></Field>
        <Field label="Cor">
          <div className="flex flex-wrap gap-2">
            {CLIENT_COLORS.map((c) => <button type="button" key={c} onClick={() => set("cor", c)} className="w-7 h-7 rounded-full border-2" style={{ background: c, borderColor: form.cor === c ? "var(--text-primary)" : "transparent" }} aria-label={c}></button>)}
          </div>
        </Field>
        <Field label="Estado">
          <label className="flex items-start gap-2.5 p-3 rounded-lg border border-[var(--border-c)] cursor-pointer">
            <input type="checkbox" className="mt-0.5" checked={form.ativo !== false} onChange={(e) => set("ativo", e.target.checked)} />
            <span><span className="block text-sm font-semibold">Cliente ativo</span><span className="block text-xs text-[var(--text-secondary)] mt-0.5">Clientes inativos saem do Registo Diário, do Centro de Comando e dos alertas. O histórico não é apagado e continua nas análises e relatórios.</span></span>
          </label>
        </Field>
        <div className="flex justify-end gap-2 mt-2">
          <button type="button" onClick={onClose} className="btn btn-ghost">Cancelar</button>
          <button type="submit" className="btn btn-primary">Guardar</button>
        </div>
      </form>
    </Modal>
  );
}

function ClientsHubView({ params }) {
  const ops = useOps();
  const [tab, setTab] = useState((params && params.tab) || "clientes");
  const tabs = <div className="px-4 md:px-8 pt-6 md:pt-8"><Seg value={tab} onChange={setTab} options={[["clientes", "Clientes"], ["lojas", "Lojas"], ["colaboradores", "Colaboradores"]]} /></div>;
  if (tab === "lojas") return <div className="embedded">{tabs}<StoresView stores={ops.stores} employees={ops.employees} clients={ops.clients} hideTabs /></div>;
  if (tab === "colaboradores") return <div className="embedded">{tabs}<EmployeesView /></div>;
  return <div className="embedded">{tabs}<ClientsPane params={params} /></div>;
}
function ClientsPane({ params }) {
  const ops = useOps();
  const { stores, employees, clients } = ops;
  const [mk, setMk] = useState(ops.monthOptions[ops.monthOptions.length - 1]);
  const [q, setQ] = useState("");
  const [showInactive, setShowInactive] = useState(true);
  const [sel, setSel] = useState((params && params.clientId) || null);
  const [modal, setModal] = useState(null);
  const [deleting, setDeleting] = useState(null);
  useEffect(() => { if (params && params.clientId) setSel(params.clientId); }, [params]);
  const months = useMemo(() => monthWindow(mk, 3), [mk]);
  const data = useOpsData({ months, stores, employees, clients, getScheduleForMonth: ops.getScheduleForMonth, enabled: ops.refsReady });
  const t = todayISO();
  const cards = useMemo(() => clients.filter((c) => (showInactive || c.ativo !== false) && (!q || normTxt(c.nome).includes(normTxt(q)))).map((c) => {
    const cs = stores.filter((s) => s.clienteId === c.id);
    const ids = new Set(cs.map((s) => s.id));
    const emps = employees.filter((e) => ids.has(e.lojaId) && empActiveOn(e, t));
    const cur = countRecs(data.recs.filter((r) => r.clientId === c.id && r.mk === mk));
    const prv = countRecs(data.recs.filter((r) => r.clientId === c.id && r.mk === shiftMonth(mk, -1)));
    const al = ops.alerts.filter((a) => (a.clientIds || []).includes(c.id));
    return { c, cs, emps, cur, prv, al };
  }).sort((a, b) => (a.c.ativo === false) - (b.c.ativo === false) || a.c.nome.localeCompare(b.c.nome)), [clients, stores, employees, data.recs, mk, q, showInactive, ops.alerts]);

  const save = async (form) => {
    const dup = clients.find((c) => c.id !== form.id && normTxt(c.nome) === normTxt(form.nome));
    if (dup) { ops.toast("error", `Já existe um cliente chamado “${dup.nome}”.`); return; }
    try {
      if (form.id) await col("clients").doc(form.id).set(form, { merge: true });
      else await col("clients").add({ ...form, criadoEm: Date.now() });
      logHistory(form.id ? "Editou" : "Criou", "Cliente", form.nome, form.ativo === false ? "Inativo" : "Ativo");
      ops.toast("success", `Cliente “${form.nome}” guardado.`);
      setModal(null);
    } catch (e) { ops.toast("error", friendlyErr(e, "guardar o cliente")); }
  };
  const toggleActive = async (c) => {
    const ativo = c.ativo === false;
    await col("clients").doc(c.id).set({ ativo }, { merge: true });
    logHistory("Editou", "Cliente", c.nome, ativo ? "Reativado" : "Desativado (histórico preservado)");
    ops.toast("success", `${c.nome} ${ativo ? "reativado" : "desativado — histórico preservado"}.`);
  };
  const tryDelete = (c) => {
    const n = stores.filter((s) => s.clienteId === c.id).length;
    if (n > 0) { ops.toast("error", `${c.nome} tem ${n} loja(s) associada(s). Para preservar o histórico, desativa o cliente em vez de o eliminar.`); return; }
    setDeleting(c);
  };
  const remove = async (c) => { await col("clients").doc(c.id).delete(); logHistory("Eliminou", "Cliente", c.nome, ""); setDeleting(null); setSel(null); };
  const selC = clients.find((c) => c.id === sel);

  return (
    <div className="page fade-in">
      <PageHeader title="Clientes" subtitle={`${clients.filter((c) => c.ativo !== false).length} ativos · ${clients.filter((c) => c.ativo === false).length} inativos`}
        right={<>
          <select value={mk} onChange={(e) => setMk(e.target.value)} className="input w-auto">{[...ops.monthOptions].reverse().map((m) => <option key={m} value={m}>{monthLabelOf(m)}</option>)}</select>
          <button onClick={() => setModal({})} className="btn btn-primary"><Icon path={ICONS.plus} size={15} />Novo cliente</button>
        </>} />
      <div className="toolbar mb-4">
        <div className="relative flex-1 min-w-[200px]"><Icon path={ICONS.search} size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]" /><input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Pesquisar cliente…" className="input pl-9" /></div>
        <label className="flex items-center gap-2 text-xs font-semibold text-[var(--text-secondary)] cursor-pointer"><input type="checkbox" checked={showInactive} onChange={(e) => setShowInactive(e.target.checked)} />Mostrar inativos</label>
      </div>
      {data.status === "loading" ? <Skeleton rows={3} /> : cards.length === 0 ? <div className="card"><EmptyState title="Sem clientes" text="Cria o primeiro cliente para associar lojas e colaboradores." action={<button onClick={() => setModal({})} className="btn btn-primary"><Icon path={ICONS.plus} size={15} />Novo cliente</button>} /></div> : (
        <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
          {cards.map(({ c, cs, emps, cur, prv, al }) => {
            const b = postosOf(cur), pres = presencaPct(cur);
            const d = cur.semW - prv.semW;
            const hasPrev = !!data.monthHasData[shiftMonth(mk, -1)];
            return (
              <button key={c.id} onClick={() => setSel(c.id)} className={`card card-hover text-left overflow-hidden ${c.ativo === false ? "opacity-70" : ""}`}>
                <div className="h-1" style={{ background: c.cor }} />
                <div className="p-5">
                  <div className="flex items-start justify-between gap-2 mb-4">
                    <div className="min-w-0"><div className="font-extrabold truncate">{c.nome}</div><div className="text-[11px] text-[var(--text-secondary)]">{cs.length} loja(s) · {emps.length} colaborador(es) ativo(s)</div></div>
                    <div className="flex flex-col items-end gap-1">
                      {c.ativo === false ? <span className="tag">Inativo</span> : <span className="tag tag-green">Ativo</span>}
                      {al.length > 0 && <span className="tag" style={{ color: PRIO[al[0].sev].color, background: PRIO[al[0].sev].color + "14" }}>{al.length} alerta(s)</span>}
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div className="mini"><span>Presença</span><b style={{ color: presTone(cur) }}>{pres === null ? "—" : fmtPct(pres)}</b><em>{b ? `${b} postos` : "sem dados"}</em></div>
                    <div className="mini"><span>Faltas</span><b>{totalAusencias(cur)}</b><em>{totalRepostas(cur)} com backup</em></div>
                    <div className="mini"><span>Sem rep.</span><b style={{ color: cur.sem ? "#b91c1c" : undefined }}>{fmtNum(cur.semW)}</b><em>{hasPrev ? (d === 0 ? "= mês ant." : <span style={{ color: d > 0 ? "#b91c1c" : "#15803d" }}>{d > 0 ? "▲" : "▼"}{fmtNum(Math.abs(d))} mês ant.</span>) : "—"}</em></div>
                  </div>
                </div>
              </button>
            );
          })}
        </div>
      )}
      {selC && <ClientDrawer client={selC} mk={mk} data={data} onClose={() => setSel(null)} onEdit={() => setModal(selC)} onToggle={() => toggleActive(selC)} onDelete={() => tryDelete(selC)} />}
      {modal && <ClientModal client={modal.id ? modal : null} onClose={() => setModal(null)} onSave={save} />}
      {deleting && <ConfirmDelete what={deleting.nome} onConfirm={() => remove(deleting)} onCancel={() => setDeleting(null)} />}
    </div>
  );
}

function ClientDrawer({ client, mk, data, onClose, onEdit, onToggle, onDelete }) {
  const ops = useOps();
  const cs = ops.stores.filter((s) => s.clienteId === client.id).sort((a, b) => a.nome.localeCompare(b.nome));
  const t = todayISO();
  const recs = data.recs.filter((r) => r.clientId === client.id);
  const months = [shiftMonth(mk, -2), shiftMonth(mk, -1), mk];
  const al = ops.alerts.filter((a) => (a.clientIds || []).includes(client.id));
  const occ = recs.filter((r) => r.mk === mk && isAbsence(r));
  return (
    <Drawer title={client.nome} subtitle={`${client.ativo === false ? "Inativo" : "Ativo"} · ${cs.length} loja(s)`} onClose={onClose}
      actions={<><button onClick={onEdit} className="btn btn-ghost btn-sm"><Icon path={ICONS.edit} size={13} />Editar</button><button onClick={onToggle} className="btn btn-ghost btn-sm"><Icon path={ICONS.power} size={13} />{client.ativo === false ? "Reativar" : "Desativar"}</button><button onClick={onDelete} className="icon-btn text-red-500" title="Eliminar"><Icon path={ICONS.trash} size={15} /></button></>}>
      <div className="flex gap-2 flex-wrap mb-5">
        <button onClick={() => { onClose(); ops.nav("report", { date: t, clientId: client.id }); }} className="btn btn-primary btn-sm"><Icon path={ICONS.layers} size={14} />Relatório de hoje</button>
        <button onClick={() => { onClose(); ops.nav("daily", { date: t, clientId: client.id }); }} className="btn btn-ghost btn-sm"><Icon path={ICONS.calendarCheck} size={14} />Registo de hoje</button>
        <button onClick={() => { onClose(); ops.nav("reports", { clientId: client.id }); }} className="btn btn-ghost btn-sm"><Icon path={ICONS.file} size={14} />Relatório do cliente</button>
      </div>
      <div className="section-label">Evolução (3 meses)</div>
      <div className="overflow-x-auto mb-6"><table className="tbl">
        <thead><tr><th>Mês</th><th className="num">Postos</th><th className="num">Presença</th><th className="num">Faltas</th><th className="num">Backup int.</th><th className="num">Backup ext.</th><th className="num">Sem rep.</th></tr></thead>
        <tbody>{months.map((m) => { const c = countRecs(recs.filter((r) => r.mk === m)); const b = postosOf(c); const has = data.monthHasData[m]; return (
          <tr key={m}><td className="font-semibold">{monthLabelOf(m)}</td>{has ? <><td className="num">{b}</td><td className="num font-bold" style={{ color: presTone(c) }}>{fmtPct(presencaPct(c))}</td><td className="num">{totalAusencias(c)}</td><td className="num">{c.cInt}</td><td className="num">{c.cExt}</td><td className="num" style={c.sem ? { color: "#b91c1c", fontWeight: 700 } : {}}>{fmtNum(c.semW)}</td></> : <td colSpan={6} className="text-center text-[var(--text-secondary)] text-xs">Sem dados na grelha</td>}</tr>
        ); })}</tbody></table></div>
      <div className="section-label">Lojas e colaboradores ativos</div>
      <div className="space-y-2 mb-6">
        {cs.length === 0 && <div className="text-xs text-[var(--text-secondary)]">Sem lojas associadas.</div>}
        {cs.map((s) => { const emps = ops.employees.filter((e) => e.lojaId === s.id && empActiveOn(e, t)).sort((a, b) => a.nome.localeCompare(b.nome)); const sc = countRecs(recs.filter((r) => r.storeId === s.id && r.mk === mk)); return (
          <details key={s.id} className="det">
            <summary><span className="w-2 h-2 rounded-full" style={{ background: s.cor }} /><span className="font-semibold">{s.nome}</span>{s.tipo === "backup_pool" && <span className="tag tag-blue">Pool</span>}<span className="ml-auto text-xs text-[var(--text-secondary)]">{emps.length} colab. · {fmtPct(presencaPct(sc))} · {totalAusencias(sc)} faltas · {fmtNum(sc.semW)} s/rep.</span></summary>
            <div className="flex flex-wrap gap-1.5 pt-2">{emps.map((e) => <button key={e.id} onClick={() => ops.openEmployee(e.id)} className="fchip">{e.nome}</button>)}{!emps.length && <span className="text-xs text-[var(--text-secondary)]">Sem colaboradores ativos.</span>}</div>
          </details>
        ); })}
      </div>
      {al.length > 0 && <><div className="section-label">Alertas ({al.length})</div><div className="space-y-2 mb-6">{al.slice(0, 6).map((a) => <AlertMini key={a.key} a={a} unread={ops.isUnread(a)} onOpen={() => { onClose(); ops.nav("alerts", { focus: a.key }); }} />)}</div></>}
      <div className="section-label">Faltas · {monthLabelOf(mk)} ({occ.length})</div>
      <OccurrenceTable items={occ} />
    </Drawer>
  );
}
