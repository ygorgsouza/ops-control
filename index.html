const ALERT_CFG_DEFAULT = {
  motSem: 2,        // faltas do mesmo motorista na mesma semana
  motMes: 3,        // faltas do mesmo motorista no mês
  motSemanasMes: 3, // semanas distintas do mês com falta do mesmo motorista
  repSem: 3,        // faltas na mesma loja na semana
  repCliSem: 5,     // faltas no mesmo cliente na semana
  repMes: 6,        // faltas na mesma loja no mês
  repCliMes: 10,    // faltas no mesmo cliente no mês
  aumPct: 50,       // % mínimo de aumento face ao período anterior (loja/cliente)
  aumMin: 2,        // aumento mínimo absoluto (nº de faltas)
  semMult: 1.5,     // semana/mês acima do habitual = média anterior × este fator
  semMin: 3,        // mínimo de faltas numa semana para alertar "acima do habitual"
  mesMin: 6,        // mínimo de faltas num mês para alertar "acima do habitual"
  abMin: 1,         // abandonos mínimos para alertar aumento
  semBkpSem: 2,     // faltas sem backup na mesma loja na semana
  semBkpMes: 4,     // faltas sem backup na mesma loja no mês
};
const ALERT_CFG_LABELS = {
  motSem: "Motorista: faltas na semana ≥", motMes: "Motorista: faltas no mês ≥", motSemanasMes: "Motorista: semanas com falta no mês ≥",
  repSem: "Loja: faltas na semana ≥", repCliSem: "Cliente: faltas na semana ≥", repMes: "Loja: faltas no mês ≥", repCliMes: "Cliente: faltas no mês ≥",
  aumPct: "Aumento vs período anterior (%) ≥", aumMin: "Aumento vs período anterior (nº) ≥",
  semMult: "Acima do habitual: fator × média anterior", semMin: "Semana: mínimo de faltas", mesMin: "Mês: mínimo de faltas",
  abMin: "Abandonos: mínimo para alertar", semBkpSem: "Loja: faltas sem backup na semana ≥", semBkpMes: "Loja: faltas sem backup no mês ≥",
};

function groupCount(recs, keyFn) {
  const m = new Map();
  recs.forEach((r) => { const k = keyFn(r); if (k === "" || k === undefined) return; let e = m.get(k); if (!e) { e = { k, n: 0, recs: [] }; m.set(k, e); } e.n++; e.recs.push(r); });
  return m;
}

// Alertas semanais e mensais calculados apenas com registos reais (nada estimado).
function computeAlerts(abs, periodMonths, loadMonths, monthHasData, cfg) {
  const alerts = [];
  const push = (a) => alerts.push(a);
  const sev = (val, thr) => (val >= thr * 2 ? "alta" : "média");
  const loadedFrom = `${loadMonths[0]}-01`;
  const lastLoaded = loadMonths[loadMonths.length - 1];
  const [ly, lm] = lastLoaded.split("-").map(Number);
  const loadedTo = isoDate(ly, lm - 1, daysInMonth(ly, lm - 1));
  const byWk = new Map();
  abs.forEach((r) => { let a = byWk.get(r.wk); if (!a) { a = []; byWk.set(r.wk, a); } a.push(r); });
  const wkComplete = (wk) => {
    if (wk < loadedFrom) return false;
    const end = dateKey(addDays(parseISO(wk), 6));
    if (end > loadedTo) return false;
    // só conta semanas cujos meses têm dados na grelha (evita "zeros" fictícios em meses vazios)
    return !!monthHasData[wk.slice(0, 7)] && !!monthHasData[end.slice(0, 7)];
  };
  const wkRecs = (wk) => byWk.get(wk) || [];
  const prevWk = (wk) => dateKey(addDays(parseISO(wk), -7));
  const fmtF = (n) => (Math.round(n * 10) / 10).toString().replace(".", ",");

  // ---------- SEMANAIS ----------
  const periodWeeks = new Set();
  periodMonths.forEach((mk) => weeksOfMonth(mk).forEach((w) => periodWeeks.add(w.wk)));
  [...periodWeeks].sort().forEach((wk) => {
    const rs = wkRecs(wk);
    if (!rs.length) return;
    const per = `Semana ${weekRangeLabel(wk)}${wkComplete(wk) ? "" : " (dados incompletos)"}`;
    const base = { scope: "Semanal", period: per, sortKey: wk };
    // Semana acima do habitual
    const prevCounts = [1, 2, 3, 4].map((i) => dateKey(addDays(parseISO(wk), -7 * i))).filter(wkComplete).map((k) => wkRecs(k).length);
    if (prevCounts.length >= 2) {
      const avg = prevCounts.reduce((a, b) => a + b, 0) / prevCounts.length;
      if (rs.length >= cfg.semMin && rs.length >= avg * cfg.semMult && rs.length > avg) {
        push({ ...base, kind: "Semana acima do habitual", sev: sev(rs.length, Math.max(1, avg * cfg.semMult)), title: `${rs.length} faltas na semana`, detail: `Média das ${prevCounts.length} semanas anteriores: ${fmtF(avg)} (limite: ×${cfg.semMult}, mín. ${cfg.semMin}).`, recs: rs });
      }
    }
    // Motoristas recorrentes na semana
    groupCount(rs, (r) => r.empId).forEach((e) => {
      if (e.n >= cfg.motSem) push({ ...base, kind: "Motorista com faltas recorrentes", sev: sev(e.n, cfg.motSem), title: `${e.recs[0].emp} · ${e.n} faltas`, detail: `Dias: ${[...new Set(e.recs.map((r) => pad2(r.day)))].sort().join(", ")} · ${e.recs[0].store}.`, recs: e.recs });
    });
    // Repetição na mesma loja / cliente
    groupCount(rs, (r) => r.storeId).forEach((e) => {
      if (e.n >= cfg.repSem) push({ ...base, kind: "Repetição na mesma loja", sev: sev(e.n, cfg.repSem), title: `${e.recs[0].store} · ${e.n} faltas`, detail: `Cliente: ${e.recs[0].client}.`, recs: e.recs });
    });
    groupCount(rs, (r) => r.clientId).forEach((e) => {
      if (e.n >= cfg.repCliSem) push({ ...base, kind: "Repetição no mesmo cliente", sev: sev(e.n, cfg.repCliSem), title: `${e.recs[0].client} · ${e.n} faltas`, detail: "Total do cliente na semana (todas as lojas).", recs: e.recs });
    });
    // Sem backup
    groupCount(rs.filter((r) => r.cob === "sem"), (r) => r.storeId).forEach((e) => {
      if (e.n >= cfg.semBkpSem) push({ ...base, kind: "Ocorrências sem backup", sev: sev(e.n, cfg.semBkpSem), title: `${e.recs[0].store} · ${e.n} faltas sem backup`, detail: `Cliente: ${e.recs[0].client}.`, recs: e.recs });
    });
    // Aumentos vs semana anterior (só se a semana anterior estiver completa nos dados)
    const pk = prevWk(wk);
    if (wkComplete(pk)) {
      const pr = wkRecs(pk);
      [["storeId", "store", "Aumento de faltas na loja"], ["clientId", "client", "Aumento de faltas no cliente"]].forEach(([idK, nameK, kind]) => {
        const prevMap = groupCount(pr, (r) => r[idK]);
        groupCount(rs, (r) => r[idK]).forEach((e) => {
          const p = prevMap.get(e.k) ? prevMap.get(e.k).n : 0;
          if (e.n - p >= cfg.aumMin && e.n >= p * (1 + cfg.aumPct / 100)) push({ ...base, kind, sev: sev(e.n - p, cfg.aumMin), title: `${e.recs[0][nameK]} · ${p} → ${e.n} faltas`, detail: `Semana anterior (${weekRangeLabel(pk)}): ${p}.`, recs: e.recs });
        });
      });
      const ab = rs.filter((r) => r.st === "Abandono"), abp = pr.filter((r) => r.st === "Abandono").length;
      if (ab.length >= cfg.abMin && ab.length > abp) push({ ...base, kind: "Aumento de abandonos", sev: sev(ab.length, Math.max(1, cfg.abMin)), title: `${ab.length} abandono(s) · antes ${abp}`, detail: `Semana anterior: ${abp}.`, recs: ab });
    }
  });

  // ---------- MENSAIS ----------
  periodMonths.forEach((mk) => {
    if (!monthHasData[mk]) return;
    const rs = abs.filter((r) => r.mk === mk);
    if (!rs.length) return;
    const base = { scope: "Mensal", period: monthLabelOf(mk), sortKey: mk };
    const pmk = shiftMonth(mk, -1);
    const prevOk = loadMonths.includes(pmk) && monthHasData[pmk];
    const pr = prevOk ? abs.filter((r) => r.mk === pmk) : [];
    // Mês acima do habitual
    const prevTot = [1, 2, 3].map((i) => shiftMonth(mk, -i)).filter((k) => loadMonths.includes(k) && monthHasData[k]).map((k) => abs.filter((r) => r.mk === k).length);
    if (prevTot.length >= 1) {
      const avg = prevTot.reduce((a, b) => a + b, 0) / prevTot.length;
      if (rs.length >= cfg.mesMin && rs.length >= avg * cfg.semMult && rs.length > avg) {
        push({ ...base, kind: "Mês acima do habitual", sev: sev(rs.length, Math.max(1, avg * cfg.semMult)), title: `${rs.length} faltas no mês`, detail: `Média dos ${prevTot.length} mês(es) anterior(es) com dados: ${fmtF(avg)} (limite: ×${cfg.semMult}, mín. ${cfg.mesMin}).`, recs: rs });
      }
    }
    // Motoristas
    groupCount(rs, (r) => r.empId).forEach((e) => {
      const nWk = new Set(e.recs.map((r) => r.wk)).size;
      if (e.n >= cfg.motMes) push({ ...base, kind: "Motorista com faltas recorrentes", sev: sev(e.n, cfg.motMes), title: `${e.recs[0].emp} · ${e.n} faltas no mês`, detail: `Em ${nWk} semana(s) distinta(s) · ${e.recs[0].store}.`, recs: e.recs });
      else if (nWk >= cfg.motSemanasMes) push({ ...base, kind: "Motorista com faltas recorrentes", sev: "média", title: `${e.recs[0].emp} · faltas em ${nWk} semanas`, detail: `${e.n} faltas · ${e.recs[0].store}.`, recs: e.recs });
    });
    // Repetição
    groupCount(rs, (r) => r.storeId).forEach((e) => {
      if (e.n >= cfg.repMes) push({ ...base, kind: "Repetição na mesma loja", sev: sev(e.n, cfg.repMes), title: `${e.recs[0].store} · ${e.n} faltas`, detail: `Cliente: ${e.recs[0].client}.`, recs: e.recs });
    });
    groupCount(rs, (r) => r.clientId).forEach((e) => {
      if (e.n >= cfg.repCliMes) push({ ...base, kind: "Repetição no mesmo cliente", sev: sev(e.n, cfg.repCliMes), title: `${e.recs[0].client} · ${e.n} faltas`, detail: "Total do cliente no mês (todas as lojas).", recs: e.recs });
    });
    // Sem backup
    groupCount(rs.filter((r) => r.cob === "sem"), (r) => r.storeId).forEach((e) => {
      if (e.n >= cfg.semBkpMes) push({ ...base, kind: "Ocorrências sem backup", sev: sev(e.n, cfg.semBkpMes), title: `${e.recs[0].store} · ${e.n} faltas sem backup`, detail: `Cliente: ${e.recs[0].client}.`, recs: e.recs });
    });
    // Aumentos vs mês anterior
    if (prevOk) {
      [["storeId", "store", "Aumento de faltas na loja"], ["clientId", "client", "Aumento de faltas no cliente"]].forEach(([idK, nameK, kind]) => {
        const prevMap = groupCount(pr, (r) => r[idK]);
        groupCount(rs, (r) => r[idK]).forEach((e) => {
          const p = prevMap.get(e.k) ? prevMap.get(e.k).n : 0;
          if (e.n - p >= cfg.aumMin && e.n >= p * (1 + cfg.aumPct / 100)) push({ ...base, kind, sev: sev(e.n - p, cfg.aumMin), title: `${e.recs[0][nameK]} · ${p} → ${e.n} faltas`, detail: `Mês anterior (${monthLabelOf(pmk)}): ${p}.`, recs: e.recs });
        });
      });
      const ab = rs.filter((r) => r.st === "Abandono"), abp = pr.filter((r) => r.st === "Abandono").length;
      if (ab.length >= cfg.abMin && ab.length > abp) push({ ...base, kind: "Aumento de abandonos", sev: sev(ab.length, Math.max(1, cfg.abMin)), title: `${ab.length} abandono(s) · antes ${abp}`, detail: `Mês anterior: ${abp}.`, recs: ab });
    }
  });
  return alerts.map((a, i) => ({ ...a, id: i }));
}

function AlertsPanel({ alerts, cfg, setCfg, periodLabel }) {
  const [openId, setOpenId] = useState(null);
  const [showAll, setShowAll] = useState({});
  const [showCfg, setShowCfg] = useState(false);
  const sevColor = { alta: "#ef4444", "média": "#f59e0b" };
  const groups = ["Semanal", "Mensal"].map((sc) => ({
    scope: sc,
    items: alerts.filter((a) => a.scope === sc).sort((a, b) => b.sortKey.localeCompare(a.sortKey) || (a.sev === b.sev ? 0 : a.sev === "alta" ? -1 : 1) || b.recs.length - a.recs.length),
  }));
  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
        <p className="text-xs text-gray-400 max-w-2xl">Alertas calculados automaticamente com os registos da grelha e dos backups para {periodLabel}. Os limites são critérios configuráveis (não são dados registados) e as comparações usam apenas períodos com dados.</p>
        <button onClick={() => setShowCfg((v) => !v)} className="px-3 py-1.5 rounded-lg text-sm font-semibold border border-[var(--border-c)] bg-white">{showCfg ? "Ocultar critérios" : "Critérios de alerta"}</button>
      </div>
      {showCfg && (
        <Card title="Critérios de alerta (configuráveis)" className="mb-5" right={<button onClick={() => setCfg({ ...ALERT_CFG_DEFAULT })} className="text-xs font-semibold text-[var(--accent)]">Repor valores por defeito</button>}>
          <div className="grid sm:grid-cols-2 xl:grid-cols-3 gap-x-5 gap-y-3">
            {Object.keys(ALERT_CFG_DEFAULT).map((k) => (
              <label key={k} className="flex items-center justify-between gap-3 text-xs text-gray-500">
                <span>{ALERT_CFG_LABELS[k]}</span>
                <input type="number" min="0" step={k === "semMult" ? "0.1" : "1"} value={cfg[k]} onChange={(e) => { const n = Number(e.target.value); setCfg({ ...cfg, [k]: Number.isFinite(n) ? n : ALERT_CFG_DEFAULT[k] }); }} className="w-20 px-2 py-1 rounded-lg border border-[var(--border-c)] text-sm text-right bg-white" />
              </label>
            ))}
          </div>
        </Card>
      )}
      <div className="grid lg:grid-cols-2 gap-5 items-start">
        {groups.map((g) => {
          const shown = showAll[g.scope] ? g.items : g.items.slice(0, 25);
          return (
            <Card key={g.scope} title={`Alertas ${g.scope === "Semanal" ? "semanais" : "mensais"}`} right={<span className="text-[11px] text-gray-400">{g.items.length} alerta(s) · {g.items.filter((a) => a.sev === "alta").length} de gravidade alta</span>}>
              {g.items.length === 0 ? <div className="text-sm text-gray-400 py-6 text-center">Sem alertas com os critérios atuais.</div> : (
                <div className="space-y-2">
                  {shown.map((a) => (
                    <div key={a.id} className="rounded-xl border border-[var(--border-c)] overflow-hidden" style={{ borderLeft: `4px solid ${sevColor[a.sev]}` }}>
                      <button onClick={() => setOpenId(openId === a.id ? null : a.id)} className="w-full text-left px-3 py-2.5 hover:bg-gray-50">
                        <div className="flex items-center gap-2 flex-wrap mb-1">
                          <Pill color={sevColor[a.sev]}>{a.sev === "alta" ? "Alta" : "Média"}</Pill>
                          <span className="text-[11px] font-bold text-gray-500">{a.kind}</span>
                          <span className="text-[11px] text-gray-400 ml-auto">{a.period}</span>
                        </div>
                        <div className="text-sm font-bold break-words">{a.title}</div>
                        <div className="text-xs text-gray-400 break-words">{a.detail}</div>
                      </button>
                      {openId === a.id && <div className="px-3 pb-3"><OccurrenceTable items={a.recs} maxH={240} /></div>}
                    </div>
                  ))}
                  {g.items.length > 25 && (
                    <button onClick={() => setShowAll((p) => ({ ...p, [g.scope]: !p[g.scope] }))} className="w-full py-2 text-xs font-semibold text-[var(--accent)]">{showAll[g.scope] ? "Mostrar menos" : `Mostrar todos (${g.items.length})`}</button>
                  )}
                </div>
              )}
            </Card>
          );
        })}
      </div>
    </div>
  );
}

function RankSection({ title, rows, selected, onSelect, showParent, emptyText }) {
  const top = rows.slice(0, 10);
  const chart = {
    labels: top.map((r) => r.nome),
    datasets: [
      { label: "Falta", data: top.map((r) => r.c.falta), backgroundColor: "#ef4444" },
      { label: "Meia Falta", data: top.map((r) => r.c.meia), backgroundColor: "#f59e0b" },
      { label: "Abandono", data: top.map((r) => r.c.abandono), backgroundColor: "#7f1d1d" },
    ],
  };
  const sel = rows.find((r) => r.id === selected);
  const td = "px-3 py-2 border-b border-[var(--border-c)] text-center tabular-nums";
  return (
    <Card title={title} className="mb-5">
      {rows.length === 0 ? <div className="text-sm text-gray-400 py-6 text-center">{emptyText}</div> : (
        <>
          <div className="mb-4"><ChartCanvas type="bar" data={chart} options={hBarStackOpts} height={Math.max(140, 60 + top.length * 30)} /></div>
          <div className="overflow-x-auto">
            <table className="w-full text-xs min-w-[820px]">
              <thead>
                <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
                  <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">#</th>
                  <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">{showParent ? "Loja" : "Cliente"}</th>
                  {showParent && <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Cliente</th>}
                  {["Faltas", "Meias", "Abandonos", "Total", "C/ Bkp Int.", "C/ Bkp Ext.", "Sem backup", "% sem bkp"].map((h) => <th key={h} className="px-3 py-2 border-b border-[var(--border-c)]">{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => {
                  const t = totalFaltas(r.c);
                  return (
                    <tr key={r.id} onClick={() => onSelect(selected === r.id ? null : r.id)} className={`cursor-pointer hover:bg-gray-50/60 ${selected === r.id ? "bg-gray-50" : ""}`}>
                      <td className="px-3 py-2 border-b border-[var(--border-c)] text-gray-400">{i + 1}</td>
                      <td className="px-3 py-2 border-b border-[var(--border-c)] font-bold">{r.nome}</td>
                      {showParent && <td className="px-3 py-2 border-b border-[var(--border-c)] text-gray-500">{r.parent}</td>}
                      <td className={td}>{r.c.falta}</td><td className={td}>{r.c.meia}</td><td className={td}>{r.c.abandono}</td>
                      <td className={td + " font-extrabold"}>{t}</td>
                      <td className={td} style={r.c.cInt > 0 ? { color: "#0d9488", fontWeight: 700 } : {}}>{r.c.cInt}</td>
                      <td className={td} style={r.c.cExt > 0 ? { color: "#d97706", fontWeight: 700 } : {}}>{r.c.cExt}</td>
                      <td className={td} style={r.c.sem > 0 ? { color: "#ef4444", fontWeight: 700 } : {}}>{r.c.sem}</td>
                      <td className={td}>{t > 0 ? `${Math.round((r.c.sem / t) * 100)}%` : "—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          {sel && (
            <div className="mt-4">
              <div className="flex items-center justify-between mb-2">
                <div className="text-sm font-bold">Ocorrências · {sel.nome} <span className="text-gray-400 font-normal">({sel.recs.length})</span></div>
                <button onClick={() => onSelect(null)} className="text-xs font-semibold text-gray-500">Fechar</button>
              </div>
              <OccurrenceTable items={sel.recs} />
            </div>
          )}
        </>
      )}
    </Card>
  );
}

function AnalysesView({ stores, employees, clients, getScheduleForMonth, monthOptions, refsReady, embedded }) {
  const lastMonth = monthOptions[monthOptions.length - 1];
  const [tab, setTab] = useState("motoristas");
  const [period, setPeriod] = useState(lastMonth);
  const [fWeek, setFWeek] = useState("");
  const [fCliente, setFCliente] = useState("");
  const [fLoja, setFLoja] = useState("");
  const [fEmp, setFEmp] = useState("");
  const [fTipo, setFTipo] = useState("");
  const [selEmp, setSelEmp] = useState(null);
  const [selCli, setSelCli] = useState(null);
  const [selLoja, setSelLoja] = useState(null);

  const periodMonths = useMemo(() => (period.startsWith("ult") ? monthWindow(lastMonth, Number(period.slice(3))) : [period]), [period, lastMonth]);
  // carrega também 3 meses anteriores ao período (base de comparação dos alertas / variações)
  const loadMonths = useMemo(() => [...new Set([...monthWindow(periodMonths[0], 4), ...periodMonths])].sort(), [periodMonths]);
  const data = useOpsData({ months: loadMonths, stores, employees, clients, getScheduleForMonth, enabled: refsReady });
  const loading = data.status === "loading";

  const abs = useMemo(() => data.recs.filter((r) => ABS_TYPES.includes(r.st)), [data.recs]);
  const scoped = useMemo(() => abs.filter((r) => (!fCliente || r.clientId === fCliente) && (!fLoja || r.storeId === fLoja) && (!fEmp || r.empId === fEmp)), [abs, fCliente, fLoja, fEmp]);
  const inPeriod = useMemo(() => {
    const set = new Set(periodMonths);
    return scoped.filter((r) => set.has(r.mk) && (!fWeek || r.wk === fWeek) && (!fTipo || r.st === fTipo));
  }, [scoped, periodMonths, fWeek, fTipo]);

  // Células de backup da grelha (interno / externo / pool) no mesmo âmbito -> contam como "faltas com backup"
  const BKP_ST = ["Backup Interno", "Backup Externo", "Pool"];
  const inPeriodBk = useMemo(() => {
    if (fTipo) return [];
    const set = new Set(periodMonths);
    return data.recs.filter((r) => BKP_ST.includes(r.st) && set.has(r.mk) && (!fWeek || r.wk === fWeek) && (!fCliente || r.clientId === fCliente) && (!fLoja || r.storeId === fLoja) && (!fEmp || r.empId === fEmp));
  }, [data.recs, periodMonths, fWeek, fTipo, fCliente, fLoja, fEmp]);

  const singleMonth = periodMonths.length === 1 ? periodMonths[0] : null;
  const weekOptions = useMemo(() => (singleMonth ? weeksOfMonth(singleMonth) : []), [singleMonth]);
  const storeOptions = useMemo(() => stores.filter((s) => !fCliente || s.clienteId === fCliente).sort((a, b) => a.nome.localeCompare(b.nome)), [stores, fCliente]);
  const empOptions = useMemo(() => [...employees].sort((a, b) => a.nome.localeCompare(b.nome)), [employees]);
  const periodLabel = period.startsWith("ult") ? `Últimos ${period.slice(3)} meses (${monthShort(periodMonths[0])} – ${monthShort(periodMonths[periodMonths.length - 1])})` : monthLabelOf(period);

  const onPeriod = (v) => { setPeriod(v); setFWeek(""); };
  const onCliente = (v) => { setFCliente(v); setFLoja(""); };

  // -------- 3.1 Motoristas --------
  const empRows = useMemo(() => {
    const map = new Map();
    inPeriod.forEach((r) => {
      let e = map.get(r.empId);
      if (!e) { e = { id: r.empId, nome: r.emp, store: r.store, client: r.client, c: emptyCounts(), weeks: new Set(), months: new Set(), last: "", recs: [] }; map.set(r.empId, e); }
      addRec(e.c, r); e.weeks.add(r.wk); e.months.add(r.mk); e.recs.push(r);
      if (r.date >= e.last) { e.last = r.date; e.store = r.store; e.client = r.client; }
    });
    return [...map.values()].sort((a, b) => totalFaltas(b.c) - totalFaltas(a.c) || a.nome.localeCompare(b.nome));
  }, [inPeriod]);
  const empChart = useMemo(() => {
    const top = empRows.slice(0, 10);
    return { labels: top.map((r) => r.nome), datasets: [
      { label: "Falta", data: top.map((r) => r.c.falta), backgroundColor: "#ef4444" },
      { label: "Meia Falta", data: top.map((r) => r.c.meia), backgroundColor: "#f59e0b" },
      { label: "Abandono", data: top.map((r) => r.c.abandono), backgroundColor: "#7f1d1d" },
    ] };
  }, [empRows]);
  const recurrence = useMemo(() => empRows.slice(0, 10).map((e) => ({ e, per: periodMonths.map((mk) => e.recs.filter((r) => r.mk === mk).length) })), [empRows, periodMonths]);
  const recMax = Math.max(1, ...recurrence.flatMap((r) => r.per));

  // Histórico individual: todos os meses carregados (ignora período/semana/tipo; respeita apenas o motorista)
  const histRecs = useMemo(() => (selEmp ? abs.filter((r) => r.empId === selEmp) : []), [abs, selEmp]);
  const histInfo = useMemo(() => {
    if (!selEmp) return null;
    const c = countRecs(histRecs);
    const byMonth = loadMonths.map((mk) => countRecs(histRecs.filter((r) => r.mk === mk)));
    const days = {};
    histRecs.forEach((r) => { (days[r.mk] = days[r.mk] || []).push(r.day); });
    const dow = [0, 0, 0, 0, 0, 0, 0];
    histRecs.forEach((r) => { dow[r.dow]++; });
    const weeks = [...new Set(histRecs.map((r) => r.wk))].sort();
    return { c, byMonth, days, dow, weeks };
  }, [histRecs, selEmp, loadMonths]);
  const selEmpName = selEmp ? (employees.find((e) => e.id === selEmp)?.nome || (histRecs[0] && histRecs[0].emp) || "—") : "";

  // -------- 3.2 Clientes / Lojas (rankings separados) --------
  const rankBy = (idFn, nameFn, parentFn) => {
    const map = new Map();
    inPeriod.concat(inPeriodBk).forEach((r) => {
      const id = idFn(r);
      let e = map.get(id);
      if (!e) { e = { id, nome: nameFn(r), parent: parentFn ? parentFn(r) : "", c: emptyCounts(), recs: [] }; map.set(id, e); }
      addRec(e.c, r); e.recs.push(r);
    });
    return [...map.values()].filter((e) => totalFaltas(e.c) > 0).sort((a, b) => totalFaltas(b.c) - totalFaltas(a.c) || a.nome.localeCompare(b.nome));
  };
  const cliRows = useMemo(() => rankBy((r) => r.clientId || "_none", (r) => r.client), [inPeriod, inPeriodBk]);
  const lojaRows = useMemo(() => rankBy((r) => r.storeId || "_none", (r) => r.store, (r) => r.client), [inPeriod, inPeriodBk]);


  const noData = !loading && data.status === "ready" && !periodMonths.some((mk) => data.monthHasData[mk]);
  const kpi = useMemo(() => countRecs(inPeriod), [inPeriod]);

  return (
    <div className={embedded ? "page pt-5 fade-in" : "page fade-in"}>
      {!embedded ? <PageHeader title="Análises" subtitle={`Recorrência de faltas e rankings de clientes e lojas · ${periodLabel}`} /> : <p className="text-sm text-[var(--text-secondary)] mb-4">Recorrência de faltas e rankings de clientes e lojas · {periodLabel}. Os alertas estão na Central de Alertas.</p>}

      <div className="flex flex-wrap items-center gap-2 mb-4">
        <select value={period} onChange={(e) => onPeriod(e.target.value)} className={filterSelCls} title="Período">
          <optgroup label="Mês">{[...monthOptions].reverse().map((mk) => <option key={mk} value={mk}>{monthLabelOf(mk)}</option>)}</optgroup>
          <optgroup label="Intervalo"><option value="ult3">Últimos 3 meses</option><option value="ult6">Últimos 6 meses</option><option value="ult12">Últimos 12 meses</option></optgroup>
        </select>
        <select value={fWeek} onChange={(e) => setFWeek(e.target.value)} disabled={!singleMonth} className={filterSelCls + (singleMonth ? "" : " opacity-50")} title="Semana (disponível quando o período é um único mês)">
          <option value="">Todas as semanas</option>
          {weekOptions.map((w) => <option key={w.wk} value={w.wk}>{w.label}</option>)}
        </select>
        <select value={fCliente} onChange={(e) => onCliente(e.target.value)} className={filterSelCls}>
          <option value="">Todos os Clientes</option>
          {clients.map((c) => <option key={c.id} value={c.id}>{c.nome}</option>)}
        </select>
        <select value={fLoja} onChange={(e) => setFLoja(e.target.value)} className={filterSelCls}>
          <option value="">Todas as Lojas</option>
          {storeOptions.map((s) => <option key={s.id} value={s.id}>{s.nome}</option>)}
        </select>
        <select value={fEmp} onChange={(e) => setFEmp(e.target.value)} className={filterSelCls}>
          <option value="">Todos os Motoristas</option>
          {empOptions.map((e) => <option key={e.id} value={e.id}>{e.nome}</option>)}
        </select>
        <select value={fTipo} onChange={(e) => setFTipo(e.target.value)} className={filterSelCls} title="Não afeta o cálculo dos alertas">
          <option value="">Todas as ocorrências</option>
          {ABS_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
        </select>
      </div>

      <div className="flex gap-1 bg-gray-100 rounded-lg p-1 w-fit max-w-full overflow-x-auto mb-5">
        {[["motoristas", "Motoristas"], ["clientes", "Clientes e Lojas"]].map(([k, l]) => (
          <button key={k} onClick={() => setTab(k)} className={`px-4 py-1.5 rounded-md text-sm font-semibold whitespace-nowrap ${tab === k ? "bg-white shadow text-[var(--text-primary)]" : "text-gray-500"}`}>{l}</button>
        ))}
      </div>

      {(loading || data.status === "error") && <StateBox status={data.status} error={data.error} onRetry={data.reload} />}
      {noData && <StateBox status="ready" empty emptyText={`Sem dados registados na grelha para ${periodLabel}.`} />}

      {!loading && data.status === "ready" && !noData && (
        <>
          {true && (
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
              <MiniStat label="Total de faltas" value={totalFaltas(kpi)} sub="Falta + Meia + Abandono" color="#ef4444" />
              <MiniStat label="Faltas completas" value={kpi.falta} color="#ef4444" />
              <MiniStat label="Meias faltas" value={kpi.meia} color="#f59e0b" />
              <MiniStat label="Abandonos" value={kpi.abandono} color="#b91c1c" />
            </div>
          )}

          {tab === "motoristas" && (
            <>
              <Card title="Motoristas com mais faltas" className="mb-5" right={<span className="text-[11px] text-gray-400">Top 10 · clique numa linha para o histórico</span>}>
                {empRows.length === 0 ? <div className="text-sm text-gray-400 py-6 text-center">Sem faltas para os filtros selecionados.</div> : (
                  <>
                    <div className="mb-4"><ChartCanvas type="bar" data={empChart} options={hBarStackOpts} height={Math.max(140, 60 + Math.min(10, empRows.length) * 30)} /></div>
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs min-w-[820px]">
                        <thead>
                          <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
                            <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">#</th>
                            <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Motorista</th>
                            <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Cliente · Loja (última ocorrência)</th>
                            {["Faltas", "Meias", "Abandonos", "Total", "Sem backup", "Semanas", "Meses", "Última"].map((h) => <th key={h} className="px-3 py-2 border-b border-[var(--border-c)]">{h}</th>)}
                          </tr>
                        </thead>
                        <tbody>
                          {empRows.map((r, i) => {
                            const td = "px-3 py-2 border-b border-[var(--border-c)] text-center tabular-nums";
                            return (
                              <tr key={r.id} onClick={() => setSelEmp(selEmp === r.id ? null : r.id)} className={`cursor-pointer hover:bg-gray-50/60 ${selEmp === r.id ? "bg-gray-50" : ""}`}>
                                <td className="px-3 py-2 border-b border-[var(--border-c)] text-gray-400">{i + 1}</td>
                                <td className="px-3 py-2 border-b border-[var(--border-c)] font-bold">{r.nome}</td>
                                <td className="px-3 py-2 border-b border-[var(--border-c)] text-gray-500">{r.client} · {r.store}</td>
                                <td className={td}>{r.c.falta}</td><td className={td}>{r.c.meia}</td><td className={td}>{r.c.abandono}</td>
                                <td className={td + " font-extrabold"}>{totalFaltas(r.c)}</td>
                                <td className={td} style={r.c.sem > 0 ? { color: "#ef4444", fontWeight: 700 } : {}}>{r.c.sem}</td>
                                <td className={td}>{r.weeks.size}</td><td className={td}>{r.months.size}</td>
                                <td className={td + " whitespace-nowrap"}>{fmtDMY(r.last)}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </>
                )}
              </Card>

              {recurrence.length > 0 && (
                <Card title="Recorrência mensal · Top 10" className="mb-5" right={<span className="text-[11px] text-gray-400">Faltas por mês no período</span>}>
                  <div className="overflow-x-auto">
                    <table className="w-full text-xs" style={{ minWidth: 220 + periodMonths.length * 64 }}>
                      <thead>
                        <tr className="text-[10px] uppercase tracking-wide text-gray-400 text-center">
                          <th className="px-3 py-2 border-b border-[var(--border-c)] text-left">Motorista</th>
                          {periodMonths.map((mk) => <th key={mk} className="px-2 py-2 border-b border-[var(--border-c)] whitespace-nowrap">{monthShort(mk)}</th>)}
                        </tr>
                      </thead>
                      <tbody>
                        {recurrence.map(({ e, per }) => (
                          <tr key={e.id}>
                            <td className="px-3 py-1 border-b border-[var(--border-c)] font-semibold whitespace-nowrap">{e.nome}</td>
                            {per.map((n, i) => (
                              <td key={i} className="px-1 py-1 border-b border-[var(--border-c)]">
                                <div className="rounded-md h-7 flex items-center justify-center font-bold tabular-nums" style={n ? { background: `rgba(239,68,68,${0.12 + 0.75 * (n / recMax)})`, color: n / recMax > 0.55 ? "#fff" : "#991b1b" } : { color: "#9ca3af" }}>{n}</div>
                              </td>
                            ))}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </Card>
              )}

              {selEmp && histInfo && (
                <Card title={`Histórico individual · ${selEmpName}`} className="mb-5" right={<button onClick={() => setSelEmp(null)} className="text-xs font-semibold text-gray-500">Fechar</button>}>
                  <p className="text-[11px] text-gray-400 mb-3">Todos os meses carregados ({monthShort(loadMonths[0])} – {monthShort(loadMonths[loadMonths.length - 1])}), independentemente dos filtros de período, semana e tipo. Escolha “Últimos 12 meses” para um histórico mais longo.</p>
                  <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-4">
                    <MiniStat label="Total" value={totalFaltas(histInfo.c)} color="#ef4444" />
                    <MiniStat label="Faltas" value={histInfo.c.falta} />
                    <MiniStat label="Meias faltas" value={histInfo.c.meia} />
                    <MiniStat label="Abandonos" value={histInfo.c.abandono} />
                    <MiniStat label="Sem backup" value={histInfo.c.sem} color="#ef4444" />

                            ))}
                            <div className="pt-1"><b className="text-[var(--text-primary)]">Semanas:</b> {histInfo.weeks.map(weekRangeLabel).join(" · ")}</div>
                            <div><b className="text-[var(--text-primary)]">Dia da semana:</b> {DIAS_SEMANA.map((d, i) => `${d} ${histInfo.dow[i]}`).join(" · ")}</div>
                          </div>

                      <OccurrenceTable items={histRecs} />

          {tab === "clientes" && (
            <>
              <RankSection title="Ranking por Cliente" rows={cliRows} selected={selCli} onSelect={setSelCli} emptyText="Sem faltas para os filtros selecionados." />
              <RankSection title="Ranking por Loja" rows={lojaRows} selected={selLoja} onSelect={setSelLoja} showParent emptyText="Sem faltas para os filtros selecionados." />
              <p className="text-[11px] text-gray-400 leading-relaxed">Cada célula da grelha marcada como Backup Interno (incluindo atribuições da loja pool, contadas na loja coberta) ou Backup Externo conta como uma falta com backup interno/externo. “Sem backup” = faltas sem nenhum backup da mesma loja no mesmo dia, semana ou mês (cada backup cobre uma única falta).</p>
            </>
          )}

        </>
      )}
    </div>
  );
}

/* @@CORE-START — NÚCLEO DE REGRAS (lógica pura, sem UI, testável)         */
/* Partilhado por Registo Diário, Grelha, Centro de Comando e Alertas.     */

const APP_NAME = "Presenças - Colaboradores Delivery Express";
const todayISO = () => dateKey(new Date());
const mkOfISO = (iso) => iso.slice(0, 7);
const dayOfISO = (iso) => Number(iso.slice(8, 10));
const shiftISO = (iso, n) => dateKey(addDays(parseISO(iso), n));
const fmtLongDate = (iso) => { const s = parseISO(iso).toLocaleDateString("pt-PT", { weekday: "long", day: "numeric", month: "long", year: "numeric" }); return s.charAt(0).toUpperCase() + s.slice(1); };
const fmtPct = (v) => (v === null || v === undefined ? "—" : `${String(v).replace(".", ",")}%`);
const pct1 = (num, den) => (den > 0 ? Math.round((num / den) * 1000) / 10 : null);
const MIN_DAY_SAMPLE = 5;    // amostra mínima para mostrar taxa de presença diária
const MIN_MONTH_SAMPLE = 20; // amostra mínima para taxas mensais / tendências

// Um colaborador "Desligado" conta até ao dia da saída (inclusive); sem data de saída não conta (regra herdada da grelha).
// dataEntrada (novo, opcional): não aparece antes do 1.º dia de trabalho.
const empActiveOn = (e, iso) => (!e.dataEntrada || e.dataEntrada <= iso) && (e.estado !== "Desligado" || (!!e.desligadoData && e.desligadoData >= iso));

// Loja do colaborador numa data. lojaHist (novo, aditivo) guarda mudanças de loja a partir desta versão;
// sem histórico usa a loja atual (comportamento original).
function storeIdOn(emp, iso) {
  const h = emp && Array.isArray(emp.lojaHist) ? emp.lojaHist : null;
  if (h && h.length && iso) {
    let pick = null;
    h.forEach((x) => { if (x && x.desde <= iso && (!pick || x.desde >= pick.desde)) pick = x; });
    if (pick && pick.lojaId) return pick.lojaId;
  }
  return emp ? emp.lojaId : "";
}

// Valor efetivo de uma célula: valor guardado; senão "Folga" se o dia da semana for folga fixa (virtual, não gravado).
function effectiveCell(emp, cells, iso) {
  const saved = (cells || {})[cellKey(emp.id, dayOfISO(iso))] || "";
  if (saved) return { val: saved, auto: false };
  if ((emp.folgaFixa || []).includes(parseISO(iso).getDay())) return { val: "Folga", auto: true };
  return { val: "", auto: false };
}

// Classificação operacional de um valor de célula.
//  pending  = ainda não verificado (célula vazia)            -> NÃO é ausência
//  na       = "Bloqueado" (sem preenchimento / não aplicável) -> fora do universo esperado
//  ok       = presença confirmada
//  abs      = Falta / Meia Falta / Abandono (ausência)
//  covered  = célula "Backup Interno"/"Backup Externo" (ausência coberta, regra original)
//  pool     = colaborador da loja pool atribuído a uma loja (ID de loja na célula)
//  other    = Folga, Formação, Baixa, Desligado
//  unknown  = valor que não é estado nem loja existente (ex.: loja eliminada) -> inconsistência
function valKind(val, storeIds) {
  if (!val) return "pending";
  if (val === "Bloqueado") return "na";
  if (val === "OK") return "ok";
  if (ABS_TYPES.includes(val)) return "abs";
  if (val === "Backup Interno" || val === "Backup Externo") return "covered";
  if (STATUS_VALUE_SET.has(val)) return "other";
  if (storeIds && storeIds.has(val)) return "pool";
  return "unknown";
}

// Universo esperado de um dia: colaboradores ativos nessa data, com loja existente.
// Clientes inativos são excluídos por defeito (o histórico continua intacto nas análises).
function buildDayRoster({ iso, employees, stores, clients, cells, includeInactive = false }) {
  const storeById = new Map(stores.map((s) => [s.id, s]));
  const clientById = new Map(clients.map((c) => [c.id, c]));
  const storeIds = new Set(stores.map((s) => s.id));
  const rows = [];
  employees.forEach((e) => {
    // Fora do período (antes de entrar / depois de sair) só aparece se já houver registo gravado nesse dia (histórico).
    if (!empActiveOn(e, iso)) { const sv = (cells || {})[cellKey(e.id, dayOfISO(iso))]; if (!sv || sv === "Bloqueado") return; }
    const st = storeById.get(storeIdOn(e, iso));
    if (!st) return;
    const cl = st.clienteId ? clientById.get(st.clienteId) || null : null;
    if (!includeInactive && cl && cl.ativo === false) return;
    const { val, auto } = effectiveCell(e, cells, iso);
    rows.push({ key: e.id, emp: e, store: st, client: cl, val, auto, kind: valKind(val, storeIds), isPool: st.tipo === "backup_pool" });
  });
  return rows;
}

function rosterStats(rows) {
  const s = { universe: 0, pending: 0, verified: 0, ok: 0, abs: 0, covered: 0, pool: 0, other: 0, na: 0, unknown: 0 };
  rows.forEach((r) => {
    if (r.kind === "na") { s.na++; return; }
    s.universe++;
    s[r.kind]++;
    if (r.kind !== "pending") s.verified++;
  });
  s.completion = pct1(s.verified, s.universe);
  return s;
}

// Plano de alteração de estado — regra única usada pela Grelha e pelo Registo Diário.
// Replica exatamente o comportamento original (Abandono/Desligado bloqueiam o resto do mês e desativam o colaborador;
// alterar a célula de saída reativa e limpa os bloqueios automáticos).
function planStatusChange({ emp, empId, y, m0, day, cells, value, isPool, storeName, alwaysConfirmExit }) {
  const nd = daysInMonth(y, m0);
  const k = cellKey(empId, day);
  const prevVal = (cells || {})[k] || "";
  const exitDate = isoDate(y, m0, day);
  const lbl = (v) => (isPool && storeName && storeName(v)) || (v ? (STATUS_VALUE_SET.has(v) ? statusMeta(v).label : v) : "—");
  const base = `${MESES[m0]}/${y}, dia ${day}: "${lbl(prevVal)}" → "${lbl(value)}"`;
  const nome = (emp && emp.nome) || "Colaborador";
  if (value === prevVal) return { noop: true, batch: {}, log: base };

  if (EXIT_STATUSES.includes(value)) {
    const batch = { [k]: value };
    let overwrites = 0;
    for (let d = day + 1; d <= nd; d++) {
      const kk = cellKey(empId, d);
      const cur = (cells || {})[kk] || "";
      if (cur && cur !== "Bloqueado") overwrites++;
      batch[kk] = "Bloqueado";
    }
    const confirm = overwrites > 0
      ? `${nome}: ${value} no dia ${day}.\n\nOs ${overwrites} dia(s) seguintes já preenchidos vão passar a "Sem preenchimento" e o colaborador será desativado (data de saída ${fmtDMY(exitDate)}).\n\nContinuar?`
      : (alwaysConfirmExit ? `${nome}: ${value} no dia ${day}.\n\nOs restantes dias do mês ficam "Sem preenchimento" e o colaborador será desativado (data de saída ${fmtDMY(exitDate)}).\n\nContinuar?` : null);
    return { batch, overwrites, confirm, exit: true, empUpdate: emp ? { estado: "Desligado", desligadoData: exitDate } : null,
      log: `${base} · restantes dias sem preenchimento · desativado (saída ${fmtDMY(exitDate)})` };
  }
  if (EXIT_STATUSES.includes(prevVal) && emp && emp.estado === "Desligado" && emp.desligadoData === exitDate) {
    const batch = { [k]: value };
    for (let d = day + 1; d <= nd; d++) { const kk = cellKey(empId, d); if (((cells || {})[kk] || "") === "Bloqueado") batch[kk] = ""; }
    return { batch, confirm: null, reactivate: true, empUpdate: { estado: "Ativo", desligadoData: "" }, log: `${base} · colaborador reativado` };
  }
  return { batch: { [k]: value }, confirm: null, empUpdate: null, log: base };
}


/* ---------------------- REGRAS DE PRESENÇA (definição da direção) ----------------------
   • "Falta" / "Meia Falta" / "Abandono" sem reposição = ninguém foi colocado no lugar -> a presença CAI.
   • "Backup Interno" / "Backup Externo" = o colaborador faltou mas pusemos alguém -> a presença NÃO cai.
   • Atribuição da loja pool no mesmo dia e na mesma loja também é reposição (backup interno):
     primeiro preenche as células "Backup Interno" dessa loja/dia (dá o nome de quem foi), as restantes repõem faltas.
   • Postos previstos = OK + Falta + Meia Falta + Abandono + Backup Interno + Backup Externo
     (Folga, Baixa, Formação, Desligado, Sem preenchimento e por confirmar não são postos).
   • Presença = (postos − faltas sem reposição) ÷ postos. Meia Falta sem reposição pesa 0,5.          */
const emptyCounts = () => ({ ok: 0, falta: 0, meia: 0, abandono: 0, baixa: 0, formacao: 0, bkpInt: 0, bkpExt: 0, folga: 0, bloq: 0, pool: 0, desl: 0, cInt: 0, cExt: 0, sem: 0, semW: 0 });
function addRec(c, r) {
  switch (r.st) {
    case "OK": c.ok++; break;
    case "Falta": c.falta++; break;
    case "Meia Falta": c.meia++; break;
    case "Abandono": c.abandono++; break;
    case "Baixa": c.baixa++; break;
    case "Formação": c.formacao++; break;
    case "Backup Interno": c.bkpInt++; c.cInt++; break;
    case "Backup Externo": c.bkpExt++; c.cExt++; break;
    case "Folga": c.folga++; break;
    case "Bloqueado": c.bloq++; break;
    case "Desligado": c.desl++; break;
    case "Pool": c.pool++; break;
    default: break;
  }
  if (ABS_TYPES.includes(r.st)) {
    if (r.cob === "int") c.cInt++;
    else if (r.cob === "ext") c.cExt++;
    else if (r.cob === "sem") { c.sem++; c.semW += r.st === "Meia Falta" ? 0.5 : 1; }
  }
}
const totalFaltas = (c) => c.falta + c.meia + c.abandono;                     // células de ausência (sem contar backups)
const totalAusencias = (c) => c.falta + c.meia + c.abandono + c.bkpInt + c.bkpExt; // todas as faltas do colaborador
const totalRepostas = (c) => c.cInt + c.cExt;
// pend = colaboradores ainda por confirmar (só nas vistas de um dia): contam como posto previsto NÃO assegurado
// até serem confirmados — o dia nunca aparece a 100% com confirmações em falta.
const postosOf = (c) => c.ok + totalAusencias(c) + (c.pend || 0);
const assuredOf = (c) => postosOf(c) - c.semW - (c.pend || 0);
const totalBkpInt = (c) => c.cInt;
const outrosEstados = (c) => c.formacao + c.folga + c.bloq;
const presencaPct = (c) => { const p = postosOf(c); return p > 0 ? Math.round((assuredOf(c) / p) * 1000) / 10 : null; };
const countRecs = (recs) => { const c = emptyCounts(); recs.forEach((r) => addRec(c, r)); return c; };
const isAbsence = (r) => ABS_TYPES.includes(r.st) || r.st === "Backup Interno" || r.st === "Backup Externo";
const fmtNum = (n) => String(Math.round(n * 10) / 10).replace(".", ",");

// Reposição avaliada no próprio dia e na própria loja.
function annotateCoverage(recs) {
  const groups = new Map();
  recs.forEach((r) => {
    if (r.st === "Backup Externo") { r.cob = "ext"; return; }
    if (!r.storeId) { if (ABS_TYPES.includes(r.st)) r.cob = "sem"; return; }
    if (r.st !== "Pool" && r.st !== "Backup Interno" && !ABS_TYPES.includes(r.st)) return;
    const k = r.storeId + "|" + r.date;
    let g = groups.get(k); if (!g) { g = { pool: [], bi: [], abs: [] }; groups.set(k, g); }
    if (r.st === "Pool") g.pool.push(r); else if (r.st === "Backup Interno") g.bi.push(r); else g.abs.push(r);
  });
  const order = { "Falta": 0, "Abandono": 1, "Meia Falta": 2 };
  groups.forEach((g) => {
    const pool = g.pool.slice().sort((a, b) => a.emp.localeCompare(b.emp));
    g.bi.forEach((r) => { r.cob = "int"; const p = pool.shift(); if (p) { r.cobBy = p.emp; p.covers = r.emp; } });
    g.abs.sort((a, b) => order[a.st] - order[b.st] || a.emp.localeCompare(b.emp)).forEach((r) => {
      const p = pool.shift();
      if (p) { r.cob = "int"; r.cobBy = p.emp; p.covers = r.emp; } else r.cob = "sem";
    });
  });
}

/* ---------------------------- MOTOR DE ALERTAS ---------------------------- */
const PRIO = {
  critico: { label: "Crítico", color: "#dc2626", rank: 0 },
  alto:    { label: "Alto", color: "#ea580c", rank: 1 },
  medio:   { label: "Médio", color: "#b45309", rank: 2 },
  info:    { label: "Informativo", color: "#2563eb", rank: 3 },
};
const PRIO_RULES = [
  ["Crítico", "Cliente com falta sem reposição hoje ou ontem."],
  ["Alto", "Cliente com várias faltas sem reposição nos últimos 7 dias; motorista com o dobro do limite de faltas."],
  ["Médio", "Cliente com uma falta sem reposição nos últimos 7 dias; motorista que atingiu o limite de faltas."],
];
const ALERT_FIELDS = [
  ["motSem", "Motorista: faltas nos últimos 7 dias ≥"],
  ["motMes", "Motorista: faltas nos últimos 30 dias ≥"],
  ["semBkpSem", "Cliente: faltas sem reposição em 7 dias para prioridade Alta ≥"],
];
const safeKey = (s) => String(s).replace(/[.~*/\[\]`]/g, "_");
const listDates = (recs) => [...new Set(recs.map((r) => r.date))].sort().map((d) => fmtDMY(d).slice(0, 5)).join(", ");
const absLabel = (r) => (r.st === "Backup Interno" || r.st === "Backup Externo" ? "Falta" : r.st === "Meia Falta" ? "Meia falta" : r.st);
const covLabel = (r) => (r.cob === "sem" ? "Sem reposição" : r.cob === "ext" ? "Backup externo" : r.cob === "int" ? `Backup interno${r.cobBy ? " · " + r.cobBy : ""}` : "");

// Só dois tipos de alerta: clientes com faltas sem reposição e motoristas reincidentes.
function buildAllAlerts({ data, employees, clients, cfg, todayIso }) {
  const out = [];
  const empById = new Map(employees.map((e) => [e.id, e]));
  const clientById = new Map(clients.map((c) => [c.id, c]));
  const activeCli = (cid) => { const c = clientById.get(cid); return !c || c.ativo !== false; };
  const from7 = shiftISO(todayIso, -6), from30 = shiftISO(todayIso, -29), yest = shiftISO(todayIso, -1);
  const recs = data.recs.filter((r) => r.date <= todayIso && activeCli(r.clientId));

  // 1) Clientes com faltas sem reposição (7 dias)
  const sem = recs.filter((r) => ABS_TYPES.includes(r.st) && r.cob === "sem" && r.date >= from7);
  groupCount(sem, (r) => r.clientId || "_none").forEach((e) => {
    const recent = e.recs.some((r) => r.date >= yest);
    const sev = recent ? "critico" : e.n >= cfg.semBkpSem ? "alto" : "medio";
    const byEmp = [...groupCount(e.recs, (r) => r.empId).values()].map((x) => `${x.recs[0].emp} (${listDates(x.recs)})`).join(" · ");
    const r0 = e.recs[0];
    const last = e.recs.map((r) => r.date).sort().pop();
    out.push({
      key: safeKey(`cliSem|${e.k}`), sig: e.recs.map((r) => r.date + r.empId).sort().join(","), kind: "Cliente com faltas sem reposição", sev,
      period: `${fmtDMY(from7)} – ${fmtDMY(todayIso)}`, date: last, title: `${r0.client} · ${fmtNum(e.recs.reduce((a, r) => a + (r.st === "Meia Falta" ? 0.5 : 1), 0))} falta(s) sem reposição`,
      entity: [...new Set(e.recs.map((r) => r.store))].join(", "), summary: byEmp,
      clientIds: [r0.clientId], empIds: [...new Set(e.recs.map((r) => r.empId))], recs: e.recs,
      nav: { view: "report", params: { date: last, clientId: r0.clientId }, label: "Abrir relatório do dia" },
    });
  });

  // 2) Motoristas reincidentes (todas as faltas, com ou sem reposição)
  const abs30 = recs.filter((r) => isAbsence(r) && r.date >= from30 && empById.has(r.empId));
  groupCount(abs30, (r) => r.empId).forEach((e) => {
    const n7 = e.recs.filter((r) => r.date >= from7).length;
    const hit30 = e.n >= cfg.motMes, hit7 = n7 >= cfg.motSem;
    if (!hit30 && !hit7) return;
    const sev = e.n >= cfg.motMes * 2 || n7 >= cfg.motSem * 2 ? "alto" : "medio";
    const r0 = e.recs.slice().sort((a, b) => b.date.localeCompare(a.date))[0];
    const semN = e.recs.filter((r) => r.cob === "sem").length;
    out.push({
      key: safeKey(`emp|${e.k}`), sig: String(e.n) + "|" + n7, kind: "Motorista reincidente", sev, period: `${fmtDMY(from30)} – ${fmtDMY(todayIso)}`, date: r0.date,
      title: `${r0.emp} · ${e.n} falta(s) em 30 dias`, entity: `${r0.client} · ${r0.store}`,
      summary: `${n7} nos últimos 7 dias · ${semN} sem reposição · ${e.n - semN} com backup. Datas: ${listDates(e.recs)}.`,
      clientIds: [r0.clientId], empIds: [e.k], recs: e.recs, nav: { view: "employee", params: { empId: e.k }, label: "Abrir colaborador" },
    });
  });
  return out.sort((a, b) => PRIO[a.sev].rank - PRIO[b.sev].rank || (b.date || "").localeCompare(a.date || ""));
}

const OFF_STATES = ["Folga", "Formação", "Baixa"];
// Resumo por cliente → loja de um dia (base do relatório para WhatsApp e do Centro de Comando).
function buildDayReports({ iso, recs, employees, stores, clients, cells }) {
  const roster = buildDayRoster({ iso, employees, stores, clients, cells: cells || {} });
  const byClient = new Map();
  const getC = (cl) => {
    const id = cl ? cl.id : "_none";
    let C = byClient.get(id);
    if (!C) { C = { id, nome: cl ? cl.nome : "Sem cliente", cor: cl ? cl.cor || "#64748b" : "#64748b", c: emptyCounts(), pending: 0, stores: new Map() }; byClient.set(id, C); }
    return C;
  };
  const getS = (C, st) => {
    let S = C.stores.get(st.id);
    if (!S) { S = { id: st.id, nome: st.nome, ordem: st.ordem ?? 0, c: emptyCounts(), pending: 0, abs: [], present: [], off: [] }; C.stores.set(st.id, S); }
    return S;
  };
  const storeById = new Map(stores.map((s) => [s.id, s]));
  roster.forEach((row) => {
    if (row.isPool) return;
    const C = getC(row.client), S = getS(C, row.store);
    if (row.kind === "pending") { S.pending++; C.pending++; }
    if (row.kind === "other" && OFF_STATES.includes(row.val)) S.off.push({ emp: row.emp.nome, st: row.val });
  });
  recs.forEach((r) => {
    if (r.date !== iso || r.st === "Pool" || !byClient.has(r.clientId || "_none")) return;
    const C = byClient.get(r.clientId || "_none");
    const st = storeById.get(r.storeId);
    if (!st || st.tipo === "backup_pool") return;
    const S = getS(C, st);
    addRec(S.c, r); addRec(C.c, r);
    if (isAbsence(r)) S.abs.push(r);
    if (r.st === "OK") S.present.push(r.emp);
  });
  byClient.forEach((C) => { C.c.pend = C.pending; C.stores.forEach((S) => { S.c.pend = S.pending; }); });
  return [...byClient.values()].map((C) => ({ ...C, stores: [...C.stores.values()].filter((S) => postosOf(S.c) > 0 || S.pending > 0 || S.off.length > 0).sort((a, b) => a.ordem - b.ordem || a.nome.localeCompare(b.nome)) }))
    .filter((C) => C.stores.length).sort((a, b) => a.nome.localeCompare(b.nome));
}

const OpsCtx = React.createContext(null);

function friendlyErr(e, what) {
  const code = (e && e.code) || "", msg = String((e && e.message) || e || "");
  if (code === "permission-denied" || /insufficient permissions|permission/i.test(msg)) return `Não foi possível ${what}: o servidor recusou a operação (permissões do Firestore). Fala com o administrador para atualizar as regras.`;
  if (code === "unavailable" || /offline|network/i.test(msg)) return `Sem ligação ao servidor para ${what}. A alteração será enviada quando a ligação voltar.`;
  return `Não foi possível ${what}: ${msg}`;
}

// Carregamento sob pedido de bibliotecas pesadas (ex.: XLSX) com CDNs de reserva
const _scriptLoads = {};
function loadScriptOnce(globalName, urls) {
  if (window[globalName]) return Promise.resolve(window[globalName]);
  if (_scriptLoads[globalName]) return _scriptLoads[globalName];
  _scriptLoads[globalName] = new Promise((resolve, reject) => {
    const tryOne = (i) => {
      if (i >= urls.length) { delete _scriptLoads[globalName]; reject(new Error("Não foi possível carregar a biblioteca " + globalName + " (verifica a ligação).")); return; }
      const s = document.createElement("script");
      s.src = urls[i];
      s.onload = () => (window[globalName] ? resolve(window[globalName]) : tryOne(i + 1));
      s.onerror = () => { s.remove(); tryOne(i + 1); };
      document.head.appendChild(s);
    };
    tryOne(0);
  });
  return _scriptLoads[globalName];
}
const XLSX_URLS = ["https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js", "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js", "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"];
async function exportXlsx(filename, sheets) {
  const X = await loadScriptOnce("XLSX", XLSX_URLS);
  const wb = X.utils.book_new();
  sheets.forEach(({ name, rows }) => {
    const ws = X.utils.json_to_sheet(rows.length ? rows : [{ Info: "Sem dados para os critérios selecionados" }]);
    const keys = Object.keys(rows[0] || { Info: "" });
    ws["!cols"] = keys.map((k) => ({ wch: Math.min(48, Math.max(10, k.length + 2, ...rows.slice(0, 200).map((r) => String(r[k] ?? "").length + 1))) }));
    X.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  X.writeFile(wb, filename);
}

function downloadBlob(filename, text, type = "application/json") {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function SyncIndicator({ sync }) {
  let icon = ICONS.cloud, label = "Sincronizado", cls = "sync-ok", tip = "Todas as alterações estão gravadas no servidor (Firestore).";

  else if (sync.pending > 0) { icon = ICONS.refresh; label = "A gravar…"; cls = "sync-busy"; tip = "Existem alterações ainda não confirmadas pelo servidor."; }
  if (sync.error) { icon = ICONS.alert; label = "Erro ao gravar"; cls = "sync-err"; tip = sync.error; }
  return <span className={`sync ${cls}`} title={tip}><Icon path={icon} size={13} className={label === "A gravar…" ? "spin" : ""} /><span className="hidden sm:inline">{label}</span></span>;
}

          <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Colaborador, cliente, loja ou área…" className="flex-1 py-3.5 bg-transparent outline-none text-sm"
            onKeyDown={(e) => { if (e.key === "ArrowDown") { e.preventDefault(); setIdx((i) => Math.min(items.length - 1, i + 1)); } else if (e.key === "ArrowUp") { e.preventDefault(); setIdx((i) => Math.max(0, i - 1)); } else if (e.key === "Enter") run(items[idx]); else if (e.key === "Escape") onClose(); }} />
          <kbd>Esc</kbd>
        </div>
        <div className="max-h-[50vh] overflow-y-auto py-1.5">
          {items.length === 0 && <div className="text-sm text-[var(--text-secondary)] px-4 py-6 text-center">Sem resultados.</div>}
          {items.map((i, k) => (
            <button key={i.t + i.label + k} onMouseEnter={() => setIdx(k)} onClick={() => run(i)} className={`w-full flex items-center gap-3 px-4 py-2.5 text-left ${k === idx ? "bg-[var(--hover)]" : ""}`}>
              <span className="kpi-ico"><Icon path={i.icon} size={14} /></span>
              <span className="flex-1 min-w-0"><span className="block text-sm font-semibold truncate">{i.label}</span>{i.sub && <span className="block text-[11px] text-[var(--text-secondary)] truncate">{i.sub}</span>}</span>
              <span className="text-[10px] font-bold uppercase tracking-wide text-[var(--text-secondary)]">{i.t}</span>
            </button>
          ))}
        </div>
      </div>
    </div>,
    document.body
  );
}

function DailyRegisterView({ params }) {
  const ops = useOps();
  const { stores, employees, clients } = ops;
  const [date, setDate] = useState((params && params.date) || todayISO());
  const [fClient, setFClient] = useState((params && params.clientId) || "");
  const [fView, setFView] = useState((params && params.filter) || "todos");
  const [q, setQ] = useState("");
  const [showInactive, setShowInactive] = useState(false);
  const [closed, setClosed] = useState({});
  const [doc, setDoc] = useState(null);
  const [err, setErr] = useState("");
  const [noteEdit, setNoteEdit] = useState(null);
  const [moreFor, setMoreFor] = useState(null);
  const [people, setPeople] = useState(null); // { type: "add"|"swap"|"exit", emp, storeId, isPool }
  const [busy, setBusy] = useState({});
  const listRef = useRef(null);

  useEffect(() => {
    if (!params) return;
    if (params.date) setDate(params.date);
    if (params.clientId !== undefined) setFClient(params.clientId || "");
    if (params.filter) setFView(params.filter);
  }, [params]);

  const mk = mkOfISO(date);
  const day = dayOfISO(date);
  useEffect(() => {
    let alive = true;
    setErr("");
    ops.getMonthDoc(mk).then((d) => { if (alive) setDoc({ mk, ...d }); }).catch((e) => { if (alive) setErr(String((e && e.message) || e)); });
    return () => { alive = false; };
  }, [mk, ops.version]);

  useEffect(() => {
    const k = (e) => {
      if (!e.altKey) return;
      if (e.key === "ArrowLeft") { e.preventDefault(); setDate((d) => shiftISO(d, -1)); }
      if (e.key === "ArrowRight") { e.preventDefault(); setDate((d) => shiftISO(d, 1)); }
    };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, []);

  const ready = !!doc && doc.mk === mk;
  const cells = ready ? doc.cells : null;
  const storeName = useCallback((id) => (stores.find((s) => s.id === id) || {}).nome || "", [stores]);
  const rows = useMemo(() => (ready ? buildDayRoster({ iso: date, employees, stores, clients, cells, includeInactive: showInactive }) : []), [ready, date, employees, stores, clients, cells, showInactive]);
  const monthRecs = useMemo(() => {
    if (!ready) return [];
    const r = buildRecords({ [mk]: cells }, employees, stores, clients);
    annotateCoverage(r);
    return r;
  }, [ready, mk, cells, employees, stores, clients]);
  const covByEmp = useMemo(() => { const m = new Map(); monthRecs.forEach((r) => { if (r.date === date && (isAbsence(r) || r.st === "Pool")) m.set(r.empId, r); }); return m; }, [monthRecs, date]);

  const clientOpts = useMemo(() => {
    const m = new Map();
    rows.forEach((r) => { const id = r.client ? r.client.id : "_none"; let e = m.get(id); if (!e) { e = { id, nome: r.client ? r.client.nome : "Sem cliente", cor: r.client ? r.client.cor : "#9ca3af", n: 0, p: 0 }; m.set(id, e); } e.n++; if (r.kind === "pending") e.p++; });
    return [...m.values()].sort((a, b) => a.nome.localeCompare(b.nome));
  }, [rows]);
  const scoped = useMemo(() => rows.filter((r) => !fClient || (r.client ? r.client.id : "_none") === fClient), [rows, fClient]);
  const st = useMemo(() => rosterStats(scoped), [scoped]);
  const dayC = useMemo(() => {
    const ids = new Set(scoped.map((r) => r.store.id));
    const c = countRecs(monthRecs.filter((r) => r.date === date && (ids.has(r.storeId) || (!fClient && !r.storeId))));
    c.pend = scoped.filter((r) => r.kind === "pending" && !r.isPool).length;
    return c;
  }, [monthRecs, date, scoped, fClient]);
  const qn = normTxt(q);
  const visible = useMemo(() => scoped.filter((r) => {
    if (qn && !normTxt(`${r.emp.nome} ${r.store.nome} ${r.client ? r.client.nome : ""}`).includes(qn)) return false;
    if (fView === "pendentes") return r.kind === "pending";
    if (fView === "ocorrencias") return r.kind === "abs" || r.kind === "covered" || r.kind === "unknown";
    if (fView === "ok") return r.kind === "ok" || r.kind === "pool";
    return true;
  }), [scoped, qn, fView]);
  const groups = useMemo(() => {
    const cm = new Map();
    visible.forEach((r) => {
      const cid = r.client ? r.client.id : "_none";
      let c = cm.get(cid); if (!c) { c = { id: cid, nome: r.client ? r.client.nome : "Sem cliente", cor: r.client ? r.client.cor : "#9ca3af", ativo: !r.client || r.client.ativo !== false, stores: new Map() }; cm.set(cid, c); }
      let s = c.stores.get(r.store.id); if (!s) { s = { store: r.store, rows: [] }; c.stores.set(r.store.id, s); }
      s.rows.push(r);
    });
    return [...cm.values()].sort((a, b) => a.nome.localeCompare(b.nome)).map((c) => ({ ...c, stores: [...c.stores.values()].sort((a, b) => (a.store.ordem ?? 0) - (b.store.ordem ?? 0) || a.store.nome.localeCompare(b.store.nome)).map((s) => ({ ...s, rows: s.rows.sort((a, b) => a.emp.nome.localeCompare(b.emp.nome)) })) }));
  }, [visible]);
  const allPendingInScope = useMemo(() => rosterStats(rows).pending, [rows]);

  const moveFocus = (key, dir) => {
    if (!listRef.current) return;
    const els = [...listRef.current.querySelectorAll("[data-rowkey]")];
    const i = els.findIndex((e) => e.dataset.rowkey === key);
    const t = els[i + dir];
    if (t) t.focus();
  };
  const setStatus = async (r, v, advance) => {
    setMoreFor(null);
    setBusy((b) => ({ ...b, [r.key]: true }));
    let ok = false;
    try { ok = await ops.changeStatus({ mk, day, empId: r.emp.id, value: v, isPool: r.isPool, source: "daily" }); }
    finally { setBusy((b) => { const n = { ...b }; delete n[r.key]; return n; }); }
    if (ok && advance) setTimeout(() => moveFocus(r.key, 1), 0);
  };
  const onRowKey = (ev, r) => {
    const tg = ev.target.tagName;
    if (tg === "INPUT" || tg === "SELECT" || tg === "TEXTAREA") return;
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    const qs = QUICK_STATES.find((s) => s.key === ev.key);
    if (qs && !r.isPool) { ev.preventDefault(); setStatus(r, qs.v, true); return; }
    if (ev.key === "0" || ev.key === "Backspace" || ev.key === "Delete") { ev.preventDefault(); if (cells && cells[cellKey(r.emp.id, day)]) setStatus(r, "", false); return; }
    if (ev.key === "ArrowDown" || ev.key === "j") { ev.preventDefault(); moveFocus(r.key, 1); }
    if (ev.key === "ArrowUp" || ev.key === "k") { ev.preventDefault(); moveFocus(r.key, -1); }
    if (ev.key === "n" || ev.key === "N") { ev.preventDefault(); setNoteEdit({ key: cellKey(r.emp.id, day), nome: r.emp.nome, text: (doc && doc.notes[cellKey(r.emp.id, day)]) || "" }); }
  };
  const bulkOk = async (storeRows, store) => {
    const targets = storeRows.filter((r) => r.kind === "pending" && !r.isPool);
    if (!targets.length) return;
    if (!window.confirm(`Marcar ${targets.length} colaborador(es) por verificar da loja ${store.nome} como OK em ${fmtDMY(date)}?\n\n${targets.map((r) => "• " + r.emp.nome).join("\n")}`)) return;
    const batch = {};
    targets.forEach((r) => { batch[cellKey(r.emp.id, day)] = "OK"; });
    await ops.bulkSet(mk, batch, `${store.nome} · ${fmtDMY(date)}: ${targets.length} pendente(s) → OK (em lote): ${targets.map((r) => r.emp.nome).join(", ")}`);
  };

  const done = ready && st.universe > 0 && st.pending === 0;
  const isFuture = date > todayISO();

  return (
    <div className="page fade-in">
      <PageHeader eyebrow="Operação" title="Registo Diário" subtitle={fmtLongDate(date)} right={<><DateNav date={date} setDate={setDate} /><button onClick={() => setPeople({ type: "add", storeId: "" })} className="btn btn-ghost"><Icon path={ICONS.plus} size={15} />Adicionar motorista</button><button onClick={() => ops.nav("report", { date, clientId: fClient && fClient !== "_none" ? fClient : "" })} className="btn btn-primary"><Icon path={ICONS.layers} size={15} />Relatório do dia</button></>} />

      {err && <div className="banner banner-err mb-4"><Icon path={ICONS.alert} size={16} />Não foi possível carregar o mês {monthLabelOf(mk)}: {err}</div>}
      {isFuture && <div className="banner banner-info mb-4"><Icon path={ICONS.info} size={16} />Data futura — podes planear folgas, formações ou baixas; as presenças só se confirmam no próprio dia.</div>}

      {/* Progresso do dia */}
      <div className="card p-4 md:p-5 mb-4">
        {!ready ? <Skeleton rows={2} /> : (
          <>
