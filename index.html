function App() {
  const [user, setUser] = useState(() => {
    try { const raw = localStorage.getItem("opsUser"); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  });
  const [view, setView] = useState(() => { try { const v = localStorage.getItem("opsView"); return VIEW_IDS.includes(v) ? v : "daily"; } catch (e) { return "report"; } });
  const [viewParams, setViewParams] = useState(null);
  const [collapsed, setCollapsedState] = useState(() => { try { return localStorage.getItem("opsCollapsed") === "1"; } catch (e) { return false; } });
  const [mobileNav, setMobileNav] = useState(false);
  const [paletteOpen, setPaletteOpen] = useState(false);
  const [empDrawer, setEmpDrawer] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [stores, setStores] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [clients, setClients] = useState([]);
  const [refsLoaded, setRefsLoaded] = useState({ s: false, e: false, c: false });
  const refsReady = refsLoaded.s && refsLoaded.e && refsLoaded.c;
  const [dark, setDark] = useState(() => { try { return localStorage.getItem("opsTheme") === "dark"; } catch (e) { return false; } });
  const [cfg, setCfgState] = useState(() => { try { const raw = localStorage.getItem("opsAlertCfg"); return raw ? { ...ALERT_CFG_DEFAULT, ...JSON.parse(raw) } : { ...ALERT_CFG_DEFAULT }; } catch (e) { return { ...ALERT_CFG_DEFAULT }; } });
  const [alertState, setAlertState] = useState({ reads: {}, follow: {}, seen: {}, loaded: false });
  const [version, setVersion] = useState(0);
  const [sync, setSync] = useState({ online: typeof navigator === "undefined" ? true : navigator.onLine, pending: 0, error: "" });
  const [clock, setClock] = useState(0);

  const monthDocs = useRef({});
  const monthLoads = useRef({});
  const monthUnsubs = useRef([]);
  const pendingSet = useRef(new Set());
  const employeesRef = useRef([]);
  const storesRef = useRef([]);
  const lastSeenWrite = useRef("");
  const alertLocal = useRef(false);
  useEffect(() => { employeesRef.current = employees; }, [employees]);
  useEffect(() => { storesRef.current = stores; }, [stores]);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", dark);
    try { localStorage.setItem("opsTheme", dark ? "dark" : "light"); } catch (e) {}
  }, [dark]);
  const toggleDark = useCallback(() => setDark((d) => !d), []);
  const setCollapsed = useCallback((v) => { setCollapsedState(v); try { localStorage.setItem("opsCollapsed", v ? "1" : "0"); } catch (e) {} }, []);
  const setCfg = useCallback((c) => { setCfgState(c); try { localStorage.setItem("opsAlertCfg", JSON.stringify(c)); } catch (e) {} }, []);

  useEffect(() => {
    const on = () => setSync((s) => ({ ...s, online: true }));
    const off = () => setSync((s) => ({ ...s, online: false }));
    window.addEventListener("online", on); window.addEventListener("offline", off);
    const t = setInterval(() => setClock((c) => c + 1), 10 * 60 * 1000);
    return () => { window.removeEventListener("online", on); window.removeEventListener("offline", off); clearInterval(t); };
  }, []);

  const toast = useCallback((type, text) => {
    const id = uid();
    setToasts((t) => [...t.slice(-3), { id, type, text }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), type === "error" ? 9000 : 3500);
  }, []);
  const nav = useCallback((v, params) => {
    if (v === "employee") { if (params && params.empId) setEmpDrawer(params.empId); return; }
    setView(v);
    setViewParams(params ? { ...params, _t: Date.now() } : null);
    try { localStorage.setItem("opsView", v); } catch (e) {}
    window.scrollTo(0, 0);
  }, []);

  const handleLogin = useCallback((name) => {
    const u = { displayName: name };
    try { localStorage.setItem("opsUser", JSON.stringify(u)); } catch (e) {}
    setUser(u);
  }, []);
  const handleLogout = useCallback(() => {
    try { localStorage.removeItem("opsUser"); } catch (e) {}
    setUser(null);
  }, []);

  // Coleções de referência (lojas / colaboradores / clientes): listeners em tempo real (comportamento original)
  useEffect(() => {
    if (!user) return;
    const mark = (k) => setRefsLoaded((p) => (p[k] ? p : { ...p, [k]: true }));
    const unsub1 = col("stores").orderBy("ordem", "asc").onSnapshot(
      (snap) => { setStores(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); mark("s"); },
      () => col("stores").onSnapshot((snap) => { setStores(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); mark("s"); })
    );
    const unsub2 = col("employees").onSnapshot((snap) => { setEmployees(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); mark("e"); }, (err) => toast("error", "Erro a ler colaboradores: " + err.message));
    const unsub3 = col("clients").onSnapshot((snap) => { setClients(snap.docs.map((d) => ({ id: d.id, ...d.data() }))); mark("c"); }, (err) => toast("error", "Erro a ler clientes: " + err.message));
    // Estado dos alertas (lidos / acompanhamento): guardado num documento da coleção "schedule" (já autorizada).
    // Se o Firestore recusar, passa automaticamente a guardar neste navegador — sem mensagens de erro.
    const unsub4 = ALERT_DOC().onSnapshot((snap) => {
      if (alertLocal.current) return;
      const d = snap.exists ? snap.data() : {};
      setAlertState({ reads: d.reads || {}, follow: d.follow || {}, seen: d.seen || {}, loaded: true });
    }, () => { alertLocal.current = true; setAlertState({ ...readLocalAlerts(), loaded: true }); });
    return () => { unsub1(); unsub2(); unsub3(); unsub4(); };
  }, [user]);

  // Grelha: 1 documento Firestore por mês (schedule/{YYYY-MM}) — formato original preservado.
  // NOVO: cada mês aberto fica ligado em tempo real (onSnapshot) -> alterações de outros utilizadores
  // aparecem sem recarregar; e o estado "por sincronizar" é detetado via hasPendingWrites.
  const ensureMonth = useCallback((mk) => {
    if (monthLoads.current[mk]) return monthLoads.current[mk];
    const p = new Promise((resolve, reject) => {
      let first = true;
      const unsub = col("schedule").doc(mk).onSnapshot({ includeMetadataChanges: true }, (snap) => {
        const d = snap.exists ? snap.data() : {};
        monthDocs.current[mk] = { cells: { ...(d.cells || {}) }, arrivals: { ...(d.arrivals || {}) }, notes: { ...(d.notes || {}) } };
        if (snap.metadata.hasPendingWrites) pendingSet.current.add(mk); else pendingSet.current.delete(mk);
        setSync((s) => (s.pending === pendingSet.current.size ? s : { ...s, pending: pendingSet.current.size }));
        if (first) { first = false; resolve(monthDocs.current[mk]); }
        setVersion((v) => v + 1);
      }, (err) => {
        console.error("Erro no mês " + mk, err);
        if (first) { first = false; delete monthLoads.current[mk]; reject(err); }
        else setSync((s) => ({ ...s, error: "Ligação ao mês " + mk + " interrompida: " + err.message }));
      });
      monthUnsubs.current.push(unsub);
    });
    monthLoads.current[mk] = p;
    return p;
  }, []);
  useEffect(() => () => {
    monthUnsubs.current.forEach((u) => { try { u(); } catch (e) {} });
    monthUnsubs.current = []; monthLoads.current = {}; monthDocs.current = {};
  }, [user]);

  const getScheduleForMonth = useCallback(async (mk) => { await ensureMonth(mk); return monthDocs.current[mk].cells; }, [ensureMonth]);
  const peekSchedule = useCallback((mk) => (monthDocs.current[mk] ? monthDocs.current[mk].cells : null), []);
  const getMonthDoc = useCallback(async (mk) => { await ensureMonth(mk); const d = monthDocs.current[mk]; return { cells: { ...d.cells }, arrivals: { ...d.arrivals }, notes: { ...d.notes } }; }, [ensureMonth]);
  const getArrivalsForMonth = useCallback(async (mk) => (await getMonthDoc(mk)).arrivals, [getMonthDoc]);

  const writeMonth = useCallback((mk, field, obj, revert) => {
    const ref = col("schedule").doc(mk);
    return ref.set({ [field]: obj }, { merge: true }).then(() => {
      setSync((s) => (s.error ? { ...s, error: "" } : s));
    }).catch((err) => {
      console.error("Falha ao gravar", err);
      if (revert) revert();
      setVersion((v) => v + 1);
      setSync((s) => ({ ...s, error: friendlyErr(err, "gravar") }));
      toast("error", friendlyErr(err, "gravar a alteração") + " O valor anterior foi reposto.");
    });
  }, [toast]);

  // Alteração de estado — regra única (planStatusChange) para Grelha e Registo Diário.
  const changeStatus = useCallback(async ({ mk, day, empId, value, isPool, source }) => {
    await ensureMonth(mk);
    const [y, mo] = mk.split("-").map(Number);
    const cells = monthDocs.current[mk].cells;
    const emp = employeesRef.current.find((e) => e.id === empId);
    const plan = planStatusChange({ emp, empId, y, m0: mo - 1, day, cells, value, isPool,
      storeName: (id) => (storesRef.current.find((s) => s.id === id) || {}).nome, alwaysConfirmExit: source === "daily" });
    if (plan.noop) return false;
    if (plan.confirm && !window.confirm(plan.confirm)) return false;
    const prev = {};
    Object.keys(plan.batch).forEach((k) => { prev[k] = cells[k]; });
    Object.assign(cells, plan.batch);
    setVersion((v) => v + 1);
    writeMonth(mk, "cells", plan.batch, () => { const c = monthDocs.current[mk] && monthDocs.current[mk].cells; if (!c) return; Object.keys(prev).forEach((k) => { if (prev[k] === undefined) delete c[k]; else c[k] = prev[k]; }); });
    if (plan.empUpdate) col("employees").doc(empId).set(plan.empUpdate, { merge: true }).catch((err) => toast("error", friendlyErr(err, "atualizar o colaborador")));
    logHistory("Editou", "Grelha", (emp && emp.nome) || "—", plan.log);
    if (plan.exit) toast("info", `${(emp && emp.nome) || "Colaborador"} desativado (saída ${fmtDMY(isoDate(y, mo - 1, day))}).`);
    if (plan.reactivate) toast("info", `${(emp && emp.nome) || "Colaborador"} reativado.`);
    return true;
  }, [ensureMonth, writeMonth, toast]);
  // Compatibilidade com a API anterior
  const saveCellsBatch = useCallback(async (mk, cellsObj) => { await ensureMonth(mk); Object.assign(monthDocs.current[mk].cells, cellsObj); setVersion((v) => v + 1); return writeMonth(mk, "cells", cellsObj); }, [ensureMonth, writeMonth]);
  const saveCellStatus = useCallback((mk, empId, day, value) => saveCellsBatch(mk, { [cellKey(empId, day)]: value }), [saveCellsBatch]);
  const bulkSet = useCallback(async (mk, batch, logText) => {
    await saveCellsBatch(mk, batch);
    logHistory("Editou", "Grelha", "Registo em lote", logText);
    toast("success", `${Object.keys(batch).length} registo(s) gravados.`);
  }, [saveCellsBatch, toast]);
  const saveArrivalTime = useCallback(async (mk, storeId, day, value) => {
    await ensureMonth(mk);
    const key = arrivalKey(storeId, day);
    monthDocs.current[mk].arrivals[key] = value;
    setVersion((v) => v + 1);
    await writeMonth(mk, "arrivals", { [key]: value });
  }, [ensureMonth, writeMonth]);
  const saveNote = useCallback(async (mk, key, text, nome, iso) => {
    await ensureMonth(mk);
    monthDocs.current[mk].notes[key] = text;
    setVersion((v) => v + 1);
    await writeMonth(mk, "notes", { [key]: text });
    logHistory("Editou", "Grelha", nome || "—", `Observação ${fmtDMY(iso)}: ${text ? `"${text}"` : "removida"}`);
  }, [ensureMonth, writeMonth]);

  const saveEmployee = useCallback(async (data) => {
    const nome = String(data.nome || "").trim();
    if (!nome) return false;
    const dup = employeesRef.current.find((e) => e.id !== data.id && normTxt(e.nome) === normTxt(nome));
    if (dup && !window.confirm(`Já existe um colaborador chamado “${dup.nome}”${dup.estado === "Desligado" ? " (desligado)" : ""}.\n\nGuardar mesmo assim?`)) return false;
    const prev = data.id ? employeesRef.current.find((e) => e.id === data.id) : null;
    const payload = { ...data, nome };
    if (payload.estado === "Desligado" && !payload.desligadoData && !window.confirm("Colaborador desligado sem data de desligamento: deixa de aparecer em TODOS os meses da grelha, incluindo os anteriores.\n\nGuardar mesmo assim?")) return false;
    if (prev && prev.lojaId && prev.lojaId !== payload.lojaId) {
      const hist = Array.isArray(prev.lojaHist) && prev.lojaHist.length ? prev.lojaHist.slice() : [{ lojaId: prev.lojaId, desde: "0000-01-01" }];
      hist.push({ lojaId: payload.lojaId, desde: todayISO() });
      payload.lojaHist = hist;
    }
    const storeName = (id) => (storesRef.current.find((s) => s.id === id) || {}).nome || "—";
    try {
      if (data.id) await col("employees").doc(data.id).set(payload, { merge: true });
      else await col("employees").add({ ...payload, criadoEm: Date.now() });
      logHistory(data.id ? "Editou" : "Criou", "Colaborador", nome, `Loja: ${storeName(payload.lojaId)} · Turno: ${payload.turno}${payload.lojaHist && prev && prev.lojaId !== payload.lojaId ? ` · mudou de ${storeName(prev.lojaId)}` : ""}`);
      toast("success", `${nome} guardado.`);
      return true;
    } catch (e) { toast("error", friendlyErr(e, "guardar")); return false; }
  }, [toast]);

  // Troca de motorista: o que sai fica desligado no dia anterior; o novo começa na data escolhida (mesma loja).
  const swapDriver = useCallback(async ({ oldEmp, date, nome, existingId, turno, funcao, veiculo, folgaFixa }) => {
    const lastDay = shiftISO(date, -1);
    const storeName = (id) => (storesRef.current.find((s) => s.id === id) || {}).nome || "—";
    try {
      let newName = nome;
      if (existingId) {
        const ex = employeesRef.current.find((e) => e.id === existingId);
        if (!ex) throw new Error("Colaborador não encontrado.");
        newName = ex.nome;
        const upd = { estado: "Ativo", desligadoData: "" };
        if (ex.estado === "Desligado") upd.dataEntrada = date;
        if (ex.lojaId !== oldEmp.lojaId) {
          const hist = Array.isArray(ex.lojaHist) && ex.lojaHist.length ? ex.lojaHist.slice() : [{ lojaId: ex.lojaId, desde: "0000-01-01" }];
          hist.push({ lojaId: oldEmp.lojaId, desde: date });
          upd.lojaId = oldEmp.lojaId; upd.lojaHist = hist;
        }
        await col("employees").doc(existingId).set(upd, { merge: true });
      } else {
        const dup = employeesRef.current.find((e) => normTxt(e.nome) === normTxt(nome));
        if (dup && !window.confirm(`Já existe um colaborador chamado “${dup.nome}” (${storeName(dup.lojaId)}${dup.estado === "Desligado" ? ", desligado" : ""}).\n\nCriar outro com o mesmo nome? (Para reutilizar o existente, escolhe “Colaborador já registado”.)`)) return false;
        await col("employees").add({ nome, lojaId: oldEmp.lojaId, turno, funcao, veiculo: veiculo || "", folgaFixa: folgaFixa || [], estado: "Ativo", desligadoData: "", dataEntrada: date, substituiu: oldEmp.id, criadoEm: Date.now() });
      }
      await col("employees").doc(oldEmp.id).set({ estado: "Desligado", desligadoData: lastDay, substituidoPor: newName }, { merge: true });
      logHistory("Editou", "Colaborador", oldEmp.nome, `Troca em ${storeName(oldEmp.lojaId)}: sai ${oldEmp.nome} (último dia ${fmtDMY(lastDay)}) · entra ${newName} (desde ${fmtDMY(date)})`);
      toast("success", `${oldEmp.nome} → ${newName} a partir de ${fmtDMY(date)}.`);
      return true;
    } catch (e) { toast("error", friendlyErr(e, "trocar o motorista")); return false; }
  }, [toast]);

  const registerExit = useCallback(async ({ emp, date, type, isPool }) => {
    try {
      if (type === "Abandono") {
        const ok = await changeStatus({ mk: mkOfISO(date), day: dayOfISO(date), empId: emp.id, value: "Abandono", isPool, source: "exit" });
        return ok !== false;
      }
      await col("employees").doc(emp.id).set({ estado: "Desligado", desligadoData: date }, { merge: true });
      logHistory("Editou", "Colaborador", emp.nome, `Desligado · último dia ${fmtDMY(date)}`);
      toast("success", `${emp.nome} desligado (último dia ${fmtDMY(date)}).`);
      return true;
    } catch (e) { toast("error", friendlyErr(e, "registar a saída")); return false; }
  }, [changeStatus, toast]);

  const monthOptions = useMemo(() => {
    const now = new Date(); const arr = [];
    for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); arr.push(monthKey(d.getFullYear(), d.getMonth())); }
    return arr;
  }, []);

  // ---------------- Motor de alertas (mês atual + 3 anteriores) ----------------
  const todayIso = todayISO();
  const engineMonths = useMemo(() => monthWindow(mkOfISO(todayIso), 2), [todayIso]);
  const engine = useOpsData({ months: engineMonths, stores, employees, clients, getScheduleForMonth, enabled: !!user && refsReady, version, peek: peekSchedule });
  const alerts = useMemo(() => (engine.status === "ready"
    ? buildAllAlerts({ data: engine, employees, clients, cfg, todayIso }) : []),
    // eslint-disable-next-line
    [engine.status, engine.recs, engine.schedules, engine.monthHasData, employees, stores, clients, cfg, engineMonths, todayIso, clock]);
  const alertWrite = useCallback((patch) => {
    const applyLocal = () => {
      const cur = readLocalAlerts();
      Object.keys(patch).forEach((grp) => { cur[grp] = cur[grp] || {}; Object.keys(patch[grp]).forEach((k) => { const v = patch[grp][k]; if (v && v._del) delete cur[grp][k]; else cur[grp][k] = v; }); });
      try { localStorage.setItem("opsAlertState", JSON.stringify(cur)); } catch (e) {}
      setAlertState({ ...cur, loaded: true });
    };
    if (alertLocal.current) { applyLocal(); return; }
    const fs = {};
    Object.keys(patch).forEach((grp) => { fs[grp] = {}; Object.keys(patch[grp]).forEach((k) => { const v = patch[grp][k]; fs[grp][k] = v && v._del ? firebase.firestore.FieldValue.delete() : v; }); });
    ALERT_DOC().set(fs, { merge: true }).catch(() => { alertLocal.current = true; applyLocal(); });
  }, []);
  const isUnread = useCallback((a) => { const r = (alertState.reads || {})[a.key]; return !r || r.sig !== a.sig; }, [alertState]);
  const unread = alerts.filter(isUnread).length;
  const markRead = useCallback((list) => {
    if (!list.length) return;
    const reads = {};
    list.forEach((a) => { reads[a.key] = { at: Date.now(), user: (user && user.displayName) || "", sig: a.sig }; });
    alertWrite({ reads });
  }, [user, alertWrite]);
  const toggleFollow = useCallback((key) => {
    const cur = (alertState.follow || {})[key];
    alertWrite({ follow: { [key]: { on: !(cur && cur.on), at: Date.now(), user: (user && user.displayName) || "" } } });
  }, [alertState, user, alertWrite]);
  useEffect(() => {
    if (!user || !alertState.loaded || engine.status !== "ready") return;
    const seen = alertState.seen || {}; const now = Date.now(); const upd = {};
    alerts.forEach((a) => {
      const s = seen[a.key];
      const lastDay = s && s.last ? dateKey(new Date(s.last)) : "";
      if (!s || s.sig !== a.sig || lastDay !== todayIso) upd[a.key] = { title: a.title, kind: a.kind, sev: a.sev, period: a.period, sig: a.sig, first: s && s.first ? s.first : now, last: now };
    });
    Object.keys(seen).forEach((k) => { if (seen[k] && seen[k].last && now - seen[k].last > 180 * 864e5) upd[k] = { _del: true }; });
    const keys = Object.keys(upd);
    if (!keys.length) return;
    const sigKey = todayIso + "|" + keys.sort().map((k) => k + ":" + (upd[k] && upd[k].sig)).join(",");
    if (lastSeenWrite.current === sigKey) return;
    lastSeenWrite.current = sigKey;
    alertWrite({ seen: upd });
  }, [alerts, alertState, engine.status, todayIso, user]);

  // Atalho global de pesquisa
  useEffect(() => {
    const k = (e) => { if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")) { e.preventDefault(); setPaletteOpen((o) => !o); } };
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, []);

  if (!user) return <LoginScreen onLogin={handleLogin} />;

  const ops = {
    user, stores, employees, clients, refsReady, version, monthOptions,
    getScheduleForMonth, peekSchedule, getMonthDoc, changeStatus, bulkSet, saveNote, saveArrivalTime, saveEmployee, swapDriver, registerExit,
    nav, toast, openEmployee: (id) => setEmpDrawer(id),
    alerts, alertsStatus: engine.status, alertState, isUnread, markRead, toggleFollow,
    cfg, setCfg, dark, toggleDark, sync,
  };
  const common = { stores, employees, clients, getScheduleForMonth, monthOptions, refsReady };

  return (
    <OpsCtx.Provider value={ops}>
      <div className="flex min-h-screen">
        <Sidebar view={view} setView={(v) => nav(v)} collapsed={collapsed} setCollapsed={setCollapsed} user={user} onLogout={handleLogout} unread={unread} mobileOpen={mobileNav} setMobileOpen={setMobileNav} />
        <div className="flex-1 min-w-0 flex flex-col">
          <Header user={user} dark={dark} onToggleDark={toggleDark} onMenu={() => setMobileNav(true)} onSearch={() => setPaletteOpen(true)} unread={unread} onAlerts={() => nav("alerts")} sync={sync} />
          {!refsReady ? <div className="page"><Skeleton rows={6} /></div> : (
            <main key={view + ((viewParams && viewParams._t) || "")} className="flex-1 min-w-0">
              {view === "command" && <CommandCenterView />}
              {view === "daily" && <DailyRegisterView params={viewParams} />}
              {view === "grid" && <GridView {...common} saveCellStatus={saveCellStatus} saveCellsBatch={saveCellsBatch} getArrivalsForMonth={getArrivalsForMonth} saveArrivalTime={saveArrivalTime} />}
              {view === "alerts" && <AlertCenterView params={viewParams} />}
              {view === "analyses" && <AnalysisView params={viewParams} />}
              {view === "report" && <DayReportView params={viewParams} />}
              {view === "clients" && <ClientsHubView params={viewParams} />}
              {view === "reports" && <ReportsView params={viewParams} />}
              {view === "settings" && <SettingsView />}
            </main>
          )}
        </div>
      </div>
      {empDrawer && <EmployeeDrawer key={empDrawer} empId={empDrawer} onClose={() => setEmpDrawer(null)} />}
      {paletteOpen && <CommandPalette onClose={() => setPaletteOpen(false)} />}
      <ToastHost toasts={toasts} onDismiss={(id) => setToasts((t) => t.filter((x) => x.id !== id))} />
    </OpsCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ErrorBoundary>
    <App />
  </ErrorBoundary>
);

</script>

<script>
  // Compila o JSX manualmente (evita o conflito de runtime do Babel Standalone
  // quando corre a partir de um <script type="text/babel"> inline em alguns navegadores).
  function showBootError(err) {
    const root = document.getElementById("root");
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#161d2e;padding:24px;font-family:Inter,system-ui,sans-serif;">' +
        '<div style="background:#fff;border-radius:16px;padding:32px;max-width:560px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.3);">' +
          '<h2 style="margin:0 0 12px;color:#e0293b;font-size:18px;">Não foi possível iniciar a aplicação</h2>' +
          '<p style="margin:0 0 12px;color:#6b7280;font-size:13px;">Provável causa: falha ao carregar um script externo (Tailwind, Chart.js, Firebase, React ou Babel) ou erro de sintaxe no código. Verifica a ligação à internet e a consola do browser (F12) para o detalhe abaixo.</p>' +
          '<pre style="white-space:pre-wrap;word-break:break-word;background:#f4f6fa;padding:12px;border-radius:8px;font-size:12px;color:#161d2e;max-height:260px;overflow:auto;">' +
            String((err && (err.stack || err.message)) || err).replace(/</g, "&lt;") +
          '</pre>' +
        '</div>' +
      '</div>';
    console.error("Erro ao compilar/iniciar a aplicação:", err);
  }

  (function () {
    try {
      if (typeof Babel === "undefined") {
        throw new Error("Babel não carregou (verifica a ligação à internet / bloqueadores de script).");
      }
      const el = document.getElementById("app-source");
      if (!el) {
        throw new Error("Bloco de código da aplicação (#app-source) não encontrado no HTML.");
      }
      const src = el.textContent;
      const out = Babel.transform(src, {
        presets: [["react", { runtime: "classic" }]],
        filename: "app.jsx",
        sourceType: "script",
      }).code;
      const tag = document.createElement("script");
      tag.textContent = out;
      tag.onerror = function (e) { showBootError(e); };
      document.body.appendChild(tag);
    } catch (err) {
      showBootError(err);
    }
  })();
</script>
</body>
</html>
